[package]
name = "ruviform-plugin-test-vst3"
description = "Test-only VST3 test plugin suite (test_gain/test_fault/test_editor/test_stateful/test_instrument) for Ruviform host verification — not a shipping product"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# cdylib exports the VST3 module entry points (GetPluginFactory +
# platform hooks) so the built artifact is a real `.vst3`/`.dll`
# module a host can dlopen; rlib keeps the crate unit-testable
# in-process (same shape as `ruviform-plugin-vst3`).
[lib]
crate-type = ["cdylib", "rlib"]

# The test-fixture L1 child-process runner (Issue #630 L1 slice):
# dlopens this crate's own cdylib through the production
# `ruviform-plugin-vst3` `host` bridge and hands the scanned
# factories to `ruviform_plugin_export::run` — the same shape as the
# adapter's `ruviform-plugin-vst3-l1-runner`, kept inside the test
# crate so the adapter's compile-time-fixed fixture name and sources
# stay untouched. `required-features` keeps the binary out of the
# default build — it exists only under `--features l1-runner`.
[[bin]]
name = "ruviform-plugin-test-vst3-l1-runner"
path = "src/bin/ruviform-plugin-test-vst3-l1-runner.rs"
required-features = ["l1-runner"]

[features]
# `l1-runner` — the out-of-process L1 path: the runner binary plus the
# production host bridge (`host` feature of `ruviform-plugin-vst3`) and
# the wire runtime (`ruviform-plugin-export`) it serves. Optional dep
# edges keep the default build and the plugin-side cdylib unchanged;
# the dev-dependency entries below union the same crates for tests.
l1-runner = ["dep:ruviform-plugin-vst3", "dep:ruviform-plugin-export"]

[dependencies]
# SDK-equivalent binding layer — the same `vst3` crate version the
# production adapter uses; shared as the "SDK layer" only (see
# docs/designs/issue-630-test-plugin-suite.md).
vst3 = "0.3.0"
# Neutral plugin contracts (PluginProcessor/Event/EventList/ParamInfo/
# Lifecycle/BufferView) — the plugin-side implementation target.
ruviform-plugin-core = { path = "../ruviform-plugin-core" }
# Neutral MIDI/transport vocabulary (MidiEvent/MidiKind/MusicalTimeInfo)
# consumed by `test_instrument`'s event and transport translation.
ruviform-media-core = { path = "../ruviform-media-core" }
# Zero-copy planar buffer views for the process path.
ruviform-audio-core = { path = "../ruviform-audio-core" }
# Production host bridge for the L1 runner binary — optional regular
# dep enabled only by `l1-runner` (`host` feature supplies
# `Vst3Library`/`factories`). The dev-dependency entry below keeps the
# same crate available to `tests/` without the feature; the two
# entries union features (the `clack-host` precedent in
# `ruviform-plugin-clap`).
ruviform-plugin-vst3 = { path = "../ruviform-plugin-vst3", features = ["host"], optional = true }
# The L1 wire runtime (`run()`) consumed by the runner binary —
# optional so the plugin-side cdylib's dep tree is unchanged.
ruviform-plugin-export = { path = "../ruviform-plugin-export", optional = true }

# `test_editor`'s plugin-side `IPlugView` creates a real `WS_CHILD`
# HWND on Windows — the same Win32 surface a plugin binary would
# create under `open_gui` (Issue #630 AC-4 fixture half). Feature set
# mirrors the `ruviform-poc-native-dock` probe edge minus the
# PoC-only features; off Windows the `win32` module is cfg'd out and
# this edge is inert.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# RT non-allocation proof for the process path (Issue #22 lane
# precedent: `ruviform-plugin-vst3` uses the same dev-dep).
assert_no_alloc = "1.1"
# Production host bridge for the real-file host-path test — dev-dep
# edge only; the adapter itself stays pristine and this crate never
# appears in its dependency tree.
ruviform-plugin-vst3 = { path = "../ruviform-plugin-vst3", features = ["host"] }
# `tests/l1_real_test_plugin_e2e.rs` drives the spawned runner through
# `PluginHost`/`OutOfProcessSpec` — dev-dep direction (test crate →
# host) keeps the dependency DAG acyclic; `plugin-host` depends on no
# adapter or test crate (same edge the adapter e2e suites use).
ruviform-plugin-host = { path = "../ruviform-plugin-host" }
# Issue #628 deferred leg (owned by Issue #630): the attach()
# runtime-integration tests drive the real fixture through
# `ruviform-audio-plugin-bridge::attach` → `PluginNode` →
# `GraphRuntime`, fed by `ruviform-audio-test`'s scripted MIDI backend
# (`MidiFeed`/`MidiScenario`). `ruviform-audio`/`ruviform-graph`/
# `ruviform-rt` are the typed-runtime surface `PluginNode` implements
# (`GraphProcessor`/`RtContext`) — path deps only, no new external
# packages, `Cargo.lock` unchanged.
ruviform-audio = { path = "../ruviform-audio" }
ruviform-audio-plugin-bridge = { path = "../ruviform-audio-plugin-bridge" }
ruviform-audio-test = { path = "../ruviform-audio-test" }
# Issue #253 OS-endpoint e2e (`tests/os_endpoint_midi_e2e.rs`): the
# verifier enumerates/opens the production `SystemBackend` MIDI ports
# (WinMM on Windows, `Unsupported` elsewhere) as the real OS endpoint
# feeding `InputTx::pump`. Path dev-dep only — the plugin cdylib and
# the `l1-runner` runner dep tree are unchanged.
ruviform-midi-device = { path = "../ruviform-midi-device" }
ruviform-graph = { path = "../ruviform-graph" }
ruviform-rt = { path = "../ruviform-rt" }

[lints]
workspace = true

[package]
name = "ruviform-observability"
description = "Shared observability primitives (counter pair) and generic logging adapter for the Ruviform media foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# `logging` — Issue #276 (OBS-01) generic logging adapter on the standard
# `tracing`/`tracing-subscriber`/`tracing-appender` stack. Off by default so
# the core counter pair keeps zero external dependencies; enabling it is the
# only thing that pulls the tracing stack into the build.
logging = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
]
# `tracing-export` — Issue #278 (OBS-03) `ObservationBatch`/`DiagnosticsEvent`
# → `tracing` event conversion. Off by default and independent of `logging`:
# it enables only `dep:tracing` (the `Dispatch` type), never subscriber
# construction. Hosts inject their own `tracing::Dispatch`.
tracing-export = ["dep:tracing"]
# `allocation-probe` — Issue #290 (OBS-08) development/test allocation
# probe (`profiling` module: `CountingAllocator` + TLS `AllocationScope`).
# Off by default; adds no dependencies — the probe is std-only and the
# crate never installs a `#[global_allocator]` itself.
allocation-probe = []
# `integration` — Issue #293 (OBS-11) host-facing non-RT integration
# layer (`integration` module: `ObservabilityConfig` +
# `ObservationRunner` lifecycle/poll/drain/reconfigure + composed
# `RunnerHealth`). Off by default so the lightweight core stays minimal;
# it adds no dependencies and does not force `tracing-export`/`logging` —
# those stay independently optional.
integration = []

[dependencies]
# Issue #280 (OBS-05): leaf-primitive deps for `rt_bridge`/`record`
# (ADR `docs/adr/obs-05-observability-leaf-primitive-deps.md`).
# One-directional only — `ruviform-rt` supplies the bounded SPSC ring and
# `ruviform-media-core` supplies the clock-domain vocabulary; the reverse
# direction (`rt`/`media-core` -> `observability`) must never exist.
ruviform-rt = { path = "../ruviform-rt" }
ruviform-media-core = { path = "../ruviform-media-core" }
# `tracing` — public API surface (`Dispatch`) for the `logging` feature.
tracing = { version = "0.1", optional = true }
# `tracing-subscriber` — `Registry`, `fmt` layers, `EnvFilter`, JSON output.
tracing-subscriber = { version = "0.3", optional = true, features = [
    "env-filter",
    "fmt",
    "json",
    "std",
] }
# `tracing-appender` — `RollingFileAppender` rotation + `max_log_files`
# retention (0.2.3+). The bounded writer itself is implemented in-crate (ADR
# `issue-276-logging-adapter-bounded-writer-ownership-and-build-time-sink-resilienc`)
# because `non_blocking` exposes no drop/failure observability.
tracing-appender = { version = "0.2.3", optional = true }

[dev-dependencies]
# Contract tests for the `logging` feature (`tests/logging.rs`): parse JSONL
# output (serde_json) and create throwaway log dirs (tempfile). `tracing` /
# `tracing-subscriber` need no dev-dep duplication — the optional deps under
# `logging` are already visible to test/example targets via `required-features`.
serde_json = "1"
tempfile = "3"
# Issue #278: `tracing_export` contract tests capture emitted events through a
# JSON-formatting subscriber (`registry` + `fmt`/`json`). Dev-dependency only —
# the `tracing-export` feature itself never requires a subscriber.
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "json",
    "registry",
    "std",
] }
# Issue #277: `assert_no_alloc` 測定窓 — core primitive の RT 許可操作
# （counter/gauge/histogram の no-alloc 実証）を `rt_` レーンで検証する。
# dev-dependency のみで公開 API・依存 DAG は std のみを維持する。
assert_no_alloc = "1.1"

[[test]]
name = "logging"
required-features = ["logging"]

# Issue #293: `integration` contract tests — lifecycle/drain/dispatch/
# dynamic-config/health across feature combinations. Inner `#[cfg]`
# sections cover `tracing-export`/`logging` when those features are on.
[[test]]
name = "integration"
required-features = ["integration"]

# Issue #275: RT call path emits no `tracing` events even while a
# subscriber dispatch is installed — pins the tracing/subscriber half
# of the RT acceptance row (the no-alloc half lives in the `rt_*`
# lanes). `tracing-export` is the minimal feature enabling
# `dep:tracing`; the counting subscriber is dev-dependency only.
[[test]]
name = "rt_boundary"
required-features = ["tracing-export"]

[[example]]
name = "logging_host"
required-features = ["logging"]

[lints]
workspace = true

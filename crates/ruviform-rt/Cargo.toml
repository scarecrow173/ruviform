[package]
name = "ruviform-rt"
description = "Real-time contract types and RT-safe primitives for the Ruviform media foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Private implementation detail — arc-swap types must never appear in
# the public API (dependency-addition rationale:
# docs/adr/rt-foundation-primitives-implementation.md).
arc-swap = "1"
# Private implementation detail — rtrb types/errors/feature names must
# never appear in the public API (dependency-addition rationale:
# docs/adr/rt-foundation-primitives-implementation.md).
rtrb = "0.4"

# Issue #104 RT 観測コスト計測 PoC ハーネス（benches/rt_observability_poc.rs）。
# ruviform-math の simd_poc と同一 pin 方針: caret 指定・追跡済み Cargo.lock を
# 再現性の錨とし、default-features = false で rayon + plotters を外して
# dev-dep のコンパイルコストを抑える。dev-dep 限定 — [dependencies] には昇格しない。
[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "rt_observability_poc"
harness = false

[lints]
workspace = true

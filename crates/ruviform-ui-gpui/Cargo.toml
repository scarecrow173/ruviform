[package]
name = "ruviform-ui-gpui"
description = "GPUI adapter implementing the ruviform-ui driver-neutral window/host contract (minimal window fixture; Issue #386)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `gpui` is off by default: enabling it pulls the GPUI backend (GPU,
# font, and OS window stacks) into the build. Keeping it non-default
# preserves `cargo check --workspace` as a headless verification path,
# matching the `ruviform-ui-webview` adapter precedent.
default = []
gpui = [
    "dep:gpui",
    "dep:ruviform-ui-theme",
    "dep:serde_json",
    "dep:raw-window-handle",
    "dep:windows-sys",
    "dep:x11rb",
]
# `gpui-test` enables gpui's `test-support` (TestAppContext /
# `#[gpui::test]` / simulate_* APIs) for the headless render tests.
# Not for production use — production code needs only `gpui`.
gpui-test = ["gpui", "gpui/test-support", "dep:ruviform-ui-test"]
# `real-scenario` enables the Issue #314 slice 4 real-window
# `SemanticGuiTest`/`VisualGuiTest` adapter (`RealOsGuiTest`): real OS
# windows driven through `GpuiDriver::capture_window` OS pixel
# capture. It needs `ruviform-ui-test` for the scenario/golden
# contract but NOT `gpui/test-support` — the simulated platform has
# no OS surface. Do not combine with `gpui-test`: the test platform
# stubs `capture_raw_parent`, so pixel capture would honestly report
# `Unsupported` anyway.
real-scenario = ["gpui", "dep:ruviform-ui-test"]
# `uitest` enables the Issue #313 slice S2 windowed `TestIo` adapter
# (`WindowedIo`) and the `windowed_test_app` AUT binary — the
# `rvf.uitest.v1` control surface over real GPUI windows through the
# `UiJob` seam (shared with `real-scenario`; the two never coexist in
# one session). `base64` encodes `Screenshot.data_base64` payloads.
uitest = ["gpui", "dep:ruviform-ui-test", "dep:base64"]

[[bin]]
name = "windowed_test_app"
path = "src/bin/windowed_test_app.rs"
required-features = ["uitest"]

[dependencies]
# - ruviform-ui: the port-defining crate this adapter implements.
ruviform-ui = { path = "../ruviform-ui" }
# - gpui: Zed's GPU-accelerated UI framework — the standard Driver
#   backend per the Issue #384 direction. Optional: only under `gpui`.
gpui = { version = "0.2.2", optional = true }
# - ruviform-ui-theme: Issue #387 renderer maps `ResolvedTheme` one-way
#   into GPUI colors/lengths (second theme source of truth is never
#   created). Optional: only needed by the gpui-gated render module.
ruviform-ui-theme = { path = "../ruviform-ui-theme", optional = true }
# - serde_json: serializes `CommandIntent` into the `rvf.ui.command.v1`
#   Intent `params` payload. Optional: only needed by the render module.
serde_json = { version = "1", optional = true }
# - ruviform-ui-test: Issue #464 scenario adapter — `GpuiGuiTest`
#   implements the driver-neutral `SemanticGuiTest` contract, and the
#   Issue #313 `uitest` feature's `TestIo` port types. Optional:
#   only under `gpui-test`/`real-scenario`/`uitest` (test surfaces,
#   never production).
ruviform-ui-test = { path = "../ruviform-ui-test", optional = true }
# - base64: `Screenshot.data_base64` wire encoding for the `uitest`
#   screenshot op (rgba-raw payloads). Optional: only under `uitest`.
base64 = { version = "0.22", optional = true }
# - raw-window-handle: the redemption seam — `Window::window_handle()`
#   yields the OS parent token the surface adapter wraps into opaque
#   lease payloads. The raw handle never leaves this adapter.
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
# - windows-sys: the Win32 surface-container path (per-slot child HWND
#   carrying clip/z-order/visibility for an embedded native editor)
#   plus the OS-window pixel capture backend (`PrintWindow`/`BitBlt`
#   in `gpui_driver::capture`). Target-gated and optional: only
#   compiled on Windows under `gpui`.
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# - x11rb: the X11 connection behind `gpui_driver::capture`'s Linux
#   backend — `GetImage` pixel readback and window geometry for the
#   Issue #314 offscreen (Xvfb) golden lane. Already in the graph via
#   gpui's own x11rb dependency, so this adds no new crates; it is
#   still optional so non-`gpui` builds stay headless. Target-gated:
#   macOS keeps its unsupported placeholder.
x11rb = { version = "0.13.1", optional = true, features = ["image"] }

[dev-dependencies]
# - ruviform-ui-test: the shared Window/Dock lifecycle fixture
#   (`lifecycle::run_lifecycle`) that the Fake and GPUI drivers both run
#   (Issue #386). Test-only; the production graph is untouched, and the
#   test crate depends on no GPUI type, so the boundary stays one-way.
ruviform-ui-test = { path = "../ruviform-ui-test" }
# - env_logger: surfaces gpui/blade `log` records in the real-window
#   lane when RUST_LOG is set — required to diagnose host GPU/X11
#   stack failures that the capture verdict alone cannot explain.
env_logger = "0.11"

[[example]]
name = "minimal_window"
# Manual-verification fixture: requires the real GPUI backend.
required-features = ["gpui"]

[[example]]
name = "real_window_lifecycle"
# Issue #431 real-OS lifecycle check (manual verification): two real
# windows, Dock 2-phase move, veto/defer/approve closes via OS input.
required-features = ["gpui"]

[[example]]
name = "component_showcase"
# Issue #387 renderer demo — Fader/Tabs + Waveform/Seek in a real
# GPUI window. Requires the real GPUI backend.
required-features = ["gpui"]

[[example]]
name = "spectrogram_intensity"
# Issue #463 real-window fixture — intensity-gradient Spectrogram with
# contract-legal column frame overlap. Requires the real GPUI backend.
required-features = ["gpui"]

[[example]]
name = "window_lifecycle_probe"
# Issue #243 real-OS lifecycle probe (manual verification): per-window
# focus/close/error contract, OS WM_CLOSE Veto/Defer/Approve/default,
# id non-reuse, destroy_window bypass, degenerate-spec observation.
required-features = ["gpui"]

[[example]]
name = "real_os_smoke"
# Issue #313 real-OS keyboard-input smoke (manual verification):
# SendInput Tab/arrow keystrokes against a mounted Fader+Seek and a
# verdict JSON with environment metadata. Requires the real GPUI
# backend and an interactive session that can take OS focus.
required-features = ["gpui"]

[[example]]
name = "real_os_pointer_smoke"
# Issue #313 real-OS pointer-input smoke (manual verification):
# SendInput absolute move + left-button drag/click aimed through
# measured component bounds + window geometry, verdict JSON with
# environment metadata. Requires the real GPUI backend, an
# interactive desktop session, and moves the real cursor (restored
# on exit).
required-features = ["gpui"]

[[example]]
name = "real_os_multiwindow_smoke"
# Issue #243 real-OS multiwindow smoke (manual verification):
# 2-3 real GPUI windows driven through SendInput OS input — per-window
# focus clicks, Win+Arrow move, Alt+F4 close (Veto/Defer/Approve/
# default), keyboard value commits, update_view state survival, Dock
# detach/reattach/move, window-vs-app job cancellation, regenerate +
# id non-reuse. Requires the real GPUI backend and an interactive
# desktop session; moves the real cursor (restored on exit).
required-features = ["gpui"]

[[test]]
name = "consumer_observation"
# Issue #429 consumer seam test — external crate, binds only the public
# `GpuiObserver` seam. Requires gpui test-support (`gpui-test`).
required-features = ["gpui-test"]

[[test]]
name = "scenario_contract"
# Issue #464 scenario contract test — runs the shared
# `ruviform-ui-test` parity scenario against `GpuiGuiTest`.
required-features = ["gpui-test"]

[[test]]
name = "real_window"
# Issue #314 slice 4 real-window adapter test — `RealOsGuiTest`
# needs `real-scenario` (real OS capture; `gpui-test` deliberately
# excludes it because test-support stubs the OS surface).
required-features = ["real-scenario"]

[lints]
workspace = true

[package]
name = "ruviform-ui-gpui"
description = "GPUI adapter implementing the ruviform-ui driver-neutral window/host contract (minimal window fixture; Issue #386)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `gpui` is off by default: enabling it pulls the GPUI backend (GPU,
# font, and OS window stacks) into the build. Keeping it non-default
# preserves `cargo check --workspace` as a headless verification path,
# matching the `ruviform-ui-webview` adapter precedent.
default = []
gpui = ["dep:gpui"]

[dependencies]
# - ruviform-ui: the port-defining crate this adapter implements.
ruviform-ui = { path = "../ruviform-ui" }
# - gpui: Zed's GPU-accelerated UI framework — the standard Driver
#   backend per the Issue #384 direction. Optional: only under `gpui`.
gpui = { version = "0.2.2", optional = true }

[[example]]
name = "minimal_window"
# Manual-verification fixture: requires the real GPUI backend.
required-features = ["gpui"]

[lints]
workspace = true

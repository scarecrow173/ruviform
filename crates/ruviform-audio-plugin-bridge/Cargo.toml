[package]
name = "ruviform-audio-plugin-bridge"
description = "Typed-graph plugin adapter for Ruviform: binds a plugin endpoint (multi-bus/stateful lifecycle) into the typed audio graph with transport-span delivery and physical process-call partitioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruviform-audio = { path = "../ruviform-audio" }
ruviform-audio-core = { path = "../ruviform-audio-core" }
ruviform-graph = { path = "../ruviform-graph" }
ruviform-media-core = { path = "../ruviform-media-core" }
ruviform-plugin-core = { path = "../ruviform-plugin-core" }
ruviform-plugin-host = { path = "../ruviform-plugin-host" }
ruviform-rt = { path = "../ruviform-rt" }

[dev-dependencies]
# Issue #186: `assert_no_alloc` 測定窓 — param 配送経路の RT 検証
# （Issue #22/#97/#98 と同一方式）。
assert_no_alloc = "1.1"
# Issue #253: `#[ignore]` 実機 E2E（tests/midi_wiring.rs）—
# `SystemBackend`→`InputTx::pump`→`InputStage` の opt-in 実デバイス
# 経路。adapter への dev-dep のみで公開 surface には出ない。
ruviform-midi-device = { path = "../ruviform-midi-device" }

[lints]
workspace = true

[package]
name = "ruviform-io-symphonia"
description = "First backend PoC for the ruviform-media-io abstraction boundary — demux + decode only, backed by the Symphonia media framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruviform-media-io = { path = "../ruviform-media-io" }
# Direct domain-crate path dependencies (media-io deliberately does not
# re-export domain types; baseline L203 allows backend crates to depend on
# the domain crates directly).
ruviform-media-core = { path = "../ruviform-media-core" }
ruviform-audio-core = { path = "../ruviform-audio-core" }
#
# Dependency addition record (provisional convention + licensing ADR
# per-dependency investigation duty):
#   - Why: symphonia is the top pure-Rust decode candidate from the
#     Issue #1 discovery evaluation ("純 Rust decode 最有力・Lean=yes・
#     `forbid(unsafe)`・trait 分離が抽象境界の好モデル"). Its
#     FormatReader/Decoder trait split is a close model for the media-io
#     boundary, and `forbid(unsafe_code)` matches the workspace's
#     no-unsafe convention.
#   - License: MPL-2.0 — a weak, file-scoped copyleft. Compatible with
#     the workspace licensing policy as an opt-in backend dependency;
#     the per-dependency investigation record lives in this comment and
#     the Issue #20 PR. Pre-publish license review remains a follow-up
#     per the licensing ADR.
#   - Version: 0.6 line (current 0.6.1). The 0.5 → 0.6 rework changed
#     the public API; MSRV 1.85 is satisfied by the workspace `rust-version` = 1.89.
#   - Features: default features only — the royalty-free codec/format
#     set. `all` and other patent-encumbered codec features are NOT
#     enabled (licensing ADR feature restriction).
symphonia = { version = "0.6", default-features = true }

[features]
# Issue #154 feature split — codec vs container stays separable per the
# licensing ADR: `mp4` adds the ISOBMFF demuxer (container; needed for
# both PCM-in-MP4 audio and AAC). `aac` adds the AAC decoder — a
# patent-encumbered codec kept opt-in, never implied by `mp4` alone.
# Default build scope is unchanged.
mp4 = ["symphonia/isomp4"]
aac = ["mp4", "symphonia/aac"]

[lints]
workspace = true

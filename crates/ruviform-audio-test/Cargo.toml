[package]
name = "ruviform-audio-test"
description = "Test-only deterministic Audio/MIDI test runtime (Issue #628): VirtualClock, deterministic PCM fixtures, MIDI trace via production TransportScheduler, scripted port-trait backend, pipeline wiring, independent oracles, JSON run metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Dependency addition records (暫定規約「依存追加は理由を記録」):
# - ruviform-audio-core: PCM fixture が生成する planar f32 buffer を
#   production の `AudioBufferViewMut`/`SampleRate` 契約で受け取るため。
#   device ポート trait・buffer view の公開 API のみ消費し、本番
#   クレートは本クレートに依存しない（isolation by DAG）。
ruviform-audio-core = { path = "../ruviform-audio-core" }
# - ruviform-media-core: MIDI trace が production の `MidiEvent`/`MidiKind`/
#   `TransportScheduler`/`TransportPlan`/`SpanSink`/`MediaTime`/`TimeBase`
#   契約をそのまま駆動するため。独自 scheduler/MIDI 型を定義しない。
ruviform-media-core = { path = "../ruviform-media-core" }
# - ruviform-rt: VirtualClock が production の `MasterClock`（atomic
#   wait-free read/write・rational timebase 検証）を内包して再利用するため。
ruviform-rt = { path = "../ruviform-rt" }
# - ruviform-audio: pipeline `output` leg drives the production
#   `Session::open`/`GraphPlan` contract; pipeline `input` leg drives
#   the production typed runtime (`GraphRuntime`/`RtRuntime`/
#   `Compiler`/`GraphProcessor`). Public API only — the test crate
#   consumes production contracts, never the reverse.
ruviform-audio = { path = "../ruviform-audio" }
# - ruviform-audio-plugin-bridge: pipeline `midi` leg drives the
#   production `InputStage`/`InputStageCounters`/`PumpStats` contract
#   (`InputTx` itself is `pub(crate)` — the leg mirrors its pump
#   algorithm as `pipeline::InputPump`).
ruviform-audio-plugin-bridge = { path = "../ruviform-audio-plugin-bridge" }
# - ruviform-graph: the input leg builds/validates the
#   Source→Processor→Sink `ValidatedGraph` the production `Compiler`
#   consumes (`GraphBuilder`/`Validator`/`NodeDef`/`PortDef`).
ruviform-graph = { path = "../ruviform-graph" }
# - ruviform-plugin-core: `Event`/`EventKind::Midi` observed from
#   `InputStage::collect_block`.
ruviform-plugin-core = { path = "../ruviform-plugin-core" }
# - serde/serde_json: `RunMetadata`/`RunParameters`/Case Schema v1 enum・
#   `VirtualClockConfig`/`JitterSpec` の JSON serialization（Issue #628
#   close-out — AC「再現に使う Run metadata を保存する」）。wire format
#   は Case Schema v1 語彙（kebab-case）に揃える。test-only crate の
#   ため製品配布・本番 crate の依存 graph に波及しない。workspace 既使用
#   （ruviform-io-structured / ruviform-ui-test / ruviform-observability /
#   ruviform-plugin-dock-test）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# - assert_no_alloc: `rt_` prefix RT contract テストで clock-read /
#   generator-fill / trace-capture 経路の allocation-free を検証する
#   （先例: crates/ruviform-audio-device/tests/mock_input_backend.rs）。
#   test-only crate の dev-dependency で本番 graph に波及しない。
assert_no_alloc = "1.1"

[lints]
workspace = true

[package]
name = "ruviform-video-proc"
description = "Color conversion, scaling and compositing base processing kernels and the GPU compute-kernel boundary port for Ruviform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruviform-media-core = { path = "../ruviform-media-core" }
ruviform-video-core = { path = "../ruviform-video-core" }
# Optional ICC engine behind feature `icc` (Issue #99 /
# docs/designs/color-conversion-kernels.md): BSD-3-Clause OR Apache-2.0,
# pure-Rust 3-crate tree (moxcms + num-traits + pxfm), MSRV 1.89.
# `default-features = false` keeps moxcms's `#![forbid(unsafe_code)]`
# active; `lut` covers mft1/mft2/mAB LUT profiles and `extended_range`
# enables `allow_extended_range_rgb_xyz` ([0,1]-preserving f32 output).
# SIMD/`in_place`/`options`/`any_to_any` stay off (scalar reference path).
# `any_to_any` in particular must stay off: enabling it later would
# break the alloc-free `process` contract — the Katana executor it
# selects allocates per transform. The current scalar executor path is
# verified alloc-free mechanically by the `assert_no_alloc` rt_ lane
# since Issue #126.
moxcms = { version = "0.9", optional = true, default-features = false, features = ["lut", "extended_range"] }

[dev-dependencies]
# Issue #126: `assert_no_alloc` 測定窓を全 `rt_process_*` テストの
# `process` 経路（`IccTransform` の moxcms executor 内部 alloc 含む）
# へ適用する RT 検証レーン（Issue #22・#97/#98 と同一方式 —
# `alloc_counter` 併存の ADR 確定どおり新規 lane は assert_no_alloc）。
assert_no_alloc = "1.1"

[features]
default = []
icc = ["dep:moxcms"]

[lints]
workspace = true

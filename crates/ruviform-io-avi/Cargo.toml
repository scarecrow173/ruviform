[package]
name = "ruviform-io-avi"
description = "Pure-Rust AVI backend for the ruviform-media-io abstraction boundary — streaming demux + PCM audio / BI_RGB DIB video decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruviform-media-io = { path = "../ruviform-media-io" }
# Direct domain-crate path dependencies (media-io deliberately does not
# re-export domain types; the architecture baseline allows backend
# crates to depend on the domain crates directly).
ruviform-media-core = { path = "../ruviform-media-core" }
ruviform-audio-core = { path = "../ruviform-audio-core" }
ruviform-video-core = { path = "../ruviform-video-core" }

[lints]
workspace = true

[package]
name = "ruviform-ui-theme"
description = "Backend-neutral DTCG design-token interpreter: deterministic parse/validate/alias/mode/override resolution into a typed immutable ResolvedTheme (Issue #385)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Dependency addition records (暫定規約「依存追加は理由を記録」):
# - serde_json: DTCG token document（Git 管理 JSON）の解析と
#   normalized golden 出力。spec の初期依存方針で明示された最小構成。
#   MIT OR Apache-2.0。公開 API には serde 型を露出しない。
serde_json = "1"

# Issue #418 theme codegen CLI（manifest 駆動の DTCG→静的 Rust 型生成。
# ui-test の gui-boundary-guard と同じく canonical 名 `theme-codegen` へ rename）。
[[bin]]
name = "theme-codegen"
path = "src/bin/theme_codegen.rs"

[lints]
workspace = true

[package]
name = "ruviform-io-file"
description = "Safe staged file publish — type-state StagedFile/SealedFile with classified receipt/failure, recovery handles, and a private OS-ops boundary (non-RT, std only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]

# Real OS backend (IO-IMP-02): raw `renameat2`/`renamex_np` FFI on
# unix, `MoveFileExW` + `FILE_FLAG_BACKUP_SEMANTICS` on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_IO",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
] }

[lints]
workspace = true

[package]
name = "ruviform-plugin-host"
description = "Plugin host boundary for Ruviform: opaque instance handles and a serializable command surface, with the L0 in-process backend as the default path"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruviform-plugin-core = { path = "../ruviform-plugin-core" }
ruviform-rt = { path = "../ruviform-rt" }
# L1 named shared-memory segment (design「依存追加の判断」— MIT OR
# Apache-2.0, small dependency tree, Windows+POSIX named objects). Confined
# to the internal `l1::shm` module — never exposed on the public API or
# feature names. Note: 0.12.4's `as_slice`/`as_slice_mut` are `unsafe fn`
# (the design recorded them as safe); the only scoped `#[expect(unsafe_code)]`
# call sites live in `l1::shm` and the `l1-test-worker` bin (the child-side
# attach mirrors the same segment protocol), each with SAFETY comments.
shared_memory = "0.12"

[[bin]]
name = "l1-test-worker"
path = "src/bin/l1-test-worker.rs"

[dev-dependencies]
assert_no_alloc = "1.1"
ruviform-audio-core = { path = "../ruviform-audio-core" }
ruviform-media-core = { path = "../ruviform-media-core" }

[lints]
workspace = true

[package]
name = "ruviform-ui-test"
description = "Test-only GUI host lifecycle + secure control adapter (RF-GT-03): rvf.uitest.v1 control protocol, fake host, fixture/clock/fault/observation ports, stdio/TCP transports, driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Dependency addition records (暫定規約「依存追加は理由を記録」):
# - ruviform-ui: the port-defining crate — WindowEvent/WindowHandle/
#   HostEvent/UiRuntime-facing contract types and the rvf.ipc.v1
#   envelope reused by rvf.uitest.v1. Only public API is consumed;
#   production crates never depend on this crate (isolation by DAG).
ruviform-ui = { path = "../ruviform-ui" }
# - serde + serde_json: rvf.uitest.v1 contract types (Welcome/
#   Capabilities/receipts) are serialized inside the reused ipc
#   envelope payloads — same dependency set ruviform-ui already uses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# - cargo_metadata: Issue #390 driver boundary guard の
#   `cargo metadata` 依存グラフ検査の型付き parse/実行に使用
#   （test-support crate のみの通常 dep で本番 graph に波及しない）。
#   Issue #411: 0.19 系に固定。0.22+ は cargo-platform ^0.3.0 を引き、
#   通常解決で platform 0.3.3（rustc 1.91 必須）へ再発収束するため MSRV
#   1.89 と不整合。0.19.2 は cargo-platform ^0.1.2（platform 0.1.x は
#   rust-version <=1.78）のみを引き、追加の推移依存を増やさず通常解決で
#   MSRV 範囲に収束する（0.20/0.21 は platform 0.2 系で MSRV 上は可能だが
#   cargo-util-schemas 系の追加 transitive tree を伴う）。guard が使う
#   型付き parse API は 0.19.2 にも存在し、検査の意味は保持。
cargo_metadata = "0.19"
# - syn + proc-macro2(span-locations): Issue #390 driver boundary
#   guard の public signature 漏出検査（`pub` item signature の
#   forbidden path root 走査・finding 行番号）に使用。grep 文字列
#   一致では検査できない pub item 単位の構文解析のため。
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Issue #390 driver boundary guard CLI（自動検出名
# `gui_boundary_guard` を canonical 名 `gui-boundary-guard` へ rename）。
[[bin]]
name = "gui-boundary-guard"
path = "src/bin/gui_boundary_guard.rs"

[lints]
workspace = true

[package]
name = "ruviform-io-archive"
description = "Archive entry management — shared entry/error/limit contract plus ZIP indexed reader/writer and TAR streaming reader/writer with declared-size, padding, and end-of-archive verification (non-RT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
# CRC32 for ZIP entry verification. Small, actively maintained, MIT OR
# Apache-2.0. Internal implementation detail — never exposed in the public API.
crc32fast = "1"
# DEFLATE decode/encode for ZIP method 8 via the pure-Rust miniz_oxide
# backend (`rust_backend`; no C dependency). Internal implementation detail —
# never exposed in the public API.
flate2 = { version = "1", default-features = false, features = [
    "rust_backend",
] }

[dev-dependencies]
# tar.gz composition tests: the TAR layer's finish must be separable
# from the compression layer's trailer verification.
ruviform-io-compression = { path = "../ruviform-io-compression", features = ["gzip"] }

[lints]
workspace = true

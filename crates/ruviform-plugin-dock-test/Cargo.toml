[package]
name = "ruviform-plugin-dock-test"
description = "Test-only plugin-dock scenario harness (Issue #631 slices): resolves the real test-plugin VST3 cdylib (test_gain headless lane; test_editor real-window lane), records artifact digest/version evidence, and reports honest Pass/Fail/NotRun/Unsupported verdicts through the driver-neutral ruviform-ui-test scenario contract. Not a shipping product — no production crate may depend on this crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `real-dock` (Issue #631 real-window slice): the opt-in/manual
# real-window lane — `src/real_dock.rs` and the
# `plugin-dock-real-scenario` bin drive `RealOsGuiTest` real OS
# windows through ruviform-ui-gpui's `real-scenario` feature. NOT a
# default feature: it opens real OS windows and links the GPUI
# backend, so the default/headless lane stays window-free; it is
# never a CI-required gate.
real-dock = [
    "dep:ruviform-ui-gpui",
    "ruviform-ui-gpui/real-scenario",
    "dep:windows-sys",
]
# `lab-gui` (Issue #631 Test Lab slice): the opt-in/manual GPUI
# windowed scenario console — `src/bin/plugin-dock-lab.rs` mounts the
# merged catalog (`HEADLESS_MATRIX` + `real_catalog`) as a
# `ruviform-ui` `ViewSpec` tree through `GpuiDriver` (the `gpui`
# feature only — no `real-scenario`/`uitest` job channel; the lab
# drives `GpuiDriver::run`'s event callback directly). NOT a default
# feature: it opens a real OS window and links the GPUI backend, so
# the default/headless lane stays window-free; it is never a
# CI-required gate. New feature-flag justification (暫定規約「新規
# feature・optional 依存は追加理由を PR に記録」): the lab needs the
# `gpui` backend for real windows but none of the scenario/test
# adapter surfaces `real-scenario`/`uitest` pull in — keeping the
# feature minimal avoids linking `ruviform-ui-test`'s adapter
# contracts twice and matches the crate's per-lane feature split.
lab-gui = ["dep:ruviform-ui-gpui", "ruviform-ui-gpui/gpui"]

[[bin]]
name = "plugin-dock-real-scenario"
path = "src/bin/plugin-dock-real-scenario.rs"
required-features = ["real-dock"]

[[bin]]
name = "plugin-dock-lab"
path = "src/bin/plugin-dock-lab.rs"
required-features = ["lab-gui"]

[dependencies]
# Dependency addition records (暫定規約「依存追加は理由を記録」):
# - ruviform-ui-test: the driver-neutral scenario contract this
#   harness reports through (ScenarioSpec/run_scenario/ScenarioReport,
#   FakeGuiTest semantic view-mount, FakeNativeSlot lease ledger).
#   Consumer-layer composition only — production crates never depend
#   on this crate (isolation by DAG, same shape as
#   ruviform-poc-native-dock).
ruviform-ui-test = { path = "../ruviform-ui-test" }
# - ruviform-ui: driver-neutral view/native-slot vocabulary the
#   scenario declares (ViewSpec/NativeSlotSpec via ui-test helpers,
#   SlotSpec/SlotLease/NativeSurfaceSlot for the fake-slot lease
#   redemption seam). No GPUI types anywhere in this crate.
ruviform-ui = { path = "../ruviform-ui" }
# - ruviform-plugin-vst3 (`host` feature): the production host bridge
#   (`Vst3Library::load`/`descriptors()`/`factories()`) that dlopens
#   the real test_gain cdylib — the same path the L1 runner uses.
ruviform-plugin-vst3 = { path = "../ruviform-plugin-vst3", features = ["host"] }
# - ruviform-plugin-host: InProcessHost command surface
#   (Scan/Instantiate/Initialize/Activate/Destroy), PluginEditorSessions
#   + InProcessEditorOps for the honest editor-attach attempt.
ruviform-plugin-host = { path = "../ruviform-plugin-host" }
# - ruviform-plugin-core: ProcessConfig (Activate), PluginFactory
#   (factory registration), ParentLease/ParentSlotLease boundary
#   vocabulary.
ruviform-plugin-core = { path = "../ruviform-plugin-core" }
# - ruviform-audio-core: SampleRate for the Activate ProcessConfig.
ruviform-audio-core = { path = "../ruviform-audio-core" }
# - ruviform-audio-test: EnvironmentKind vocabulary
#   (test-plugin is claimed only by cases that actually
#   executed the real binary; real-window only by the real-dock lane).
ruviform-audio-test = { path = "../ruviform-audio-test" }
# - ruviform-ui-gpui (optional; `real-dock`/`lab-gui` features only):
#   the real-window scenario adapter (`RealOsGuiTest` under
#   `real-scenario`) that mounts the dock spec into a real OS window
#   and exposes the canonical-surface native-slot ops
#   (declare/bind/lease/validate/release + container_token/redeem);
#   `lab-gui` uses the plain `gpui` feature's `GpuiDriver`/`ViewMount`
#   to mount the Test Lab console window. Optional so the default
#   lane never links the GPUI backend; consumer-layer composition
#   only — no GPUI type crosses this crate's API or evidence schema
#   (driver boundary guard).
ruviform-ui-gpui = { path = "../ruviform-ui-gpui", optional = true }
# - serde_json: ScenarioSpec.environment / report environment +
#   observed/expected evidence payloads (same set ui-test uses).
serde_json = "1"
# - sha2 0.10: SHA-256 of the plugin binary for artifact evidence.
#   Already in Cargo.lock as a transitive dep (0.10.9); pinned to the
#   same major line, no new tree.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# - windows-sys 0.61 (optional; `real-dock` feature only — Issue #631
#   real-editor-attach slice + Issue #532 dcomp-pixel slice):
#   query-only Win32 observation for the `real-editor-attach` case —
#   `EnumChildWindows`/`GetParent`/`IsWindow`/`IsWindowVisible`/
#   `GetWindowThreadProcessId`/`GetCurrentThreadId` prove the
#   `test_editor` plugin's real child HWND exists under the leased
#   container HWND, is visible, and is destroyed on `session.close`
#   (`removed()` → `DestroyWindow`). The `real-dcomp-pixel` case adds
#   read-only pixel capture (`GetWindowRect`/`GetAncestor`/`IsIconic`/
#   `BitBlt`/`CreateDIBSection`/`PrintWindow` via local extern) to
#   observe the screen-composited pixels of the docked editor child —
#   `Win32_Graphics_Gdi` covers the DIB/BitBlt surface.
#   Observation plus bounded, restored window-state mutation for the
#   Issue #532 foreground-probe slice — `SetWindowPos`/
#   `SetForegroundWindow`/`GetForegroundWindow`/`GW_HWNDPREV` move the
#   GPUI root's z-order band and foreground inside `osmut`, always
#   followed by a restore; this crate still never creates, destroys,
#   or messages a window through it. The Issue #532
#   presentation-probe slice adds query-only inventory/attribute
#   observation (`EnumWindows`/`GetWindow`/`GetWindowLongPtrW`/
#   `GetWindowRgn`/`GetRgnBox`/`GetUpdateRect`/
#   `GetLayeredWindowAttributes`, plus `DwmGetWindowAttribute` via
#   local extern) — no mutation, no new features. Windows-targeted
#   so the dep never
#   enters non-Windows builds; optional so the default headless
#   lane's dependency tree is unchanged. Same `windows-sys` 0.61
#   line `ruviform-poc-native-dock` already uses; the Gdi feature is
#   an extension of the existing optional edge (no new dependency).
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Builds the test_gain cdylib into deps/ when this crate's tests run
# (dev-dep edge only — the fixture crate never enters this crate's
# production dependency graph; precedent: ruviform-plugin-test-vst3's
# own host_path.rs dev-dep on ruviform-plugin-vst3).
ruviform-plugin-test-vst3 = { path = "../ruviform-plugin-test-vst3" }

[lints]
workspace = true

[package]
name = "ruviform-audio"
description = "Audio engine: pull-based processing graph, mixer, device-session mediation (Issue #25)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruviform-rt = { path = "../ruviform-rt" }
ruviform-audio-core = { path = "../ruviform-audio-core" }
ruviform-media-core = { path = "../ruviform-media-core" }
# M2 (Issue #195): typed Graph IR is the compile input — the engine
# depends downward on the IR crate, never the reverse.
ruviform-graph = { path = "../ruviform-graph" }
# Issue #185 generic probe: shared channel-level measurement (downward
# dependency into the analysis layer) and shared status counters.
ruviform-audio-analysis = { path = "../ruviform-audio-analysis" }
ruviform-observability = { path = "../ruviform-observability" }

[dev-dependencies]
assert_no_alloc = "1.1"
# Compile-time Send/Sync evidence for the FnMut blanket impl and the
# plan/swap handle types — plain `expect_send` functions cannot express
# the negative (!Send) side; `static_assertions` is the published
# stable crate for both directions (Issue #113 task T5).
static_assertions = "1.1"

[lints]
workspace = true

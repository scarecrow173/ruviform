[package]
name = "ruviform-math"
description = "Numeric operations, vectors, SIMD kernels, CPU feature detection and numeric utilities for Ruviform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Issue #53: fearless_simd は採否 ADR 決定 2 のとおり本番 dispatch 層
# (src/dsp.rs) のバックエンドとして [dependencies] に昇格。MSRV 1.89 前提
# (Issue #52)。force_support_fallback 必須: src/dsp.rs の Sel::Fallback が
# `fearless_simd::Fallback` 型を参照するため、feature なしでは本クレートは
# 依存クレート側でコンパイルできない（#75 で顕在化）。
[dependencies]
fearless_simd = { version = "1.1", features = ["force_support_fallback"] }
fearless_simd_macros = "0.1"

# Issue #19 DSP/SIMD PoC harness。Versions are caret-pinned; the committed
# Cargo.lock is the reproducibility anchor (exact `=x.y.z` pins are
# intentionally not used).
[dev-dependencies]
# alloca の非対応ターゲット問題は 0.8.2 で修正済み（"don't build alloca on
# unsupported targets"）。default-features を切って rayon + plotters を外し、
# dev-dep のコンパイルコストを抑える（html_reports / csv_output は未使用でも
# estimates.json は常に出力される）。
criterion = { version = "0.8.2", default-features = false }
# x86-v4 は非 default（bytemuck/avx512_simd を引く）。AVX-512 評価のため有効化。
# macro = #[pulp::with_simd] の評価対象。
pulp = { version = "0.22", features = ["x86-v4", "macro"] }
multiversion = "0.9"
# 等価性判定（UlpsEq）。代替は float_eq — 実装時に API 使い勝手で 1 つに絞る。
approx = "0.5"
# rt_ テスト用のアロケーション検知（#22 レーン）。lib 依存には昇格しない。
assert_no_alloc = "1.1"

[[bench]]
name = "simd_poc"
harness = false

[package]
name = "ruviform-audio-device"
description = "Audio device I/O adapter for Ruviform (device boundary port implementation; cpal backend)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruviform-audio-core = { path = "../ruviform-audio-core" }
# `MediaTime`/`TimeBase` を adapter が直接利用するため追加（設計書 manifest 方針どおり。
# audio-core の device モジュールからの再エクスポート案もあったが、依存方向が同一で
# ある以上、利用箇所を明示する直接依存を採用）。
ruviform-media-core = { path = "../ruviform-media-core" }
cpal = "0.18" # 統一 Error/ErrorKind・StreamTrait::now()・HW レイテンシ込み timestamp。
              # default = []（OS 既定 host のみ。Linux=ALSA / Windows=WASAPI）。

# Issue #565: WASAPI input の `frame_position` を供給する native input path
# （`src/wasapi_input.rs`）が使う Win32/WASAPI/COM API。cpal 0.18.2 と同一
# バージョン（0.62）に揃え、Cargo.lock への新規 package 追加をゼロにする。
# features は cpal の WASAPI host が使う集合から device 説明・プロパティ
# ストア参照系を除いた最小限（capture path が必要とする API のみ）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
# `windows::core::implement` expands to `windows_core::` paths, so the
# core crate must be a direct dependency (same version cpal locks).
windows-core = "0.62"

[dev-dependencies]
# コールバック経路の非 alloc 機械検証の試行（PoC 受け入れ基準「コールバック内非
# alloc の検証」をコードレビュー証跡だけでなく機械検証で補強するため。設計書
# 「コールバック内非 alloc の検証方針」節）。
assert_no_alloc = "1.1"
# mock input backend の capture→handoff 契約 PoC で使う SPSC（dev-dep のみ。
# adapter 本体の依存にはしない — tests/mock_input_backend.rs 専用）。
ruviform-rt = { path = "../ruviform-rt" }

[features]
default = []
# コールバックスレッドの RT 優先度昇格（cpal `realtime` → audio_thread_priority）。
# opt-in の意図命名。cpal の `realtime` は Windows/Android にのみ作用する。
# Linux の RT 昇格は `realtime-dbus`（rtkit 経由・要 `libdbus-1-dev`）であり、
# 必要になれば別 feature として追加する。
realtime = ["cpal/realtime"]
# PipeWire host の任意実機比較用。PoC 既定構成では無効。有効化には
# `libpipewire-0.3-dev` システム依存が必要（Linux のみ）。
pipewire-backend = ["cpal/pipewire"]
# 実機 input 検証 lane（Issue #251）。`tests/real_input_e2e.rs` の
# `#[ignore]` テストを有効化する opt-in feature — 既定の
# `cargo test` / `lint` には含まれない。実行入口は
# `mise run test-audio-real-input`（Issue #114 `l1-real-verify`
# パターン準拠）。
real-device = []

[lints]
workspace = true

[package]
name = "ruviform-media-reader"
description = "Generic media reader / prefetch / RT playback consumer boundary for the Ruviform media foundation (Issue #197)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruviform-media-io = { path = "../ruviform-media-io" }
ruviform-media-core = { path = "../ruviform-media-core" }
ruviform-audio-core = { path = "../ruviform-audio-core" }
ruviform-rt = { path = "../ruviform-rt" }

[dev-dependencies]
# WAV fixture backend — tests only; no backend type reaches the public API.
ruviform-io-symphonia = { path = "../ruviform-io-symphonia" }
# RT no-allocation verification (ADR rt-assert-no-alloc-thread-check).
assert_no_alloc = "1.1"

[lints]
workspace = true

[package]
name = "ruviform-poc-native-dock"
description = "Consumer-layer PoC harness for Issue #388/#389 — wires GpuiSurfaceAdapter + PluginEditorSession + InProcessHost into a real native-editor attach on a real GPUI window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `gpui` pulls the real GPUI backend in — off by default so
# `cargo check --workspace` stays a headless path.
default = []
gpui = ["ruviform-ui-gpui/gpui"]

[dependencies]
# Consumer layer: this crate is the composition root allowed to see
# both the plugin side and the ui side (the architecture baseline's
# plugin↔ui dependency ban is what makes the consumer the only legal
# place for this wiring).
ruviform-ui = { path = "../ruviform-ui" }
ruviform-ui-gpui = { path = "../ruviform-ui-gpui" }
ruviform-plugin-core = { path = "../ruviform-plugin-core" }
ruviform-plugin-host = { path = "../ruviform-plugin-host" }

[target.'cfg(windows)'.dependencies]
# The probe editor is a real native child HWND — same Win32 surface a
# plugin binary would create under `open_gui`.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

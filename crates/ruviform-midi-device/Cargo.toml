[package]
name = "ruviform-midi-device"
description = "OS MIDI input device adapter for Ruviform (midi_input port implementation; WinMM backend on Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ruviform-audio-core = { path = "../ruviform-audio-core" }
# `MidiEvent`/`InputStamp`/`TimeBase`/`ClockDomainId`/`TimestampProvenance`
# を adapter が直接利用するため追加（audio-device と同じ直接依存方針）。
ruviform-media-core = { path = "../ruviform-media-core" }

[target.'cfg(windows)'.dependencies]
# WinMM MIDI input backend（Issue #253 slice (a)）。backend 選定の根拠は
# docs/adr/select-midi-input-backend.md — midir は MIM_MOREDATA/
# MIM_LONGERROR の喪失 signal と生 timestamp を握りつぶすため不採用、
# WinRT/UWP は UIPI/packaging 制約のため不採用。windows-sys は薄い binding
# で workspace lock 内に既存（io-file/plugin-host が 0.61 を使用）。
windows-sys = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
] }

[target.'cfg(windows)'.dev-dependencies]
# Issue #962 Slice C: `examples/midi_wms_api_probe.rs` が raw WinRT で
# `Windows.Devices.Midi2` client API へ到達するための WinRT activation API
# （`Win32_System_WinRT`: `RoInitialize`/`RoGetActivationFactory`/
# `RoActivateInstance`/`HSTRING` 系。`Foundation`: `IClosable`）。example
# 専用に閉じ、crate 本体の依存・公開 API は変更しない。`windows` 0.62 は
# ruviform-audio-device（cpal 0.18 系）が lock 内に既に持つため feature
# union のみで新規 package は増えない。
windows = { version = "0.62", features = [
    "Foundation",
    "Win32_System_Registry",
    "Win32_System_WinRT",
] }
# `#[windows::core::interface]` 等の macro 展開が `windows_core::` パスを
# 参照するため、core crate を直接依存にする（audio-device と同じ方針）。
windows-core = "0.62"

[lints]
workspace = true

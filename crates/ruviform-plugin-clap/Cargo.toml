[package]
name = "ruviform-plugin-clap"
description = "Thin CLAP adapter for the Ruviform standard-neutral plugin foundation, built on the clack binding crates — binding-method PoC (minimal gain plugin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `cdylib` exports the CLAP entry point (`clap_entry`); `rlib` keeps the
# crate usable for unit tests / doctests. Binding-crate (`clack` /
# `clap-sys`) types are an implementation detail and never appear in the
# public Rust API.
[lib]
crate-type = ["cdylib", "rlib"]

# The CLAP-specific L1 child-process runner (Issue #114, task
# `docs/tasks/real-adapter-runner-bins.md`): dlopens the fixture cdylib
# through the `host` bridge and hands the scanned factories to
# `ruviform_plugin_export::run`. `required-features` keeps the binary
# out of the default build — it exists only under `--features host`.
[[bin]]
name = "ruviform-plugin-clap-l1-runner"
path = "src/bin/ruviform-plugin-clap-l1-runner.rs"
required-features = ["host"]

[features]
# `host` — the host-side bridge (`src/host.rs`): loads a real `.clap`
# shared object in-process via `clack-host` and maps it onto the neutral
# `PluginFactory`/`Plugin` contracts for the L1 out-of-process runner.
# `clack-extensions` is a non-optional dependency, so its feature is
# wired with the plain `dep/feat` syntax (the weak `dep?/feat` form only
# exists for optional dependencies).
host = [
    "dep:clack-host",
    "dep:ruviform-plugin-export",
    "clack-extensions/clack-host",
    # `gui` — `PluginGui` host calls (`open_gui`/`close_gui`, Issue #389
    # CLAP L0 editor-attach slice). Kept behind `host` so the default
    # feature set stays minimal.
    "clack-extensions/gui",
]

[dependencies]
ruviform-plugin-core = { path = "../ruviform-plugin-core" }
ruviform-audio-core = { path = "../ruviform-audio-core" }
ruviform-media-core = { path = "../ruviform-media-core" }
# Exact pins: this PoC evaluates `clack` 0.2.0 specifically; the
# binding-method ADR may relax these after the decision is recorded.
clack-plugin = "=0.2.0"
clack-common = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = [
    "clack-plugin",
    "audio-ports",
    "params",
    "thread-check",
] }
# `clack-host` is promoted from a dev-dependency to an optional prod
# dependency under `host` (Issue #114 — the bridge dlopens real `.clap`
# binaries). The dev-dependency entry below is kept for the
# `load_from_clack` typed-entry tests; the two entries union features.
clack-host = { version = "=0.2.0", optional = true }
# The runner binary (`required-features = ["host"]`, Task 3) consumes
# `run()`; keeping the dep optional keeps the default dep tree and the
# plugin-side cdylib unchanged.
ruviform-plugin-export = { path = "../ruviform-plugin-export", optional = true }

[dev-dependencies]
# `clack-host` (feature `clack-plugin`) synthesizes the plugin-side
# `Audio` object a host would hand to `process`, so tests drive the real
# adapter path — including `ChannelPair::InPlace` classification — and
# can prove zero-copy via pointer equality.
clack-host = { version = "=0.2.0", features = ["clack-plugin"] }
# Test builds additionally enable `clack-extensions/clack-host` so the
# test host can implement `HostThreadCheckImpl` (thread-check の host
# 側応答). Dev-dependency feature union keeps the lib target free of
# the clack-host dependency.
clack-extensions = { version = "=0.2.0", features = ["clack-host", "thread-check"] }
# RT 境界テストの allocation/deallocation を機械検出する Issue #22
# 検証レーン（audio-device の callback 経路検証と同方式）。
assert_no_alloc = "1.1"
# Issue #114（T4）: `tests/l1_real_adapter_e2e.rs` が実 fixture cdylib +
# `host` runner を `PluginHost`/`OutOfProcessSpec` 経由で駆動する。
# dev-dep 方向（adapter → host）で依存 DAG の非環を維持する — plugin-host は
# adapter crate に依存しない。
ruviform-plugin-host = { path = "../ruviform-plugin-host" }

[lints]
workspace = true

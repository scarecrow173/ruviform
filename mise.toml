# fixture → clock → fault → screenshot → close → graceful shutdown —
# writing evidence/issue-313-windowed-uitest/verdict-windowed-uitest.json.
# No OS input injection — real windows open on the interactive
# desktop only. `--test-threads=1` is required: parallel AUT spawns

[settings]
minimum_release_age = "7d"
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

# Shared infrastructure tools. Rust toolchain はここでは pin しない —
# 通常開発は環境導入済みの rust(rustup / global mise)を使い、CI 用の
# pin は mise.ci.toml(MISE_ENV=ci で有効化)に分離する。
[tools]
# Issue #85: GHSA-hq85-5cpj-mr62（eMudhra/emSign 中間 CA 侵害）の
# 修正版 0.13.4 以上を明示固定（0.12.x は同梱 CA バンドルに影響 CA が残る）。
uv = "0.13.5"
# eMudhra CA 修正版 0.5.7(GHSA-hq85-5cpj-mr62 対応)。
prek = "0.5.7"
git-lfs = "3.8.0"
"github:microsoft/apm" = "0.33.0"
"pipx:serena-agent" = { version = "1.7.0", lazy = true }
actionlint = "1.7.12"
# UI PoC（poc/ui/frontend）の npm workspaces ビルド用。Issue #83:
# 2026-10-21 Node.js セキュリティ更新を踏まえ修正版で固定
# （26.x 系は 26.12.1 以上が要件）。
node = "26.12.1"

[tasks.setup]
description = "Install APM dependencies, prek hooks and repository-local Git LFS"
run = [
  "apm install",
  "prek install",
  "git lfs install --local",
]

# Rust verification tasks: single entry point shared by local dev and CI.
# `fmt` rewrites source files in place; all other tasks are non-destructive
# and produce build artifacts only under target/.

[tasks.fmt]
description = "Format workspace sources with `cargo fmt --all` (rewrites source files in place)"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check workspace formatting with `cargo fmt --all -- --check` (non-destructive; shared with CI)"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Verify one Cargo package: mise run check <package> [cargo flags] (required package)"
raw_args = true
run = "cargo check --locked --all-targets -p"

[tasks.lint]
description = "Lint one Cargo package with warnings denied: mise run lint <package> [cargo flags]"
raw_args = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$#" -lt 1 ]; then
  echo "usage: mise run lint <package> [cargo flags]" >&2
  exit 2
fi
cargo clippy --locked --all-targets -p "$@" -- -D warnings
'''

[tasks.check-linux]
description = "Cross type-check + lint io-file/io-archive for x86_64-unknown-linux-gnu (auxiliary check of cfg(unix) code a non-Linux host never compiles; scoped to crates with unix backends since workspace-wide linux check needs a Linux C toolchain for zstd-sys/alloca build scripts; requires `rustup target add x86_64-unknown-linux-gnu`; writes only target/)"
run = "cargo check --target x86_64-unknown-linux-gnu -p ruviform-io-file -p ruviform-io-archive --all-targets && cargo clippy --target x86_64-unknown-linux-gnu -p ruviform-io-file -p ruviform-io-archive --all-targets -- -D warnings"

[tasks.test]
description = "Verify one Cargo package: mise run test <package> [cargo flags] (required package)"
raw_args = true
run = "cargo test --locked -p"

[tasks.check-ui-driver-boundary]
description = "Issue #390 driver boundary guard: `cargo metadata` dependency-graph + syn public-signature leak inspection against fixtures/driver-lab/boundary.json (exit 0 pass / 1 violation / 2 tool error; writes only target/)"
run = "cargo run -p ruviform-ui-test --bin gui-boundary-guard -- --offline"

[tasks.test-ui-driver-contract]
description = "Issue #390 DriverContractFixture: cases.json/stories.json manifest consistency (incl. cargo-test/mise-task mechanism existence) + executable UI-DVR-01/04/05/06/07/08 fake-layer fixtures (evidence via RUVIFORM_DRIVER_LAB_EVIDENCE; writes only target/)"
run = "cargo test -p ruviform-ui-test --test driver_contract"

[tasks.test-ui-parity]
description = "Issue #421/#434 Fake/GPUI parity fixture (fake side): shared driver-lab/parity/new-kinds.json for Knob/Toggle/Meter/TimeAxis/Spectrogram mount/reconcile (UI-DVR-02), gesture intents (UI-DVR-03) and payload retention. The GPUI side of the same fixture runs under test-ui-gpui (writes only target/)"
run = "cargo test -p ruviform-ui-test --test driver_parity"

[tasks.test-ui-native-slot]
description = "Issue #388 NativeSurfaceSlot contract fixtures: FakeNativeSlot port semantics (attach/hide/resize/clip/z/focus, attach-fault rollback, stale/forged leases, teardown) + DockWorkspace 2-phase move rollback link. Fake layer only — never a Dock PASS (writes only target/)"
run = "cargo test -p ruviform-ui-test --test native_slot_contract"

[tasks.test-ui-component-view]
description = "Issue #387 Component/View semantic fixtures: UI-DVR-02/03 + LAB-SV-FADER-DOCK/LAB-AL-WAVEFORM-SEEK fake layer + 2-theme equivalence (writes only target/)"
run = "cargo test -p ruviform-ui-test --test component_view"

[tasks.test-ui-golden]
description = "Issue #314 slice 1 Pixel Golden core: headless RGBA8 normalization, per-channel tolerance diff + masks, candidate→promote baseline store, verdict vocabulary and evidence (writes only target/ + temp dirs; capture paths are slice 3, NotRun/Unsupported by design)"
run = "cargo test -p ruviform-ui-test --test golden"

[tasks.codegen-theme]
description = "Issue #418: regenerate crates/ruviform-ui-theme/src/generated.rs from codegen/themes.json via theme-codegen (ThemeResolver::resolve → typed Rust literals; writes only src/generated.rs)"
run = "cargo run -p ruviform-ui-theme --bin theme-codegen -- --manifest crates/ruviform-ui-theme/codegen/themes.json --out crates/ruviform-ui-theme/src/generated.rs"

[tasks.codegen-theme-check]
description = "Issue #418: verify src/generated.rs freshness — byte-compare theme-codegen output against the committed file, non-destructive (exit 1 on drift/missing; writes nothing)"
run = "cargo run -p ruviform-ui-theme --bin theme-codegen -- --manifest crates/ruviform-ui-theme/codegen/themes.json --out crates/ruviform-ui-theme/src/generated.rs --check"

[tasks.test-ui-scenario-contract]
description = "Issue #464 consumer-neutral Scenario Contract: shared SemanticGuiTest/VisualGuiTest surface — Fake adapter contract tests (ruviform-ui-test/tests/scenario_contract.rs) + GPUI adapter contract tests (ruviform-ui-gpui/tests/scenario_contract.rs, gpui-test). Issue #314 slice 2: VisualCapture capability + golden check/report path, honestly Unsupported until slice 3 capture. Writes only target/"
depends = ["test-ui-scenario-contract-fake", "test-ui-scenario-contract-gpui"]

[tasks.test-ui-scenario-contract-fake]
description = "Issue #464 scenario contract + #314 slice 2 visual/golden path, Fake side: target resolution, stale epoch/generation errors, capability pre-flight (VisualCapture not claimed), golden_check Unsupported verdict, record_golden_step evidence, intent drain, receipt/projection via deliver_event (writes only target/)"
run = "cargo test -p ruviform-ui-test --test scenario_contract"
hide = true

[tasks.test-ui-scenario-contract-gpui]
description = "Issue #464 scenario contract + #314 slice 2 visual/golden path, GPUI side: same parity scenario through GpuiGuiTest/GpuiObserver (gpui-test); VisualCapture not claimed, golden_check Unsupported — GpuiObserver::drawn() is a draw plan, not pixels (writes only target/)"
run = "cargo test -p ruviform-ui-gpui --features gpui-test --test scenario_contract"
hide = true

[tasks.test-ui-plugin-dock]
description = "Issue #631 plugin-dock scenario lane (manual/opt-in — NOT a CI-required gate): builds the real test_gain VST3 cdylib, runs crates/ruviform-plugin-dock-test's rf631.plugin-dock cases through the driver-neutral scenario contract, and writes JSONL evidence to evidence/rf631/plugin-dock-scenario.jsonl. Honest verdicts only — editor attach/dock/pixels stay Unsupported/NotRun until a real editor fixture exists (writes only target/ + evidence/rf631/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --locked -p ruviform-plugin-test-vst3
mkdir -p evidence/rf631
cargo run --locked -p ruviform-plugin-dock-test --bin plugin-dock-scenario -- --out evidence/rf631/plugin-dock-scenario.jsonl
'''

# Issue #631 headless scenario console lane (manual/opt-in — NOT a
# CI-required gate): the canonical entry for
# crates/ruviform-plugin-dock-test's `plugin-dock-console` bin — the
# headless half of the Test Lab / Scenario Console. `--list` prints
# the HEADLESS_MATRIX capability projection (declaration, never
# execution evidence); `--run` executes the selector-filtered
# catalog through the same `run_selected`/`render_jsonl` path as
# `test-ui-plugin-dock` with `lane=plugin-dock-console` so filtered
# output is never mistaken for full-lane evidence. Exit semantics:
# 0 = no Fail verdict, 1 = a Fail verdict or output-write failure,
# 2 = CLI misuse / unknown selector / selector matching zero cells.
# NotRun/Unsupported/Blocked are recorded outcomes, not lane
# failures (writes only target/ + evidence/rf631/).
[tasks.test-ui-plugin-dock-console]
description = "Issue #631 headless scenario console lane (manual/opt-in — NOT a CI-required gate): canonical plugin-dock-console entry — --list prints the HEADLESS_MATRIX capability projection (not evidence), --run executes selectors through run_selected/render_jsonl with lane=plugin-dock-console; exit 0 = no Fail verdict, 1 = Fail verdict or write failure, 2 = CLI misuse/empty selector; writes only target/ + evidence/rf631/"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --locked -p ruviform-plugin-test-vst3
mkdir -p evidence/rf631
cargo run --locked -p ruviform-plugin-dock-test --bin plugin-dock-console -- --list
cargo run --locked -p ruviform-plugin-dock-test --bin plugin-dock-console -- --run --out evidence/rf631/plugin-dock-console.jsonl
'''

# Issue #631 real-window dock lane (manual/opt-in — NOT a CI-required
# gate): builds the real plugin-test-vst3 VST3 cdylib plus its
# `l1-runner`-feature runner binary (`ruviform-plugin-test-vst3-l1-runner`
# — `required-features = ["l1-runner"]`; Issue #886's out-of-process
# crash/hang cases spawn it as the Dedicated L1 child), then runs
# crates/ruviform-plugin-dock-test's `rf631.plugin-dock-real` cases
# through `RealOsGuiTest` real OS windows — NativeSlot declare →
# bind → renderer projection → `lease_parent` (real container HWND
# via GpuiSurfaceAdapter) → `ParentSlotLease` → InProcessEditorOps
# redeem → `session.open(Docked)` — and writes JSONL evidence to
# evidence/rf631/plugin-dock-real-scenario.jsonl. `real-editor-attach`
# selects the `test_editor` descriptor whose plugin-side `IPlugView`
# creates a real child HWND under the container lease (OS-observed
# attach → detach). The catalog also carries the AC1 remainder rows
# (2-window focus transfer, real OS input injection, command
# receipt, and the window-state verdict rows — `real-window-dpi`
# judges live-geometry read-back against the lifecycle
# Resized/ScaleFactorChanged stream, `real-window-ime` drives a
# real IMM32 composition+commit into the docked editor child, and
# `real-window-close` drives the armed Veto→Approve close
# lifecycle — all pass-capable verdicts), the AC3 non-pixel editor op rows
# (`real-editor-resize`/`real-editor-redock`/`real-editor-visibility`/
# `real-editor-input`/`real-editor-focus` — session event/HWND
# oracles only, never pixels), and the Issue #886 out-of-process
# session rows (`real-session-crash`/`real-session-hang` — a
# Dedicated L1 child runs `test_editor`, the lane survives the
# child's death/wedging as `InstanceFailed` → `Terminated{HostLost}`
# → `Closed`; the `OutOfProcessPluginHost` claim is session-probed —
# an interactive host without the runner/fixture/`GUI_FLOATING`
# advertisement records the capability-gated `Unsupported`).
# Requires an interactive desktop session; on a headless host every
# case records NotRun + observed="environment_blocked" (fail-closed —
# never a fake pass, exit code stays 0). Honest verdicts only:
# `real-capture` stays window/slot-region pixels; the Issue #532
# `real-dcomp-*` cases observe the docked editor child's pixels as
# occlusion-bisect evidence (editor-pixel dock acceptance stays
# deferred). Real OS windows — run unattended (writes only target/ +
# evidence/rf631/).
[tasks.test-ui-plugin-dock-real]
description = "Issue #631 real-window plugin-dock lane (manual/opt-in — NOT a CI-required gate): real plugin-test-vst3 cdylib + l1-runner bin (test_editor real IPlugView for real-editor-attach; runner is the Issue #886 Dedicated L1 child for real-session-crash/hang — OutOfProcessPluginHost is session-probed, capability-gated Unsupported otherwise) + RealOsGuiTest real OS windows drive NativeSlot → container-HWND lease → ParentSlotLease → InProcessEditorOps redeem → session.open(Docked) plus the AC1 remainder rows (2-window focus, real OS input, command receipt, live-geometry DPI verdict, armed-lifecycle close verdict, IMM32-driven IME composition verdict) and AC3 non-pixel editor op rows (resize/re-dock/visibility/input/focus/popup); JSONL to evidence/rf631/plugin-dock-real-scenario.jsonl; headless hosts record NotRun + environment_blocked (writes only target/ + evidence/rf631/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --locked -p ruviform-plugin-test-vst3 --features l1-runner
mkdir -p evidence/rf631
cargo run --locked -p ruviform-plugin-dock-test --features real-dock --bin plugin-dock-real-scenario -- --out evidence/rf631/plugin-dock-real-scenario.jsonl
'''

# Issue #631 real-row slice — headless fail-closed proof lane
# (manual/opt-in — NOT a CI-required gate): runs
# `plugin-dock-real-scenario --blocked-probe`, which generates the
# exact reports a `RealOsGuiTest::run` startup failure produces
# WITHOUT opening a session (deterministic on any host), self-checks
# that every catalog row is NotRun + observed.environment_blocked
# and none claims environment_kind=real-window, and exits 1 on any
# violation. The reports' detail records that no session start was
# attempted — they evidence the fail-closed mapping, not an observed
# headless run. JSONL to evidence/rf631/plugin-dock-real-headless.jsonl
# (writes only target/ + evidence/rf631/).
[tasks.test-ui-plugin-dock-real-headless]
description = "Issue #631 real-window headless fail-closed proof lane (manual/opt-in — NOT a CI-required gate): plugin-dock-real-scenario --blocked-probe generates the session-start-failure reports without opening a window, asserts every catalog row is NotRun + observed.environment_blocked with no real-window claim (exit 1 on violation); JSONL to evidence/rf631/plugin-dock-real-headless.jsonl (writes only target/ + evidence/rf631/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mkdir -p evidence/rf631
cargo run --locked -p ruviform-plugin-dock-test --features real-dock --bin plugin-dock-real-scenario -- --blocked-probe --out evidence/rf631/plugin-dock-real-headless.jsonl
'''

# Issue #630 AC4 CLAP leg — the real-window plugin-dock lane run
# against the real `ruviform_plugin_test_clap` cdylib's
# `test_editor` (manual/opt-in — NOT a CI-required gate): builds the
# CLAP fixture cdylib, then runs `plugin-dock-real-scenario
# --format clap` — the separate `rf630.plugin-dock-real-clap`
# catalog/run-id/JSONL stream, never interleaved with the VST3
# lane's evidence. Same `RealOsGuiTest` NativeSlot → container-HWND
# lease → ParentSlotLease → InProcessEditorOps redeem →
# session.open(Docked) attach chain; the editor-pixel oracle
# samples the CLAP fixture's EDITOR_COLOR blue (`blue_*` evidence
# keys), visibility is the live-child hide/show law (ShowWindow —
# no VST3 destroy/recreate), re-dock records the defined
# single-embed `gui already embedded` plugin refusal then close +
# recover mints the new attach generation, and input/focus/popup
# deliver through the `ruviform.editor-ops` seam — judged by the
# fixture's title event log, the caller-queue `GetFocus` oracle
# (`HostWindow`'s best-effort `SetFocus` lands `f:0` without a
# verifiable OS focus move cross-thread), and the same popup HWND
# oracles under the CLAP class. The
# `real-clap-session-crash`/`real-clap-session-hang` rows run the
# `ruviform-plugin-test-clap-l1-runner` Dedicated L1 child — the
# CLAP `test_editor` carries the shared `Fault` param (the VST3
# #885 mirror), so the child arms `abort`/`hang` in-band exactly
# like the VST3 lane; `OutOfProcessPluginHost` is session-probed
# and the rows stay capability-gated `Unsupported` when the probe
# cannot prove the route. JSONL to
# evidence/rf630/plugin-dock-real-clap.jsonl; headless hosts record
# NotRun + environment_blocked (writes only target/ +
# evidence/rf630/).
[tasks.test-ui-plugin-dock-real-clap]
description = "Issue #630 real-window plugin-dock CLAP lane (manual/opt-in — NOT a CI-required gate): real plugin-test-clap cdylib + l1-runner bin (test_editor for the attach chain; runner is the Dedicated L1 child for real-clap-session-crash/hang — OutOfProcessPluginHost is session-probed, capability-gated Unsupported otherwise) + RealOsGuiTest real OS windows drive the same attach chain as the VST3 lane (blue pixel oracle, live-child hide/show, single-embed re-dock refusal + close/recover generation, effect-verified input/focus/popup through the ruviform.editor-ops seam — title event log + caller-queue GetFocus + both popup-kind HWND oracles under the CLAP class); JSONL to evidence/rf630/plugin-dock-real-clap.jsonl; headless hosts record NotRun + environment_blocked (writes only target/ + evidence/rf630/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --locked -p ruviform-plugin-test-clap --features l1-runner
mkdir -p evidence/rf630
cargo run --locked -p ruviform-plugin-dock-test --features real-dock --bin plugin-dock-real-scenario -- --format clap --out evidence/rf630/plugin-dock-real-clap.jsonl
'''

# Issue #630 AC4 CLAP leg — headless fail-closed proof lane
# (manual/opt-in — NOT a CI-required gate): the CLAP-format
# `--blocked-probe` generates the session-start-failure reports
# without opening a window, asserts every CLAP catalog row is
# NotRun + observed.environment_blocked with no real-window claim
# (exit 1 on violation). JSONL to
# evidence/rf630/plugin-dock-real-clap-headless.jsonl (writes only
# target/ + evidence/rf630/).
[tasks.test-ui-plugin-dock-real-clap-headless]
description = "Issue #630 real-window CLAP headless fail-closed proof lane (manual/opt-in — NOT a CI-required gate): plugin-dock-real-scenario --format clap --blocked-probe generates the session-start-failure reports without opening a window, asserts every CLAP catalog row is NotRun + observed.environment_blocked with no real-window claim (exit 1 on violation); JSONL to evidence/rf630/plugin-dock-real-clap-headless.jsonl (writes only target/ + evidence/rf630/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

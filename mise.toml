[settings]
minimum_release_age = "7d"
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

# Shared infrastructure tools plus this repository's pinned Rust toolchain.
[tools]
# Issue #85: GHSA-hq85-5cpj-mr62（eMudhra/emSign 中間 CA 侵害）の
# 修正版 0.13.4 以上を明示固定（0.12.x は同梱 CA バンドルに影響 CA が残る）。
uv = "0.13.5"
# eMudhra CA 修正版 0.5.7(GHSA-hq85-5cpj-mr62 対応)。
prek = "0.5.7"
git-lfs = "3.8.0"
"github:microsoft/apm" = "0.33.0"
"pipx:serena-agent" = { version = "1.7.0", lazy = true }
rust = { version = "1.99.0", components = ["rustfmt", "clippy"] }
actionlint = "1.7.12"
# UI PoC（poc/ui/frontend）の npm workspaces ビルド用。Issue #83:
# 2026-10-21 Node.js セキュリティ更新を踏まえ修正版で固定
# （26.x 系は 26.12.1 以上が要件）。
node = "26.12.1"

[tasks.setup]
description = "Install APM dependencies, prek hooks and repository-local Git LFS"
run = [
  "apm install",
  "prek install",
  "git lfs install --local",
]

# Rust verification tasks: single entry point shared by local dev and CI.
# `fmt` rewrites source files in place; all other tasks are non-destructive
# and produce build artifacts only under target/.

[tasks.fmt]
description = "Format workspace sources with `cargo fmt --all` (rewrites source files in place)"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check workspace formatting with `cargo fmt --all -- --check` (non-destructive; shared with CI)"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Type-check workspace with `cargo check --workspace --all-targets` (dev profile; writes only target/)"
run = "cargo check --workspace --all-targets"

[tasks.lint]
description = "Lint workspace with `cargo clippy --workspace --all-targets -- -D warnings` (dev profile; writes only target/)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run workspace tests with `cargo test --workspace` (dev/test profile; writes only target/)"
run = "cargo test --workspace"

[tasks.build]
description = "Build workspace with `cargo build --workspace` (dev profile; writes only target/)"
run = "cargo build --workspace"

# RT contract tests and benchmarks share the dev/bench profiles (no -ci
# variants yet). `test-rt` selects the `rt_*`-prefixed RT contract tests by name
# filter (added in Issues #18/#21, e.g. `rt_output_callback_path_allocates_nothing`);
# a zero-match run still exits successfully, so it stays meaningful as RT
# tests grow and degrades to a skip-equivalent pass if they are ever absent.
# `bench` is the full-measurement entry point; `bench-smoke` runs each
# benchmark once via criterion's `--test` mode and is what CI's bench job
# calls (full measurement stays a local, manual run).

[tasks.test-rt]
description = "Run RT contract tests with `cargo test --workspace rt_` name filter (dev/test profile; zero matches still exit successfully; writes only target/)"
run = "cargo test --workspace rt_"

[tasks.bench]
description = "Run workspace benchmarks with `cargo bench --workspace` (bench profile; full-measurement entry point; writes only target/ and target/criterion/)"
run = "cargo bench --workspace"

[tasks.bench-smoke]
description = "Smoke-test the ruviform-math, ruviform-rt and ruviform-viz benchmarks with `cargo bench -p ruviform-math -p ruviform-rt -p ruviform-viz -- --test` (bench profile; runs each bench once without measurement; the CI bench job calls this; writes only target/)"
run = "cargo bench -p ruviform-math -p ruviform-rt -p ruviform-viz -- --test"

# CI-only tasks: identical checks under `--profile ci` with incremental
# compilation disabled. Artifacts go to target/ci/, separate from dev's
# target/debug/. Not for routine local use (disk usage).

[tasks.check-ci]
description = "CI profile type-check: `cargo check --workspace --all-targets --profile ci` (non-destructive; writes only target/ci/)"
run = "cargo check --workspace --all-targets --profile ci"
env = { CARGO_INCREMENTAL = "0" }

[tasks.lint-ci]
description = "CI profile lint: `cargo clippy --workspace --all-targets --profile ci -- -D warnings` (non-destructive; writes only target/ci/)"
run = "cargo clippy --workspace --all-targets --profile ci -- -D warnings"
env = { CARGO_INCREMENTAL = "0" }

[tasks.test-ci]
description = "CI profile tests: `cargo test --workspace --profile ci` (non-destructive; writes only target/ci/)"
run = "cargo test --workspace --profile ci"
env = { CARGO_INCREMENTAL = "0" }

[tasks.build-ci]
description = "CI profile build: `cargo build --workspace --profile ci` (non-destructive; writes only target/ci/; run in CI only when needed)"
run = "cargo build --workspace --profile ci"
env = { CARGO_INCREMENTAL = "0" }

[tasks.verify-ci]
description = "Run the CI-equivalent verification sequence: fmt-check -> check-ci -> lint-ci -> test-ci (non-destructive; writes only target/)"
run = [
  "mise run fmt-check",
  "mise run check-ci",
  "mise run lint-ci",
  "mise run test-ci",
]
env = { CARGO_INCREMENTAL = "0" }

[tasks.test-plugin-core]
description = "Run plugin-core contract tests"
run = "cargo test -p ruviform-plugin-core"
[tasks.lint-plugin-core]
description = "Lint plugin-core and its test targets"
run = "cargo clippy -p ruviform-plugin-core --all-targets -- -D warnings"

# Feature lanes: `cargo test --workspace` only covers default features, so
# feature-gated code paths get their own tasks and a separate CI job.
[tasks.test-video-proc-icc]
description = "Run video-proc tests with the icc feature enabled (moxcms ICC path)"
run = "cargo test -p ruviform-video-proc --features icc"
[tasks.lint-video-proc-icc]
description = "Lint video-proc and its test targets with the icc feature enabled"
run = "cargo clippy -p ruviform-video-proc --all-targets --features icc -- -D warnings"

# UI webview lane (Issue #156): the adapter's implementation lives behind
# the non-default `webview` feature so `cargo check --workspace` stays
# headless; these tasks are the feature-enabled verification entry points.
# On Linux they require `libwebkit2gtk-4.1-dev` + `libgtk-3-dev` system
# packages (the `ui-verify` CI job installs them).
[tasks.check-ui-webview]
description = "Type-check the UI webview adapter and its examples with the webview feature enabled"
run = "cargo check -p ruviform-ui-webview --features webview --all-targets"
[tasks.lint-ui-webview]
description = "Lint the UI webview adapter and its test/example targets with the webview feature enabled"
run = "cargo clippy -p ruviform-ui-webview --all-targets --features webview -- -D warnings"
[tasks.test-ui-webview]
description = "Run webview-feature tests for the UI adapter (rvf:// scheme/data surface; windowed paths are manual verification)"
run = "cargo test -p ruviform-ui-webview --features webview"

# UI headless lane (Issue #258): the framework-neutral plain-TypeScript
# contract package under ui/core (value mapping + gesture state machine).
# `npm ci` restores the committed package-lock first so the lane is
# deterministic from a fresh checkout; node comes from the pinned mise
# toolchain. No UI framework/runtime is or may be introduced as a
# dependency of this lane (Issue #257 §13).
[tasks.check-ui-headless]
description = "Install ui/core deps from package-lock and type-check the headless contract package (tsc --noEmit, no DOM lib)"
run = [
  "npm --prefix ui/core ci --no-audit --no-fund",
  "npm --prefix ui/core run typecheck",
]
[tasks.test-ui-headless]
description = "Install ui/core deps from package-lock and run headless contract tests via node --test (no UI framework)"
run = [
  "npm --prefix ui/core ci --no-audit --no-fund",
  "npm --prefix ui/core test",
]

# UI components lane (Issue #259): the framework-neutral Web Components
# package under ui/components (Reference Skin controls, tokens/themes,
# Custom Elements on the ui/core contract). Same discipline as the
# headless lane: `npm ci` restores the committed package-lock, node is
# the pinned mise toolchain, and no UI framework/runtime may be added as
# a dependency (happy-dom is a test-only devDependency supplying the DOM).
[tasks.check-ui-components]
description = "Install ui/components deps from package-lock and type-check the components package (tsc --noEmit)"
run = [
  "npm --prefix ui/components ci --no-audit --no-fund",
  "npm --prefix ui/components run typecheck",
]
[tasks.test-ui-components]
description = "Install ui/components deps from package-lock and run component tests via node --test (happy-dom DOM, no UI framework)"
run = [
  "npm --prefix ui/components ci --no-audit --no-fund",
  "npm --prefix ui/components test",
]
[tasks.build-ui-components]
description = "Install ui/components deps from package-lock and emit the distributable dist/ build (tsc)"
run = [
  "npm --prefix ui/components ci --no-audit --no-fund",
  "npm --prefix ui/components run build",
]

# UI viz lane (Issue #260): the framework-neutral Reference Viz renderer
# package under ui/viz (Waveform/Meter/Spectrum scene builders, VizStyle
# paint contract, Canvas2D/WebGL2 backends, Custom Elements on the
# ui/components contract). Same discipline: `npm ci` restores the
# committed package-lock, node is the pinned mise toolchain, and no UI
# framework/runtime or renderer dependency may be added (happy-dom plus
# fake 2D/GL contexts are test-only devDependencies). LOD/FFT/data
# reduction stay in ruviform-viz — this lane must not pull them in.
[tasks.check-ui-viz]
description = "Install ui/viz deps from package-lock and type-check the viz renderer package (tsc --noEmit)"
run = [
  "npm --prefix ui/viz ci --no-audit --no-fund",
  "npm --prefix ui/viz run typecheck",
]
[tasks.test-ui-viz]
description = "Install ui/viz deps from package-lock and run viz tests via node --test (happy-dom + fake canvas/GL, no real GPU)"
run = [
  "npm --prefix ui/viz ci --no-audit --no-fund",
  "npm --prefix ui/viz test",
]
[tasks.build-ui-viz]
description = "Install ui/viz deps from package-lock and emit the distributable dist/ build (tsc)"
run = [
  "npm --prefix ui/viz ci --no-audit --no-fund",
  "npm --prefix ui/viz run build",
]

[tasks.test-ofx]
description = "Run OFX native host and fixture contract tests"
run = "cargo test -p ruviform-plugin-ofx"
[tasks.test-ofx-bridge]
description = "Run OFX bottom-up C bridge native smoke gate"
run = "cargo test -p ruviform-plugin-ofx --test bridge_native"
[tasks.lint-ofx]
description = "Lint OFX host and its test targets"
run = "cargo clippy -p ruviform-plugin-ofx --all-targets -- -D warnings"
[tasks.test-ofx-msrv]
description = "Test plugin-core and OFX library, tests and C bridge on MSRV 1.89"
run = "mise exec rust@1.89.0 -- cargo test -p ruviform-plugin-core -p ruviform-plugin-ofx"
env = { CARGO_TARGET_DIR = "target/msrv-ofx" }

# Real-plugin L1 lane (Issue #114): the `#[ignore]`-gated E2E tests under
# `tests/l1_real_adapter_e2e.rs` need the workspace-built fixture cdylib and the
# `host`-feature L1 runner binary, so the lane builds them deterministically
# first, then runs the in-process unit test layer (`--lib` bridge contract tests
# plus `--bins` for the runner binaries' own `#[cfg(test)]` fixture-resolution
# tests — neither is reached by the `--test`/`--ignored` selection) and finally
# the out-of-process E2E. This task is the only intended entry point for those
# tests — `cargo test --workspace` never runs them (`#[ignore]` + `#![cfg]` +
# `required-features` + optional deps).
[tasks.test-l1-real-plugin]
description = "Build the CLAP/VST3 fixture cdylibs and `host`-feature L1 runner bins, run the in-process bridge + runner-bin unit tests (`--lib --bins`), then the `#[ignore]`-gated real-plugin L1 E2E (`--test l1_real_adapter_e2e -- --ignored`) — requires the fixture + `host` artifacts this task itself builds"
run = [
  "cargo build -p ruviform-plugin-clap -p ruviform-plugin-vst3 --features host",
  "cargo test -p ruviform-plugin-clap -p ruviform-plugin-vst3 --features host --lib --bins",
  "cargo test -p ruviform-plugin-clap -p ruviform-plugin-vst3 --features host --test l1_real_adapter_e2e -- --ignored",
]

[tasks.lint-l1-real-plugin]
description = "Lint the CLAP/VST3 adapter crates at `-D warnings` with feature `host` (bridge, runner bins and E2E test targets) — outside the default `lint` task's feature set"
run = "cargo clippy -p ruviform-plugin-clap -p ruviform-plugin-vst3 --all-targets --features host -- -D warnings"

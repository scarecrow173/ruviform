[settings]
minimum_release_age = "7d"
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

# Shared infrastructure tools plus this repository's pinned Rust toolchain.
[tools]
# Issue #85: GHSA-hq85-5cpj-mr62（eMudhra/emSign 中間 CA 侵害）の
# 修正版 0.13.4 以上を明示固定（0.12.x は同梱 CA バンドルに影響 CA が残る）。
uv = "0.13.5"
# eMudhra CA 修正版 0.5.7(GHSA-hq85-5cpj-mr62 対応)。
prek = "0.5.7"
git-lfs = "3.8.0"
"github:microsoft/apm" = "0.33.0"
"pipx:serena-agent" = { version = "1.7.0", lazy = true }
rust = { version = "1.99.0", components = ["rustfmt", "clippy"] }
actionlint = "1.7.12"
# UI PoC（poc/ui/frontend）の npm workspaces ビルド用。Issue #83:
# 2026-10-21 Node.js セキュリティ更新を踏まえ修正版で固定
# （26.x 系は 26.12.1 以上が要件）。
node = "26.12.1"

[tasks.setup]
description = "Install APM dependencies, prek hooks and repository-local Git LFS"
run = [
  "apm install",
  "prek install",
  "git lfs install --local",
]

# Rust verification tasks: single entry point shared by local dev and CI.
# `fmt` rewrites source files in place; all other tasks are non-destructive
# and produce build artifacts only under target/.

[tasks.fmt]
description = "Format workspace sources with `cargo fmt --all` (rewrites source files in place)"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check workspace formatting with `cargo fmt --all -- --check` (non-destructive; shared with CI)"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Type-check workspace with `cargo check --workspace --all-targets` (dev profile; writes only target/)"
run = "cargo check --workspace --all-targets"

[tasks.lint]
description = "Lint workspace with `cargo clippy --workspace --all-targets -- -D warnings` (dev profile; writes only target/)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run workspace tests with `cargo test --workspace` (dev/test profile; writes only target/)"
run = "cargo test --workspace"

[tasks.check-ui-driver-boundary]
description = "Issue #390 driver boundary guard: `cargo metadata` dependency-graph + syn public-signature leak inspection against fixtures/driver-lab/boundary.json (exit 0 pass / 1 violation / 2 tool error; writes only target/)"
run = "cargo run -p ruviform-ui-test --bin gui-boundary-guard -- --offline"

[tasks.test-ui-driver-contract]
description = "Issue #390 DriverContractFixture: cases.json/stories.json manifest consistency + executable UI-DVR-01/05/07/08 fake-layer fixtures (evidence via RUVIFORM_DRIVER_LAB_EVIDENCE; writes only target/)"
run = "cargo test -p ruviform-ui-test --test driver_contract"

[tasks.build]
description = "Build workspace with `cargo build --workspace` (dev profile; writes only target/)"
run = "cargo build --workspace"

# RT contract tests and benchmarks share the dev/bench profiles (no -ci
# variants yet). `test-rt` selects the `rt_*`-prefixed RT contract tests by name
# filter (added in Issues #18/#21, e.g. `rt_output_callback_path_allocates_nothing`);
# a zero-match run still exits successfully, so it stays meaningful as RT
# tests grow and degrades to a skip-equivalent pass if they are ever absent.
# `bench` is the full-measurement entry point; `bench-smoke` runs each
# benchmark once via criterion's `--test` mode and is what CI's bench job
# calls (full measurement stays a local, manual run).

[tasks.test-rt]
description = "Run RT contract tests with `cargo test --workspace rt_` name filter (dev/test profile; zero matches still exit successfully; writes only target/)"
run = "cargo test --workspace rt_"

[tasks.bench]
description = "Run workspace benchmarks with `cargo bench --workspace` (bench profile; full-measurement entry point; writes only target/ and target/criterion/)"
run = "cargo bench --workspace"

[tasks.bench-smoke]
description = "Smoke-test the ruviform-math, ruviform-rt and ruviform-viz benchmarks with `cargo bench -p ruviform-math -p ruviform-rt -p ruviform-viz -- --test` (bench profile; runs each bench once without measurement; the CI bench job calls this; writes only target/)"
run = "cargo bench -p ruviform-math -p ruviform-rt -p ruviform-viz -- --test"

# CI-only tasks: identical checks under `--profile ci` with incremental
# compilation disabled. Artifacts go to target/ci/, separate from dev's
# target/debug/. Not for routine local use (disk usage).
#
# Issue #331 (CI-OPT-04): `cargo clippy` compiles workspace members with
# clippy-driver in check mode and emits all rustc diagnostics plus clippy
# lints, so the CI verify lane runs lint-ci only (no separate check-ci).
# `check-ci` stays available as a rustc-only type-check for local triage
# (e.g. isolating a clippy-driver issue); it is not part of the CI lane.

[tasks.check-ci]
description = "CI profile type-check: `cargo check --workspace --all-targets --profile ci` (standalone rustc-only check for local triage — not in the CI verify lane since Issue #331; lint-ci subsumes it. Non-destructive; writes only target/ci/)"
run = "cargo check --workspace --all-targets --profile ci"
env = { CARGO_INCREMENTAL = "0" }

[tasks.lint-ci]
description = "CI profile lint + type-check: `cargo clippy --workspace --all-targets --profile ci -- -D warnings` (clippy-driver emits all rustc diagnostics plus clippy lints — owns type-checking in the CI verify lane since Issue #331; non-destructive; writes only target/ci/)"
run = "cargo clippy --workspace --all-targets --profile ci -- -D warnings"
env = { CARGO_INCREMENTAL = "0" }

[tasks.test-ci]
description = "CI profile tests: `cargo test --workspace --profile ci` (non-destructive; writes only target/ci/)"
run = "cargo test --workspace --profile ci"
env = { CARGO_INCREMENTAL = "0" }

[tasks.build-ci]
description = "CI profile build: `cargo build --workspace --profile ci` (non-destructive; writes only target/ci/; run in CI only when needed)"
run = "cargo build --workspace --profile ci"
env = { CARGO_INCREMENTAL = "0" }

[tasks.verify-ci]
description = "Run the CI-equivalent verification sequence: fmt-check -> lint-ci -> test-ci (lint-ci owns type-checking since Issue #331; non-destructive; writes only target/)"
run = [
  "mise run fmt-check",
  "mise run lint-ci",
  "mise run test-ci",
]
env = { CARGO_INCREMENTAL = "0" }

# Issue #366 (Full CI Stage 1): contract tests for the ci/summary aggregated
# fail-closed verdict. The `ci-summary` CI job runs this before evaluating so
# a broken evaluator fails the job instead of publishing a wrong verdict.
[tasks.test-ci-summary]
description = "Run ci/summary verdict contract tests via `node --test ci/summary/` (needs result matrix, per-leg checkout-sha evidence, expected_sha dispatch contract, report JSON shape; requires node from the pinned toolchain)"
run = "node --test ci/summary/"

# Issue #368 (CI failure Issue Tracker): contract tests for the ci/tracker
# evaluator. The `track` job in ci-issue-tracker.yml runs this before any
# GitHub API call so a broken evaluator fails the job instead of creating/
# updating/closing the wrong issue. All tests use a mock client — offline.
[tasks.test-ci-tracker]
description = "Run ci/tracker contract tests via `node --test ci/tracker/` (valid-run filter and conclusion matrices, plan action matrix incl. run-id/attempt + updated_at ordering and compare close-guard, marker roundtrip, sanitize, API failure propagation; mock client only, no network; requires node from the pinned toolchain)"
run = "node --test ci/tracker/"

# Issue #367 (daily scheduler): contract tests for the ci/daily decision
# evaluator. The `daily-ci` job runs this before the real dispatch path so
# a broken evaluator fails the job instead of deciding wrongly.
[tasks.test-ci-daily]
description = "Run ci/daily scheduler decision contract tests via `node --test ci/daily/` (decision matrix, in-flight/unknown hold, bounded retry budget, dispatch confirm + landed-sha, report JSON shape, workflow trigger contract ci-yml-contract.test.mjs; requires node from the pinned toolchain)"
run = "node --test ci/daily/"

# Issue #294 (cross-consumer candidate-tuple gate): contract tests for the
# ci/consumer-verify evidence evaluator. The `preflight` job in
# consumer-verify.yml runs this before any lane executes so a broken
# evaluator fails the run instead of recording a wrong status.
[tasks.test-ci-consumer-verify]
description = "Run ci/consumer-verify contract tests via `node --test ci/consumer-verify/` (classify-ref matrix, lane/status derivation, tuple match/mismatch, evidence JSON+summary shape, secret non-leak, workflow yml structure contract; requires node from the pinned toolchain)"
run = "node --test ci/consumer-verify/"

[tasks.test-plugin-core]
description = "Run plugin-core contract tests"
run = "cargo test -p ruviform-plugin-core"
[tasks.lint-plugin-core]
description = "Lint plugin-core and its test targets"
run = "cargo clippy -p ruviform-plugin-core --all-targets -- -D warnings"

# Feature lanes: `cargo test --workspace` only covers default features, so
# feature-gated code paths get their own tasks and a separate CI job.
[tasks.test-video-proc-icc]
description = "Run video-proc tests with the icc feature enabled (moxcms ICC path)"
run = "cargo test -p ruviform-video-proc --features icc"
[tasks.lint-video-proc-icc]
description = "Lint video-proc and its test targets with the icc feature enabled"
run = "cargo clippy -p ruviform-video-proc --all-targets --features icc -- -D warnings"

# IO compression lane (Issues #300/#301): gzip/deflate/zstd are non-default features and
# `cargo test --workspace` covers default features only. The lane runs the
# full feature matrix because reduced feature sets gate different code —
# dead code under `default = []` or a single format only fails under
# `-D warnings` at that exact combination. `&&` chains keep the `-p` args
# inside the task body (established convention from the retired ci/impact
# lane-owner derivation; kept so the feature matrix stays grep-able).
[tasks.check-io-compression]
description = "Type-check io-compression across its feature matrix (default=[] plus each format and combined)"
run = "cargo check -p ruviform-io-compression --all-targets && cargo check -p ruviform-io-compression --all-targets --features gzip && cargo check -p ruviform-io-compression --all-targets --features deflate && cargo check -p ruviform-io-compression --all-targets --features zstd && cargo check -p ruviform-io-compression --all-targets --features gzip,deflate,zstd"
[tasks.lint-io-compression]
description = "Lint io-compression and its test targets across the full feature matrix"
run = "cargo clippy -p ruviform-io-compression --all-targets -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features gzip -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features deflate -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features zstd -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features gzip,deflate,zstd -- -D warnings"
[tasks.test-io-compression]
description = "Run io-compression tests across its feature matrix (unit/integration/doc tests per combination)"
run = "cargo test -p ruviform-io-compression && cargo test -p ruviform-io-compression --features gzip && cargo test -p ruviform-io-compression --features deflate && cargo test -p ruviform-io-compression --features zstd && cargo test -p ruviform-io-compression --features gzip,deflate,zstd"

# IO structured lane (Issue #299): json/yaml/toml/csv/xml are non-default
# features so `cargo test --workspace` covers none of the format modules.
# Same `&&`-chained single-string form as io-compression: dead code under
# `default = []` or a lone format only fails `-D warnings` at that exact
# combination. The matrix pins the spec-required combinations — default,
# `xml` alone, `xml` + `file`, and `--all-features` (every format + file).
# These tasks are the local/CI-shared entry points; wiring a dedicated CI
# job is tracked separately (io-structured has had no lane since #297).
[tasks.check-io-structured]
description = "Type-check io-structured across its format feature matrix (default, xml, xml+file, all features)"
run = "cargo check -p ruviform-io-structured --all-targets && cargo check -p ruviform-io-structured --all-targets --features xml && cargo check -p ruviform-io-structured --all-targets --features xml,file && cargo check -p ruviform-io-structured --all-targets --all-features"
[tasks.lint-io-structured]
description = "Lint io-structured and its test targets across the format feature matrix"
run = "cargo clippy -p ruviform-io-structured --all-targets -- -D warnings && cargo clippy -p ruviform-io-structured --all-targets --features xml -- -D warnings && cargo clippy -p ruviform-io-structured --all-targets --features xml,file -- -D warnings && cargo clippy -p ruviform-io-structured --all-targets --all-features -- -D warnings"
[tasks.test-io-structured]
description = "Run io-structured tests across the format feature matrix (unit/integration/doc tests per combination)"
run = "cargo test -p ruviform-io-structured && cargo test -p ruviform-io-structured --features xml && cargo test -p ruviform-io-structured --features xml,file && cargo test -p ruviform-io-structured --all-features"

# IO composition lane (Issue #306): the ruviform-io-e2e crate carries the
# cross-layer boundary tests (StagedFile lifecycle, Structured→StagedFile,
# TAR/ZIP→Gzip/Zstd→StagedFile, secure extraction, WavMuxer→seal→decode→
# publish). It is test-only — dev-dependencies pull the feature
# combinations the boundary needs (structured json,csv,file; compression
# gzip,zstd), so `-p` alone exercises the full composition surface.
[tasks.check-io-e2e]
description = "Type-check the io-e2e composition test crate and all its test targets"
run = "cargo check -p ruviform-io-e2e --all-targets"
[tasks.lint-io-e2e]
description = "Lint the io-e2e composition test crate and its test targets"
run = "cargo clippy -p ruviform-io-e2e --all-targets -- -D warnings"
[tasks.test-io-e2e]
description = "Run the io-e2e composition boundary tests (staged lifecycle, structured/compression/archive/wav layers)"
run = "cargo test -p ruviform-io-e2e"

# UI webview lane (Issue #156): the adapter's implementation lives behind
# the non-default `webview` feature so `cargo check --workspace` stays
# headless; these tasks are the feature-enabled verification entry points.
# On Linux they require `libwebkit2gtk-4.1-dev` + `libgtk-3-dev` system
# packages (the `ui-verify` CI job installs them).
[tasks.check-ui-webview]
description = "Type-check the UI webview adapter and its examples with the webview feature enabled"
run = "cargo check -p ruviform-ui-webview --features webview --all-targets"
[tasks.lint-ui-webview]
description = "Lint the UI webview adapter and its test/example targets with the webview feature enabled"
run = "cargo clippy -p ruviform-ui-webview --all-targets --features webview -- -D warnings"
[tasks.test-ui-webview]
description = "Run webview-feature tests for the UI adapter (rvf:// scheme/data surface; windowed paths are manual verification)"
run = "cargo test -p ruviform-ui-webview --features webview"

# UI npm dependency install tasks (Issue #330): each ui/* package's
# lockfile-driven `npm ci` lives in exactly one task. `sources` (lockfile +
# manifest) and `outputs` (the hidden lockfile npm always writes into
# node_modules) make the task freshness-checked: mise skips it while its
# inputs are unchanged, so verify tasks can `depends` on it without
# reinstalling on every invocation. node comes from the pinned mise
# toolchain on every supported OS.
[tasks.install-ui-core]
description = "Install ui/core deps via npm ci from package-lock (skipped while lockfile/manifest and node_modules marker are unchanged)"
sources = ["ui/core/package-lock.json", "ui/core/package.json"]
outputs = ["ui/core/node_modules/.package-lock.json"]
run = "npm --prefix ui/core ci --no-audit --no-fund"
[tasks.install-ui-components]
description = "Install ui/components deps via npm ci from package-lock (skipped while lockfile/manifest and node_modules marker are unchanged)"
sources = ["ui/components/package-lock.json", "ui/components/package.json"]
outputs = ["ui/components/node_modules/.package-lock.json"]
run = "npm --prefix ui/components ci --no-audit --no-fund"
[tasks.install-ui-viz]
description = "Install ui/viz deps via npm ci from package-lock (skipped while lockfile/manifest and node_modules marker are unchanged)"
sources = ["ui/viz/package-lock.json", "ui/viz/package.json"]
outputs = ["ui/viz/node_modules/.package-lock.json"]
run = "npm --prefix ui/viz ci --no-audit --no-fund"
[tasks.install-ui-binding]
description = "Install ui/binding deps via npm ci from package-lock (skipped while lockfile/manifest and node_modules marker are unchanged)"
sources = ["ui/binding/package-lock.json", "ui/binding/package.json"]
outputs = ["ui/binding/node_modules/.package-lock.json"]
run = "npm --prefix ui/binding ci --no-audit --no-fund"
[tasks.install-ui-guitest]
description = "Install ui/guitest deps via npm ci from package-lock (skipped while lockfile/manifest and node_modules marker are unchanged)"
sources = ["ui/guitest/package-lock.json", "ui/guitest/package.json"]
outputs = ["ui/guitest/node_modules/.package-lock.json"]
run = "npm --prefix ui/guitest ci --no-audit --no-fund"
[tasks.install-ui-showcase]
description = "Install ui/showcase deps via npm ci from package-lock (skipped while lockfile/manifest and node_modules marker are unchanged)"
sources = ["ui/showcase/package-lock.json", "ui/showcase/package.json"]
outputs = ["ui/showcase/node_modules/.package-lock.json"]
run = "npm --prefix ui/showcase ci --no-audit --no-fund"
[tasks.install-ui-browser-test]
description = "Install ui/browser-test deps via npm ci from package-lock (skipped while lockfile/manifest and node_modules marker are unchanged)"
sources = ["ui/browser-test/package-lock.json", "ui/browser-test/package.json"]
outputs = ["ui/browser-test/node_modules/.package-lock.json"]
run = "npm --prefix ui/browser-test ci --no-audit --no-fund"

# Issue #332 (CI-OPT-05): browser binary install is a dedicated task so the
# download is a separately measurable step in CI. `playwright install` is
# revision-idempotent — existing binaries make it a fast no-op (~1-3s), so no
# mise sources/outputs freshness: the browser path is PLAYWRIGHT_BROWSERS_PATH
# dependent and playwright's own per-revision presence check is the
# authoritative skip. OS system libraries stay out of this task (Linux CI
# runs `playwright install-deps` separately; local runs stay non-privileged).
[tasks.install-ui-browser-chromium]
description = "Install the pinned Playwright Chromium (+headless shell, ffmpeg) browsers — idempotent per-revision check, downloads only what is missing (deps via install-ui-browser-test)"
depends = ["install-ui-browser-test"]
run = "npm --prefix ui/browser-test exec -- playwright install chromium"

# Aggregate install entry point (Issue #330): the ui-verify CI job runs this
# once so each package-lock gets a single `npm ci` per job; the verify tasks
# below reuse the prepared node_modules via freshness-skipped depends.
[tasks.setup-ui]
description = "Install all seven ui/* npm deps once per lockfile (CI ui-verify preparation step; verify tasks reuse the result via freshness-skipped depends)"
depends = [
  "install-ui-core",
  "install-ui-components",
  "install-ui-viz",
  "install-ui-binding",
  "install-ui-guitest",
  "install-ui-showcase",
  "install-ui-browser-test",
]

# UI headless lane (Issue #258): the framework-neutral plain-TypeScript
# contract package under ui/core (value mapping + gesture state machine).
# Deps come from install-ui-core (freshness-skipped when already current);
# node comes from the pinned mise toolchain. No UI framework/runtime is or
# may be introduced as a dependency of this lane (Issue #257 §13).
[tasks.check-ui-headless]
description = "Type-check the headless contract package (tsc --noEmit, no DOM lib; deps via install-ui-core)"
depends = ["install-ui-core"]
run = "npm --prefix ui/core run typecheck"
[tasks.test-ui-headless]
description = "Run headless contract tests via node --test (no UI framework; deps via install-ui-core)"
depends = ["install-ui-core"]
run = "npm --prefix ui/core test"

# UI components lane (Issue #259): the framework-neutral Web Components
# package under ui/components (Reference Skin controls, tokens/themes,
# Custom Elements on the ui/core contract). Same discipline as the
# headless lane: deps come from install-ui-components, node is
# the pinned mise toolchain, and no UI framework/runtime may be added as
# a dependency (happy-dom is a test-only devDependency supplying the DOM).
[tasks.check-ui-components]
description = "Type-check the components package (tsc --noEmit; deps via install-ui-components)"
depends = ["install-ui-components"]
run = "npm --prefix ui/components run typecheck"
[tasks.test-ui-components]
description = "Run component tests via node --test (happy-dom DOM, no UI framework; deps via install-ui-components)"
depends = ["install-ui-components"]
run = "npm --prefix ui/components test"
[tasks.build-ui-components]
description = "Emit the distributable dist/ build (tsc; deps via install-ui-components; skipped while sources and dist are unchanged)"
depends = ["install-ui-components"]
sources = [
  "ui/components/src/**/*.ts",
  "ui/components/tsconfig*.json",
  "ui/components/package.json",
  "ui/core/src/**/*.ts",
]
outputs = ["ui/components/dist/**/*"]
run = "npm --prefix ui/components run build"

# UI viz lane (Issue #260): the framework-neutral Reference Viz renderer
# package under ui/viz (Waveform/Meter/Spectrum scene builders, VizStyle
# paint contract, Canvas2D/WebGL2 backends, Custom Elements on the
# ui/components contract). Same discipline: deps come from install-ui-viz,
# node is the pinned mise toolchain, and no UI
# framework/runtime or renderer dependency may be added (happy-dom plus
# fake 2D/GL contexts are test-only devDependencies). LOD/FFT/data
# reduction stay in ruviform-viz — this lane must not pull them in.
[tasks.check-ui-viz]
description = "Type-check the viz renderer package (tsc --noEmit; deps via install-ui-viz)"
depends = ["install-ui-viz"]
run = "npm --prefix ui/viz run typecheck"
[tasks.test-ui-viz]
description = "Run viz tests via node --test (happy-dom + fake canvas/GL, no real GPU; deps via install-ui-viz)"
depends = ["install-ui-viz"]
run = "npm --prefix ui/viz test"
[tasks.build-ui-viz]
description = "Emit the distributable dist/ build (tsc; deps via install-ui-viz; skipped while sources and dist are unchanged)"
depends = ["install-ui-viz"]
sources = [
  "ui/viz/src/**/*.ts",
  "ui/viz/tsconfig*.json",
  "ui/viz/package.json",
  "ui/components/src/**/*.ts",
  "ui/core/src/**/*.ts",
]
outputs = ["ui/viz/dist/**/*"]
run = "npm --prefix ui/viz run build"

# UI binding lane (Issue #261): the generic Command/Query binding
# package under ui/binding — consumer-supplied dispatch/subscribe/query
# ports, state receipts (preview/pending/accepted/applied/rejected/
# unsupported/timeout/observed), bounded preview coalescing,
# multiwindow view links, and a thin DOM adapter over the ui/components
# event contract. Same discipline: deps come from install-ui-binding,
# node is the pinned mise toolchain, and no UI
# framework/DOM/renderer dependency may be added to src/ (happy-dom is
# a test-only devDependency). Domain state ownership — authorization,
# undo, job lifecycle — stays inside consumer gateways; this lane must
# not pull domain crates in.
[tasks.check-ui-binding]
description = "Type-check the binding package (tsc --noEmit; deps via install-ui-binding)"
depends = ["install-ui-binding"]
run = "npm --prefix ui/binding run typecheck"
[tasks.test-ui-binding]
description = "Run binding tests via node --test (happy-dom for the DOM adapter lane, no UI framework; deps via install-ui-binding)"
depends = ["install-ui-binding"]
run = "npm --prefix ui/binding test"
[tasks.build-ui-binding]
description = "Emit the distributable dist/ build (tsc; deps via install-ui-binding; skipped while sources and dist are unchanged)"
depends = ["install-ui-binding"]
sources = [
  "ui/binding/src/**/*.ts",
  "ui/binding/tsconfig*.json",
  "ui/binding/package.json",
  "ui/core/src/**/*.ts",
]
outputs = ["ui/binding/dist/**/*"]
run = "npm --prefix ui/binding run build"

# UI guitest lane (Issue #311): the deterministic GUI-test shared
# foundation under ui/guitest — the versioned fixture corpus shared
# with the Rust lanes (rvf.ipc.v1 / rvf://data / Binding contract),
# fail-closed wire validators, opt-in bounded JSONL recorder, seeded
# fault matrix, and the deterministic record/replay driver that
# injects inputs into the real InteractionControl/CommandBinding/
# QueryBinding/ViewLink path and judges the trace against an
# independent contract oracle. Test-only package: deps come from
# install-ui-guitest, node is the pinned mise toolchain, and
# no UI framework/DOM/WebView/renderer dependency may be added — the
# lane replays through real binding objects headlessly.
[tasks.check-ui-guitest]
description = "Type-check the GUI-test foundation (tsc --noEmit; deps via install-ui-guitest)"
depends = ["install-ui-guitest"]
run = "npm --prefix ui/guitest run typecheck"
[tasks.test-ui-guitest]
description = "Run fixture conformance + replay/oracle tests via node --test (headless, deterministic; deps via install-ui-guitest)"
depends = ["install-ui-guitest"]
run = "npm --prefix ui/guitest test"

# UI showcase lane (Issue #263): the design-system showcase +
# verification fixtures under ui/showcase — the theme matrix (Reference
# Light/Dark + DAW/analysis exemplars + custom skin), ruviform-owned
# deterministic demo data and generic BindingPort gateways, the
# standalone vanilla-WebComponents page, and the headless regression /
# a11y / cross-consumer / dependency-audit tests over the public
# ui/components + ui/viz + ui/binding surfaces. Same discipline:
# deps come from install-ui-showcase, node is the pinned mise
# toolchain, and no UI framework/runtime or renderer dependency may be
# added (happy-dom plus fake 2D/GL contexts are test-only
# devDependencies). Real WebView/GPU/pixel/multiwindow evidence is out
# of scope for this lane — it stays on the #243 manual gates.
[tasks.check-ui-showcase]
description = "Type-check the showcase + verification fixtures (tsc --noEmit; deps via install-ui-showcase)"
depends = ["install-ui-showcase"]
run = "npm --prefix ui/showcase run typecheck"
[tasks.test-ui-showcase]
description = "Run showcase tests via node --test (happy-dom + fake canvas/GL, no real GPU/WebView; deps via install-ui-showcase)"
depends = ["install-ui-showcase"]
run = "npm --prefix ui/showcase test"
# The showcase build emits one composite dist (tsconfig.build.json compiles
# showcase + core + components + viz + binding src with rootDir ".."), so its
# sources span all five package trees — ui/browser-test typechecks/tests
# against this dist via `depends` (Issue #310/#330).
[tasks.build-ui-showcase]
description = "Emit the composite dist/ build for the static showcase page (tsc over showcase+core+components+viz+binding src; deps via install-ui-showcase; skipped while sources and dist are unchanged)"
depends = ["install-ui-showcase"]
sources = [
  "ui/showcase/src/**/*.ts",
  "ui/showcase/tsconfig*.json",
  "ui/showcase/package.json",
  "ui/core/src/**/*.ts",
  "ui/components/src/**/*.ts",
  "ui/viz/src/**/*.ts",
  "ui/binding/src/**/*.ts",
]
outputs = ["ui/showcase/dist/**/*"]
run = "npm --prefix ui/showcase run build"

# UI browser-test lane (Issue #310): framework-neutral real-browser GUI
# verification — Playwright drives the actual Web Components in a real
# Chromium DOM over hermetic fixture pages served straight from workspace
# dist/ (no server process, deterministic clock/seed/viewport). Depends on
# the showcase dist the same way the import map serves it, so the showcase
# build is pinned via `depends`. The Chromium browser install lives in
# `install-ui-browser-chromium` (Issue #332) so CI can cache/measure it
# separately; `test-ui-browser` resolves it via `depends` so local runs
# stay self-sufficient. Linux runners additionally need the
# browser system libraries once (`playwright install-deps chromium`,
# requires sudo) — CI performs that step; it is deliberately not inside
# this task so local runs stay non-privileged. Browser PASS here is
# browser-lane evidence only: it is NOT OS WebView, native GPU, or
# product E2E evidence (those stay RF-GT-04 #313 / RF-GT-05 #314).
[tasks.check-ui-browser-test]
description = "Type-check the browser-test harness (tsc --noEmit; typechecks against ui/showcase dist declarations; deps via install-ui-browser-test + build-ui-showcase)"
depends = ["install-ui-browser-test", "build-ui-showcase"]
run = "npm --prefix ui/browser-test run typecheck"
[tasks.test-ui-browser]
description = "Build fixture page modules and run the Playwright browser suite (real browser DOM; writes test-results/evidence.json with env/revision/seed/outcomes; Chromium install resolved via install-ui-browser-chromium + showcase dist via build-ui-showcase deps)"
depends = [
  "install-ui-browser-test",
  "build-ui-showcase",
  "install-ui-browser-chromium",
]
run = [
  "npm --prefix ui/browser-test run build",
  "npm --prefix ui/browser-test test",
]

[tasks.test-ofx]
description = "Run OFX native host and fixture contract tests"
run = "cargo test -p ruviform-plugin-ofx"
[tasks.test-ofx-bridge]
description = "Run OFX bottom-up C bridge native smoke gate"
run = "cargo test -p ruviform-plugin-ofx --test bridge_native"
[tasks.lint-ofx]
description = "Lint OFX host and its test targets"
run = "cargo clippy -p ruviform-plugin-ofx --all-targets -- -D warnings"
[tasks.test-ofx-msrv]
description = "Test plugin-core and OFX library, tests and C bridge on MSRV 1.89"
run = "mise exec rust@1.89.0 -- cargo test -p ruviform-plugin-core -p ruviform-plugin-ofx"
env = { CARGO_TARGET_DIR = "target/msrv-ofx" }

# Real-plugin L1 lane (Issue #114): the `#[ignore]`-gated E2E tests under
# `tests/l1_real_adapter_e2e.rs` need the workspace-built fixture cdylib and the
# `host`-feature L1 runner binary, so the lane builds them deterministically
# first, then runs the in-process unit test layer (`--lib` bridge contract tests
# plus `--bins` for the runner binaries' own `#[cfg(test)]` fixture-resolution
# tests — neither is reached by the `--test`/`--ignored` selection) and finally
# the out-of-process E2E. This task is the only intended entry point for those
# tests — `cargo test --workspace` never runs them (`#[ignore]` + `#![cfg]` +
# `required-features` + optional deps).
[tasks.test-l1-real-plugin]
description = "Build the CLAP/VST3 fixture cdylibs and `host`-feature L1 runner bins, run the in-process bridge + runner-bin unit tests (`--lib --bins`), then the `#[ignore]`-gated real-plugin L1 E2E (`--test l1_real_adapter_e2e -- --ignored`) — requires the fixture + `host` artifacts this task itself builds"
run = [
  "cargo build -p ruviform-plugin-clap -p ruviform-plugin-vst3 --features host",
  "cargo test -p ruviform-plugin-clap -p ruviform-plugin-vst3 --features host --lib --bins",
  "cargo test -p ruviform-plugin-clap -p ruviform-plugin-vst3 --features host --test l1_real_adapter_e2e -- --ignored",
]

[tasks.lint-l1-real-plugin]
description = "Lint the CLAP/VST3 adapter crates at `-D warnings` with feature `host` (bridge, runner bins and E2E test targets) — outside the default `lint` task's feature set"
run = "cargo clippy -p ruviform-plugin-clap -p ruviform-plugin-vst3 --all-targets --features host -- -D warnings"

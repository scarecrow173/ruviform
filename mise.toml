# the lane records environment_blocked honestly, never a fake pass.
[tasks.test-ui-windowed-uitest]
description = "Run the Issue #313 slice S2 windowed rvf.uitest.v1 lane on the interactive desktop (manual verification — writes evidence/issue-313-windowed-uitest/verdict-windowed-uitest.json; environment_blocked when no desktop session)"
env = { RVF_WINDOWED_UITEST = "1" }
run = "cargo test -p ruviform-ui-gpui --features uitest --test windowed_uitest -- --test-threads=1"

[tasks.example-ui-webview-e2e]
description = "Run the real WebView round-trip check (page load → IPC → event delivery; WebView2 on Windows, manual verification — not a CI lane)"
run = "cargo run -p ruviform-ui-webview --features webview --example e2e_smoke"


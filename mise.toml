# dist/ (no server process, deterministic clock/seed/viewport). Depends on
# the showcase dist the same way the import map serves it, so the showcase
# build is pinned via `depends`. The Chromium browser install lives in
# `install-ui-browser-chromium` (Issue #332) so CI can cache/measure it
# separately; `test-ui-browser` resolves it via `depends` so local runs
# stay self-sufficient. Linux runners additionally need the
# browser system libraries once (`playwright install-deps chromium`,
# requires sudo) — CI performs that step; it is deliberately not inside
# this task so local runs stay non-privileged. Browser PASS here is
# browser-lane evidence only: it is NOT OS WebView, native GPU, or
# product E2E evidence (those stay RF-GT-04 #313 / RF-GT-05 #314).
[tasks.check-ui-browser-test]
description = "Type-check the browser-test harness (tsc --noEmit; typechecks against ui/showcase dist declarations; deps via install-ui-browser-test + build-ui-showcase)"
depends = ["install-ui-browser-test", "build-ui-showcase"]
run = "npm --prefix ui/browser-test run typecheck"
[tasks.test-ui-browser]
description = "Build fixture page modules and run the Playwright browser suite (real browser DOM; writes test-results/evidence.json with env/revision/seed/outcomes; Chromium install resolved via install-ui-browser-chromium + showcase dist via build-ui-showcase deps)"
depends = [
  "install-ui-browser-test",
  "build-ui-showcase",
  "install-ui-browser-chromium",
]
run = [
  "npm --prefix ui/browser-test run build",
  "npm --prefix ui/browser-test test",
]

[tasks.test-ofx]
description = "Run OFX native host and fixture contract tests"
run = "cargo test -p ruviform-plugin-ofx"
[tasks.test-ofx-bridge]
description = "Run OFX bottom-up C bridge native smoke gate"
run = "cargo test -p ruviform-plugin-ofx --test bridge_native"
[tasks.lint-ofx]
description = "Lint OFX host and its test targets"
run = "cargo clippy -p ruviform-plugin-ofx --all-targets -- -D warnings"
[tasks.test-ofx-msrv]
description = "Test plugin-core and OFX library, tests and C bridge on MSRV 1.89"
run = "mise exec rust@1.89.0 -- cargo test -p ruviform-plugin-core -p ruviform-plugin-ofx"
env = { CARGO_TARGET_DIR = "target/msrv-ofx" }

# Issue #411: ruviform-ui-test の MSRV 1.89 検証。gui boundary guard が
# 通常 dep として使う cargo_metadata の推移依存（cargo-platform 等）を
# 含め、MSRV toolchain で crate + 全 test/bin target をビルド・実行する。
[tasks.test-ui-test-msrv]
description = "Test ruviform-ui-test on MSRV 1.89 (GUI boundary guard + cargo_metadata transitive deps; Issue #411)"
run = "mise exec rust@1.89.0 -- cargo test -p ruviform-ui-test"
env = { CARGO_TARGET_DIR = "target/msrv-ui-test" }

# Issue #293 (OBS-11): ruviform-observability の MSRV 1.89 検証。
# `--all-features` で feature-gated test target（integration /
# logging / tracing-export / allocation-probe）も MSRV toolchain で
# ビルド・実行する。
[tasks.test-observability-msrv]
description = "Test ruviform-observability on MSRV 1.89 with all features (integration/logging/tracing-export/allocation-probe test targets included; Issue #293)"
run = "mise exec rust@1.89.0 -- cargo test -p ruviform-observability --all-features"
env = { CARGO_TARGET_DIR = "target/msrv-observability" }

# Issue #306 受入行「MSRV1.89 … 監査を統合」に対応する IO 系 crate の
# MSRV lane。`test-ofx-msrv`/`test-ui-test-msrv` と同じく
# `mise exec rust@1.89.0` で toolchain を固定して実走する。
# io-e2e を同時 -p に含めると、その dev-dependencies 経由で
# io-structured（json,yaml,toml,csv,xml,file）と io-compression
# （gzip,zstd）の feature が unify され、合成 E2E が実際に使う
# feature 組合せが MSRV toolchain でそのまま検証される。
# io-compression の `deflate` は io-e2e が消費しないため、第 2
# コマンドで単独 feature として別途実行する。
[tasks.test-io-msrv]
description = "Test the six generic IO crates (io-file/io-archive/io-structured/io-compression/io-wav/io-e2e) on MSRV 1.89, including io-e2e-unified feature sets plus io-compression deflate (Issue #306)"
run = [
  "mise exec rust@1.89.0 -- cargo test -p ruviform-io-file -p ruviform-io-archive -p ruviform-io-structured -p ruviform-io-compression -p ruviform-io-wav -p ruviform-io-e2e",
  "mise exec rust@1.89.0 -- cargo test -p ruviform-io-compression --features deflate",
]
env = { CARGO_TARGET_DIR = "target/msrv-io" }

# Real-plugin L1 lane (Issue #114): the `#[ignore]`-gated E2E tests under
# `tests/l1_real_adapter_e2e.rs` need the workspace-built fixture cdylib and the
# `host`-feature L1 runner binary, so the lane builds them deterministically
# first, then runs the in-process unit test layer (`--lib` bridge contract tests
# plus `--bins` for the runner binaries' own `#[cfg(test)]` fixture-resolution
# tests — neither is reached by the `--test`/`--ignored` selection) and finally
# the out-of-process E2E. This task is the only intended entry point for those
# tests — `cargo test --workspace` never runs them (`#[ignore]` + `#![cfg]` +
# `required-features` + optional deps).
[tasks.test-l1-real-plugin]
description = "Build the CLAP/VST3 fixture cdylibs and `host`-feature L1 runner bins, run the in-process bridge + runner-bin unit tests (`--lib --bins`), then the `#[ignore]`-gated real-plugin L1 E2E (`--test l1_real_adapter_e2e -- --ignored`) — requires the fixture + `host` artifacts this task itself builds"
run = [
  "cargo build -p ruviform-plugin-clap -p ruviform-plugin-vst3 --features host",
  "cargo test -p ruviform-plugin-clap -p ruviform-plugin-vst3 --features host --lib --bins",
  "cargo test -p ruviform-plugin-clap -p ruviform-plugin-vst3 --features host --test l1_real_adapter_e2e -- --ignored",
]

[tasks.check-l1-real-plugin]
description = "Type-check CLAP/VST3 adapter host-feature libs, runner bins, tests and examples on the current OS; native check for non-Linux CI lanes"
run = "cargo check -p ruviform-plugin-clap -p ruviform-plugin-vst3 --all-targets --features host"

[tasks.lint-l1-real-plugin]
description = "Lint the CLAP/VST3 adapter crates at `-D warnings` with feature `host` (bridge, runner bins and E2E test targets) — outside the default `lint` task's feature set"
run = "cargo clippy -p ruviform-plugin-clap -p ruviform-plugin-vst3 --all-targets --features host -- -D warnings"

# Real-device input lane (Issue #251): the `#[ignore]`-gated E2E tests
# under `tests/real_input_e2e.rs` need real capture hardware + OS input
# permission, so the lane enables the opt-in `real-device` feature and
# selects `--ignored` explicitly. This task is the only intended entry
# point — default `cargo test` never runs them (`#![cfg(feature)]` +
# `#[ignore]`). Hardware-dependent manual lane: never in CI; results
# are recorded in the Issue #251 implementation record.
[tasks.test-audio-real-input]
description = "Run the `#[ignore]`-gated real-device input E2E (`--features real-device --test real_input_e2e -- --ignored`) — requires audio hardware with an input device + capture permission; manual lane, never CI"
run = "cargo test -p ruviform-audio-device --features real-device --test real_input_e2e -- --ignored --test-threads=1"

[tasks.lint-audio-real-input]
description = "Lint ruviform-audio-device at `-D warnings` with feature `real-device` (the E2E test target) — outside the default `lint` task's feature set"
run = "cargo clippy -p ruviform-audio-device --all-targets --features real-device -- -D warnings"

# Real-device MIDI lane (Issue #253): the `#[ignore]`-gated E2E tests
# in `ruviform-midi-device` (adapter path — enumerate → open → repeated
# `read` with stamp-domain/provenance + `dropped`/`unsupported`
# observation → close → `StreamInvalidated`, plus the lib smoke test)
# and `ruviform-audio-plugin-bridge` (`SystemBackend` → `InputTx::pump`
# → `InputStage` counter-transparency path) exercise the real OS MIDI
# backend — Windows WinMM is the only backend so far (other platforms
# return `DeviceError::Unsupported`) — so the lane selects `--ignored`
# explicitly. With no backend or no input ports the tests record the
# condition and exit honestly — hardware traffic (events, nonzero
# counters) is observed, never asserted or fabricated. Hardware-
# dependent manual lane: never in CI; run records live under
# `evidence/issue-253-real-midi-lane/`. `--test-threads=1` serializes
# real port opens like `test-audio-real-input`.
[tasks.test-midi-real-device]
description = "Run the `#[ignore]`-gated real-device MIDI E2Es (`-p ruviform-midi-device -p ruviform-audio-plugin-bridge -- --ignored`) — Windows WinMM backend only; requires a MIDI input device and exits honestly without one (never fabricates measurements); manual lane, never CI"
run = "cargo test -p ruviform-midi-device -p ruviform-audio-plugin-bridge -- --ignored --test-threads=1"

# RF-SCRIPT-01 PoC（Issue #559）— poc/script-coexist は `[workspace]` を持つ
# 独立 workspace のため、ルートの `check`/`lint`/`test`（`-p <package>`）
# では対象にできない。poc/ui・poc/plugin-gui と同じ隔離 PoC 先例に従い、
# 専用タスクを poc ディレクトリで実行する。vendored Luau C++ の build を
# ルート workspace/CI の対象から隔離する意図的な分離。
[tasks.poc-script-coexist-check]
description = "Type-check the RF-SCRIPT-01 coexist PoC (poc/script-coexist, isolated workspace): cargo check --locked --all-targets"
run = "cd poc/script-coexist && cargo check --locked --all-targets"

[tasks.poc-script-coexist-lint]
description = "Lint the RF-SCRIPT-01 coexist PoC at `-D warnings`: cargo clippy --locked --all-targets -- -D warnings"
run = "cd poc/script-coexist && cargo clippy --locked --all-targets -- -D warnings"

[tasks.poc-script-coexist-test]
description = "Run the RF-SCRIPT-01 coexist PoC fixture suite (FX-P/FX-N): cargo test --locked --all-targets"
run = "cd poc/script-coexist && cargo test --locked --all-targets"

[tasks.poc-script-coexist-run]
description = "Run the RF-SCRIPT-01 coexist PoC demo binary (single-binary Luau+Rhai registry selection, alternating eval, same-digest proof, fail-closed demo)"
run = "cd poc/script-coexist && cargo run --locked --bin script-coexist-poc"

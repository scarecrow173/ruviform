env = { RUVIFORM_DRIVER_LAB_EVIDENCE = "evidence/issue-314-real-scenario/driver-lab-evidence.jsonl", RUVIFORM_REAL_OS_INPUT_VERDICT = "evidence/rf313-os-capability-matrix/verdict-real-os-input-windows.json" }
run = "cargo test -p ruviform-ui-gpui --features real-scenario --test real_window real_os_input"

# Issue #313 RF-GT-04 slice S2 windowed uitest lane (manual): spawns

[settings]
minimum_release_age = "7d"
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

# Shared infrastructure tools. Rust toolchain はここでは pin しない —
# 通常開発は環境導入済みの rust(rustup / global mise)を使い、CI 用の
# pin は mise.ci.toml(MISE_ENV=ci で有効化)に分離する。
[tools]
# Issue #85: GHSA-hq85-5cpj-mr62（eMudhra/emSign 中間 CA 侵害）の
# 修正版 0.13.4 以上を明示固定（0.12.x は同梱 CA バンドルに影響 CA が残る）。
uv = "0.13.5"
# eMudhra CA 修正版 0.5.7(GHSA-hq85-5cpj-mr62 対応)。
prek = "0.5.7"
git-lfs = "3.8.0"
"github:microsoft/apm" = "0.33.0"
"pipx:serena-agent" = { version = "1.7.0", lazy = true }
actionlint = "1.7.12"
# UI PoC（poc/ui/frontend）の npm workspaces ビルド用。Issue #83:
# 2026-10-21 Node.js セキュリティ更新を踏まえ修正版で固定
# （26.x 系は 26.12.1 以上が要件）。
node = "26.12.1"

[tasks.setup]
description = "Install APM dependencies, prek hooks and repository-local Git LFS"
run = [
  "apm install",
  "prek install",
  "git lfs install --local",
]

# Rust verification tasks: single entry point shared by local dev and CI.
# `fmt` rewrites source files in place; all other tasks are non-destructive
# and produce build artifacts only under target/.

[tasks.fmt]
description = "Format workspace sources with `cargo fmt --all` (rewrites source files in place)"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check workspace formatting with `cargo fmt --all -- --check` (non-destructive; shared with CI)"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Verify one Cargo package: mise run check <package> [cargo flags] (required package)"
raw_args = true
run = "cargo check --locked --all-targets -p"

[tasks.lint]
description = "Lint one Cargo package with warnings denied: mise run lint <package> [cargo flags]"
raw_args = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$#" -lt 1 ]; then
  echo "usage: mise run lint <package> [cargo flags]" >&2
  exit 2
fi
cargo clippy --locked --all-targets -p "$@" -- -D warnings
'''

[tasks.check-linux]
description = "Cross type-check + lint io-file/io-archive for x86_64-unknown-linux-gnu (auxiliary check of cfg(unix) code a non-Linux host never compiles; scoped to crates with unix backends since workspace-wide linux check needs a Linux C toolchain for zstd-sys/alloca build scripts; requires `rustup target add x86_64-unknown-linux-gnu`; writes only target/)"
run = "cargo check --target x86_64-unknown-linux-gnu -p ruviform-io-file -p ruviform-io-archive --all-targets && cargo clippy --target x86_64-unknown-linux-gnu -p ruviform-io-file -p ruviform-io-archive --all-targets -- -D warnings"

[tasks.test]
description = "Verify one Cargo package: mise run test <package> [cargo flags] (required package)"
raw_args = true
run = "cargo test --locked -p"

[tasks.check-ui-driver-boundary]
description = "Issue #390 driver boundary guard: `cargo metadata` dependency-graph + syn public-signature leak inspection against fixtures/driver-lab/boundary.json (exit 0 pass / 1 violation / 2 tool error; writes only target/)"
run = "cargo run -p ruviform-ui-test --bin gui-boundary-guard -- --offline"

[tasks.test-ui-driver-contract]
description = "Issue #390 DriverContractFixture: cases.json/stories.json manifest consistency (incl. cargo-test/mise-task mechanism existence) + executable UI-DVR-01/04/05/06/07/08 fake-layer fixtures (evidence via RUVIFORM_DRIVER_LAB_EVIDENCE; writes only target/)"
run = "cargo test -p ruviform-ui-test --test driver_contract"

[tasks.test-ui-parity]
description = "Issue #421/#434 Fake/GPUI parity fixture (fake side): shared driver-lab/parity/new-kinds.json for Knob/Toggle/Meter/TimeAxis/Spectrogram mount/reconcile (UI-DVR-02), gesture intents (UI-DVR-03) and payload retention. The GPUI side of the same fixture runs under test-ui-gpui (writes only target/)"
run = "cargo test -p ruviform-ui-test --test driver_parity"

[tasks.test-ui-native-slot]
description = "Issue #388 NativeSurfaceSlot contract fixtures: FakeNativeSlot port semantics (attach/hide/resize/clip/z/focus, attach-fault rollback, stale/forged leases, teardown) + DockWorkspace 2-phase move rollback link. Fake layer only — never a Dock PASS (writes only target/)"
run = "cargo test -p ruviform-ui-test --test native_slot_contract"

[tasks.test-ui-component-view]
description = "Issue #387 Component/View semantic fixtures: UI-DVR-02/03 + LAB-SV-FADER-DOCK/LAB-AL-WAVEFORM-SEEK fake layer + 2-theme equivalence (writes only target/)"
run = "cargo test -p ruviform-ui-test --test component_view"

[tasks.test-ui-golden]
description = "Issue #314 slice 1 Pixel Golden core: headless RGBA8 normalization, per-channel tolerance diff + masks, candidate→promote baseline store, verdict vocabulary and evidence (writes only target/ + temp dirs; capture paths are slice 3, NotRun/Unsupported by design)"
run = "cargo test -p ruviform-ui-test --test golden"

[tasks.codegen-theme]
description = "Issue #418: regenerate crates/ruviform-ui-theme/src/generated.rs from codegen/themes.json via theme-codegen (ThemeResolver::resolve → typed Rust literals; writes only src/generated.rs)"
run = "cargo run -p ruviform-ui-theme --bin theme-codegen -- --manifest crates/ruviform-ui-theme/codegen/themes.json --out crates/ruviform-ui-theme/src/generated.rs"

[tasks.codegen-theme-check]
description = "Issue #418: verify src/generated.rs freshness — byte-compare theme-codegen output against the committed file, non-destructive (exit 1 on drift/missing; writes nothing)"
run = "cargo run -p ruviform-ui-theme --bin theme-codegen -- --manifest crates/ruviform-ui-theme/codegen/themes.json --out crates/ruviform-ui-theme/src/generated.rs --check"

[tasks.test-ui-scenario-contract]
description = "Issue #464 consumer-neutral Scenario Contract: shared SemanticGuiTest/VisualGuiTest surface — Fake adapter contract tests (ruviform-ui-test/tests/scenario_contract.rs) + GPUI adapter contract tests (ruviform-ui-gpui/tests/scenario_contract.rs, gpui-test). Issue #314 slice 2: VisualCapture capability + golden check/report path, honestly Unsupported until slice 3 capture. Writes only target/"
depends = ["test-ui-scenario-contract-fake", "test-ui-scenario-contract-gpui"]

[tasks.test-ui-scenario-contract-fake]
description = "Issue #464 scenario contract + #314 slice 2 visual/golden path, Fake side: target resolution, stale epoch/generation errors, capability pre-flight (VisualCapture not claimed), golden_check Unsupported verdict, record_golden_step evidence, intent drain, receipt/projection via deliver_event (writes only target/)"
run = "cargo test -p ruviform-ui-test --test scenario_contract"
hide = true

[tasks.test-ui-scenario-contract-gpui]
description = "Issue #464 scenario contract + #314 slice 2 visual/golden path, GPUI side: same parity scenario through GpuiGuiTest/GpuiObserver (gpui-test); VisualCapture not claimed, golden_check Unsupported — GpuiObserver::drawn() is a draw plan, not pixels (writes only target/)"
run = "cargo test -p ruviform-ui-gpui --features gpui-test --test scenario_contract"
hide = true

[tasks.build]
description = "Verify one Cargo package: mise run build <package> [cargo flags] (required package)"
raw_args = true
run = "cargo build --locked -p"

# RT contract tests and benchmarks share the dev/bench profiles (no -ci
# variants yet). `test-rt` selects the `rt_*`-prefixed RT contract tests by name
# filter (added in Issues #18/#21, e.g. `rt_output_callback_path_allocates_nothing`);
# a zero-match run still exits successfully, so it stays meaningful as RT
# tests grow and degrades to a skip-equivalent pass if they are ever absent.
# `bench` is the full-measurement entry point; `bench-smoke` runs each
# benchmark once via criterion's `--test` mode and is what CI's bench job
# calls (full measurement stays a local, manual run).

[tasks.test-rt]
description = "Run RT contract tests with `cargo test --workspace rt_` name filter (dev/test profile; zero matches still exit successfully; writes only target/)"
run = "cargo test --workspace rt_"

[tasks.bench]
description = "Run workspace benchmarks with `cargo bench --workspace` (bench profile; full-measurement entry point; writes only target/ and target/criterion/)"
run = "cargo bench --workspace"

[tasks.bench-smoke]
description = "Smoke-test the ruviform-math, ruviform-rt and ruviform-viz benchmarks with `cargo bench -p ruviform-math -p ruviform-rt -p ruviform-viz -- --test` (bench profile; runs each bench once without measurement; the CI bench job calls this; writes only target/)"
run = "cargo bench -p ruviform-math -p ruviform-rt -p ruviform-viz -- --test"

# Workspace scope (-full) is independent of execution profile. MISE_ENV=ci
# selects the existing Cargo ci profile and disables incremental compilation;
# ordinary local *-full uses the dev/test profile. The CI workflow keeps its
# existing pinned Rust via mise.ci.toml.
[tasks.check-full]
description = "Workspace-wide check; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo check --workspace --all-targets{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.lint-full]
description = "Workspace-wide lint; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo clippy --workspace --all-targets{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %} -- -D warnings'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.test-full]
description = "Workspace-wide test; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo test --workspace{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.build-full]
description = "Workspace-wide build; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo build --workspace{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.verify-full]
description = "Workspace standard full verification: fmt-check, lint-full, test-full (profile selected by MISE_ENV)"
run = [
  "mise run fmt-check",
  "mise run lint-full",
  "mise run test-full",
]

# Issue #366 (Full CI Stage 1): contract tests for the ci/summary aggregated
# fail-closed verdict. The `ci-summary` CI job runs this before evaluating so
# a broken evaluator fails the job instead of publishing a wrong verdict.
[tasks.test-ci-summary]
description = "Run ci/summary verdict contract tests via `node --test ci/summary/` (needs result matrix, per-leg checkout-sha evidence, expected_sha dispatch contract, report JSON shape; requires node from the pinned toolchain)"
run = "node --test ci/summary/"

# Issue #368 (CI failure Issue Tracker): contract tests for the ci/tracker
# evaluator. The `track` job in ci-issue-tracker.yml runs this before any
# GitHub API call so a broken evaluator fails the job instead of creating/
# updating/closing the wrong issue. All tests use a mock client — offline.
[tasks.test-ci-tracker]
description = "Run ci/tracker contract tests via `node --test ci/tracker/` (valid-run filter and conclusion matrices, plan action matrix incl. run-id/attempt + updated_at ordering and compare close-guard, marker roundtrip, sanitize, API failure propagation; mock client only, no network; requires node from the pinned toolchain)"
run = "node --test ci/tracker/"

# Issue #367 (daily scheduler): contract tests for the ci/daily decision
# evaluator. The `daily-ci` job runs this before the real dispatch path so
# a broken evaluator fails the job instead of deciding wrongly.
[tasks.test-ci-daily]
description = "Run ci/daily scheduler decision contract tests via `node --test ci/daily/` (decision matrix, in-flight/unknown hold, bounded retry budget, dispatch confirm + landed-sha, report JSON shape, workflow trigger contract ci-yml-contract.test.mjs; requires node from the pinned toolchain)"
run = "node --test ci/daily/"

# Issue #294 (cross-consumer candidate-tuple gate): contract tests for the
# ci/consumer-verify evidence evaluator. The `preflight` job in
# consumer-verify.yml runs this before any lane executes so a broken
# evaluator fails the run instead of recording a wrong status.
[tasks.test-ci-consumer-verify]
description = "Run ci/consumer-verify contract tests via `node --test ci/consumer-verify/` (classify-ref matrix, lane/status derivation, tuple match/mismatch, evidence JSON+summary shape, secret non-leak, workflow yml structure contract; requires node from the pinned toolchain)"
run = "node --test ci/consumer-verify/"

[tasks.test-plugin-core]
description = "Run plugin-core contract tests"
run = "cargo test -p ruviform-plugin-core"
[tasks.lint-plugin-core]
description = "Lint plugin-core and its test targets"
run = "cargo clippy -p ruviform-plugin-core --all-targets -- -D warnings"

# Feature lanes: `cargo test --workspace` only covers default features, so
# feature-gated code paths get their own tasks and a separate CI job.
[tasks.test-video-proc-icc]
description = "Run video-proc tests with the icc feature enabled (moxcms ICC path)"
run = "cargo test -p ruviform-video-proc --features icc"
[tasks.lint-video-proc-icc]
description = "Lint video-proc and its test targets with the icc feature enabled"
run = "cargo clippy -p ruviform-video-proc --all-targets --features icc -- -D warnings"

# IO compression lane (Issues #300/#301): gzip/deflate/zstd are non-default features and
# `cargo test --workspace` covers default features only. The lane runs the
# full feature matrix because reduced feature sets gate different code —
# dead code under `default = []` or a single format only fails under
# `-D warnings` at that exact combination. `&&` chains keep the `-p` args
# inside the task body (established convention from the retired ci/impact
# lane-owner derivation; kept so the feature matrix stays grep-able).
[tasks.check-io-compression]
description = "Type-check io-compression across its feature matrix (default=[] plus each format and combined)"
run = "cargo check -p ruviform-io-compression --all-targets && cargo check -p ruviform-io-compression --all-targets --features gzip && cargo check -p ruviform-io-compression --all-targets --features deflate && cargo check -p ruviform-io-compression --all-targets --features zstd && cargo check -p ruviform-io-compression --all-targets --features gzip,deflate,zstd"
[tasks.lint-io-compression]
description = "Lint io-compression and its test targets across the full feature matrix"
run = "cargo clippy -p ruviform-io-compression --all-targets -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features gzip -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features deflate -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features zstd -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features gzip,deflate,zstd -- -D warnings"
[tasks.test-io-compression]
description = "Run io-compression tests across its feature matrix (unit/integration/doc tests per combination)"
run = "cargo test -p ruviform-io-compression && cargo test -p ruviform-io-compression --features gzip && cargo test -p ruviform-io-compression --features deflate && cargo test -p ruviform-io-compression --features zstd && cargo test -p ruviform-io-compression --features gzip,deflate,zstd"

# IO structured lane (Issue #299): json/yaml/toml/csv/xml are non-default
# features so `cargo test --workspace` covers none of the format modules.
# Same `&&`-chained single-string form as io-compression: dead code under
# `default = []` or a lone format only fails `-D warnings` at that exact
# combination. The matrix pins the spec-required combinations — default,
# `xml` alone, `xml` + `file`, and `--all-features` (every format + file).
# These tasks are the local/CI-shared entry points; wiring a dedicated CI
# job is tracked separately (io-structured has had no lane since #297).
[tasks.check-io-structured]
description = "Type-check io-structured across its format feature matrix (default, xml, xml+file, all features)"
run = "cargo check -p ruviform-io-structured --all-targets && cargo check -p ruviform-io-structured --all-targets --features xml && cargo check -p ruviform-io-structured --all-targets --features xml,file && cargo check -p ruviform-io-structured --all-targets --all-features"
[tasks.lint-io-structured]
description = "Lint io-structured and its test targets across the format feature matrix"
run = "cargo clippy -p ruviform-io-structured --all-targets -- -D warnings && cargo clippy -p ruviform-io-structured --all-targets --features xml -- -D warnings && cargo clippy -p ruviform-io-structured --all-targets --features xml,file -- -D warnings && cargo clippy -p ruviform-io-structured --all-targets --all-features -- -D warnings"
[tasks.test-io-structured]
description = "Run io-structured tests across the format feature matrix (unit/integration/doc tests per combination)"
run = "cargo test -p ruviform-io-structured && cargo test -p ruviform-io-structured --features xml && cargo test -p ruviform-io-structured --features xml,file && cargo test -p ruviform-io-structured --all-features"

# IO composition lane (Issue #306): the ruviform-io-e2e crate carries the
# cross-layer boundary tests (StagedFile lifecycle, Structured→StagedFile,
# TAR/ZIP→Gzip/Zstd→StagedFile, secure extraction, WavMuxer→seal→decode→
# publish). It is test-only — dev-dependencies pull the feature
# combinations the boundary needs (structured json,csv,file; compression
# gzip,zstd), so `-p` alone exercises the full composition surface.
[tasks.check-io-e2e]
description = "Type-check the io-e2e composition test crate and all its test targets"
run = "cargo check -p ruviform-io-e2e --all-targets"
[tasks.lint-io-e2e]
description = "Lint the io-e2e composition test crate and its test targets"
run = "cargo clippy -p ruviform-io-e2e --all-targets -- -D warnings"
[tasks.test-io-e2e]
description = "Run the io-e2e composition boundary tests (staged lifecycle, structured/compression/archive/wav layers)"
run = "cargo test -p ruviform-io-e2e"
# G08 opt-in lane (Issue #306): bounded, seed-fixed corpus replay —
# NOT part of the normal test-io-e2e lane (the test is #[ignore]d).
# Fixed seed/case/byte/time budgets live in
# crates/ruviform-io-e2e/tests/corpus_replay.rs; format exclusions
# (deflate, WAV, secure extraction, publish FS path, sustained fuzz)
# are documented there and in evidence/rf306/.
[tasks.test-io-e2e-corpus]
description = "Run the opt-in bounded corpus replay for io-e2e readers (fixed seed, 48 cases/format, byte+time budgets; Issue #306 G08)"
run = "cargo test -p ruviform-io-e2e --test corpus_replay -- --ignored --nocapture"

# Observability lane (Issue #281 G0): logging/tracing-export/
# allocation-probe/integration are non-default features and
# `cargo test --workspace`/`test-full` never compile most
# feature-gated targets (tests/logging.rs, tests/integration.rs,
# tests/rt_boundary.rs, examples/logging_host.rs, src/profiling/*).
# Same `&&`-chained single-string form as io-compression: dead code
# under a reduced feature set only fails `-D warnings` at that exact
# combination. The matrix pins default (= --no-default-features, since
# `default = []`), each feature alone, and --all-features (full
# unify). Stable toolchain — `test-observability-msrv` is the
# separate MSRV 1.89 lane.
[tasks.check-observability]
description = "Type-check ruviform-observability across its feature matrix (default plus each optional feature and all features; Issue #281 G0)"
run = "cargo check -p ruviform-observability --all-targets && cargo check -p ruviform-observability --all-targets --features logging && cargo check -p ruviform-observability --all-targets --features tracing-export && cargo check -p ruviform-observability --all-targets --features allocation-probe && cargo check -p ruviform-observability --all-targets --features integration && cargo check -p ruviform-observability --all-targets --all-features"
[tasks.lint-observability]
description = "Lint ruviform-observability and its test targets across the feature matrix"
run = "cargo clippy -p ruviform-observability --all-targets -- -D warnings && cargo clippy -p ruviform-observability --all-targets --features logging -- -D warnings && cargo clippy -p ruviform-observability --all-targets --features tracing-export -- -D warnings && cargo clippy -p ruviform-observability --all-targets --features allocation-probe -- -D warnings && cargo clippy -p ruviform-observability --all-targets --features integration -- -D warnings && cargo clippy -p ruviform-observability --all-targets --all-features -- -D warnings"
[tasks.test-observability]
description = "Run ruviform-observability tests across the feature matrix (unit/integration/doc tests per combination)"
run = "cargo test -p ruviform-observability && cargo test -p ruviform-observability --features logging && cargo test -p ruviform-observability --features tracing-export && cargo test -p ruviform-observability --features allocation-probe && cargo test -p ruviform-observability --features integration && cargo test -p ruviform-observability --all-features"

# IO file/archive lane (Issue #409): the rooted-read capability and the
# shared vfs backend (unix/windows/unsupported) live in io-file; io-archive
# is the direct consumer that must not regress. Dedicated lane so rooted
# capability + extraction changes iterate without a workspace-wide run;
# the unix backend is additionally cross-checked by `check-linux`.
[tasks.check-io-file]
description = "Type-check io-file and io-archive across all targets"
run = "cargo check -p ruviform-io-file -p ruviform-io-archive --all-targets"
[tasks.lint-io-file]
description = "Lint io-file and io-archive across all targets"
run = "cargo clippy -p ruviform-io-file -p ruviform-io-archive --all-targets -- -D warnings"
[tasks.test-io-file]
description = "Run io-file and io-archive tests (rooted capability, vfs, secure extraction)"
run = "cargo test -p ruviform-io-file -p ruviform-io-archive"

# UI webview lane (Issue #156): the adapter's implementation lives behind
# the non-default `webview` feature so `cargo check --workspace` stays
# headless; these tasks are the feature-enabled verification entry points.
# On Linux they require `libwebkit2gtk-4.1-dev` + `libgtk-3-dev` system
# packages (the `ui-verify` CI job installs them).
[tasks.check-ui-webview]
description = "Type-check the UI webview adapter and its examples with the webview feature enabled"
run = "cargo check -p ruviform-ui-webview --features webview --all-targets"
[tasks.lint-ui-webview]
description = "Lint the UI webview adapter and its test/example targets with the webview feature enabled"
run = "cargo clippy -p ruviform-ui-webview --all-targets --features webview -- -D warnings"
[tasks.test-ui-webview]
description = "Run webview-feature tests for the UI adapter (rvf:// scheme/data surface; windowed paths are manual verification)"
run = "cargo test -p ruviform-ui-webview --features webview"

# UI GPUI lane (Issue #386): the standard Driver adapter's
# implementation lives behind the non-default `gpui` feature so
# `cargo check --workspace` stays headless; these tasks are the
# feature-enabled verification entry points. The crate compiles the
# real GPUI 0.2.2 backend (GPU/font/OS-window stacks) — build times
# are heavy, and actual window-on-screen behavior is manual
# verification on a real OS session (RF388/RF389 own real-OS
# evidence), not a CI headless pass.
[tasks.check-ui-gpui]
description = "Type-check the UI GPUI adapter and its targets with the gpui feature enabled"
run = "cargo check -p ruviform-ui-gpui --features gpui --all-targets"
[tasks.lint-ui-gpui]
description = "Lint the UI GPUI adapter and its test/example targets with the gpui feature enabled"
run = "cargo clippy -p ruviform-ui-gpui --all-targets --features gpui -- -D warnings"
[tasks.test-ui-gpui]
description = "Run gpui-feature tests for the UI GPUI adapter (real OS window behavior is manual verification). `gpui-test` adds gpui test-support so the Issue #387 headless render tests run on the real element path (TestAppContext window + simulated input). Issue #598: `uitest` is enabled alongside so the `windowed_test_app` AUT bin (required-features=[\"uitest\"]) is built+linked on every GPUI CI lane — OS-L1 native build/link evidence; the `windowed_uitest` test target stays a no-op without RVF_WINDOWED_UITEST=1."
run = "cargo test -p ruviform-ui-gpui --features \"gpui-test uitest\""
[tasks.test-ui-consumer-observation]
description = "Issue #429/#436/#442 consumer observation seam: external-crate test (ruviform-ui-gpui/tests/consumer_observation.rs) that mounts the shared parity fixtures and observes GPUI projection, intents, and drawing plans (Meter bars, TimeAxis marks, Waveform bins, Spectrogram cells, Label text, Table grid) through the public GpuiObserver seam (gpui-test; no gpui type on the seam), plus bound-near payloads at the contract ceilings, viewport culling, mid-gesture projections, f64 precision, and update_view reprojection (gpui-test; no gpui type on the seam). Writes only target/"
run = "cargo test -p ruviform-ui-gpui --features gpui-test --test consumer_observation"
# Canonical manual-verification entry for the minimal native Window
# fixture: opens a real OS window on the local session — run it on a
# real OS only, never as a headless/CI pass. RF388/RF389 real-OS
# evidence is recorded through this entry point.

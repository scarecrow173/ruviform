# Issue #631 GPUI Test Lab / Scenario Console lane (manual/opt-in —
# NOT a CI-required gate): launches `plugin-dock-lab` (feature
# `lab-gui`) — a real GPUI window that dogfoods the merged catalog
# (`HEADLESS_MATRIX` + `real_catalog`) through the shared
# ruviform-ui ViewSpec vocabulary. Inside an interactive session the
# operator selects catalog rows and runs headless cells via
# `run_selected`; real-window rows are listed but never executed
# here — they stay delegated to `test-ui-plugin-dock-real`. Each
# completed run appends a `lane=plugin-dock-lab` JSONL block to
# evidence/rf631/plugin-dock-lab.jsonl. On a headless/non-interactive
# host the session fails closed before `WindowLifecycle::Ready`:
# every catalog row records NotRun + observed.environment_blocked
# and the exit code stays 0 — never a fabricated pass (writes only
# target/ + evidence/rf631/).
[tasks.test-ui-plugin-dock-lab]
description = "Issue #631 GPUI Test Lab / Scenario Console lane (manual/opt-in — NOT a CI-required gate, interactive session required): plugin-dock-lab (lab-gui) real GPUI window over the merged HEADLESS_MATRIX + real_catalog projection — headless cells run via run_selected, real rows delegate to test-ui-plugin-dock-real; JSONL appends to evidence/rf631/plugin-dock-lab.jsonl; headless/non-interactive hosts record all rows NotRun + environment_blocked, exit 0 (writes only target/ + evidence/rf631/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --locked -p ruviform-plugin-test-vst3
mkdir -p evidence/rf631
cargo run --locked -p ruviform-plugin-dock-test --features lab-gui --bin plugin-dock-lab -- --out evidence/rf631/plugin-dock-lab.jsonl
'''

# Issue #805 verify-ruviform control CLI lane (manual/opt-in — NOT a
# CI-required gate): the canonical entry for `rvf-ctl`, the unified
# agent-facing control CLI over rvf.uitest.v1. This slice runs
# `doctor` — builds the headless `dummy_app` AUT + `rvf-ctl`, spawns
# the AUT over the stdio transport, runs the
# test.hello/test.capabilities handshake + graceful test.shutdown +
# child-exit check, and writes the structured JSON report to
# evidence/rf805/rvf-ctl-doctor.json. Exit 0 = every check passed;
# 1 = spawn/handshake/capabilities/shutdown/exit failure (report
# records `verdict` + failing stage + `error.next_step`) or
# AUT-missing `not_run` + environment_blocked; 2 = CLI misuse.
# `--dry-run`/`--help` are exercised directly (writes only target/ +
# evidence/rf805/).
[tasks.test-ui-rvf-ctl]
description = "Issue #805 verify-ruviform control CLI lane (manual/opt-in — NOT a CI-required gate): canonical rvf-ctl entry — `doctor` spawns headless dummy_app over rvf.uitest.v1 stdio, runs test.hello + test.capabilities + graceful test.shutdown + child-exit check, JSON report to evidence/rf805/rvf-ctl-doctor.json; exit 0 pass / 1 fail-or-not_run / 2 misuse (writes only target/ + evidence/rf805/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --locked -p ruviform-ui-test --bin dummy_app --bin rvf-ctl
mkdir -p evidence/rf805
cargo run --locked -p ruviform-ui-test --bin rvf-ctl -- doctor --out evidence/rf805/rvf-ctl-doctor.json
'''

# Issue #805 slice 2 rvf-ctl drive lane (manual/opt-in — NOT a
# CI-required gate): the canonical entry for `rvf-ctl drive`, the
# composable drive surface over the rvf.uitest.v1 closed op set. One
# invocation = one session: spawn headless dummy_app → test.hello →
# the ordered step list (observation + fixture/clock/fault/window
# ops, incl. a capability-gated screenshot that must record
# `unsupported` honestly) → graceful test.shutdown → child-exit.
# JSON report to evidence/rf805/rvf-ctl-drive.json. Exit 0 = every
# check and step passed (unsupported/not_run-capability answers are
# honest outcomes); 1 = a fail or a step left not_run, or AUT-missing
# not_run + environment_blocked; 2 = CLI misuse (writes only
# target/ + evidence/rf805/).
[tasks.test-ui-rvf-ctl-drive]
description = "Issue #805 slice 2 rvf-ctl drive lane (manual/opt-in — NOT a CI-required gate): canonical `rvf-ctl drive` entry — one session runs the ordered closed-op step list against headless dummy_app (observe/fixture/clock/fault/window + capability-gated screenshot → honest `unsupported`); JSON report to evidence/rf805/rvf-ctl-drive.json; exit 0 pass / 1 fail-or-not_run / 2 misuse (writes only target/ + evidence/rf805/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --locked -p ruviform-ui-test --bin dummy_app --bin rvf-ctl
mkdir -p evidence/rf805
cargo run --locked -p ruviform-ui-test --bin rvf-ctl -- drive --out evidence/rf805/rvf-ctl-drive.json \
  'capabilities' \
  'observe.windows' \
  'fixture.prepare={"name":"windows","seed":7,"params":{"count":1,"close_policy":"veto"}}' \
  'observe.windows' \
  'clock.advance={"domain":"host_tick","ticks":2}' \
  'observe.receipts={"since":0,"limit":64}' \
  'fault.set={"kind":"ipc_disconnect","window":1}' \
  'observe.windows' \
  'fault.clear={"kind":"ipc_disconnect","window":1}' \
  'notices' \
  'window.request_close={"window":"last"}' \
  'observe.windows' \
  'observe.screenshot={"window":"last"}'
'''

# test-formal is the Issue #806 D-layer property-test lane
# (manual/opt-in — NOT a CI-required gate): it runs the proptest
# suites for the wire codec targets — rvf.ipc.v1
# parse_intent/valid_op/Event::to_json
# (crates/ruviform-ui/tests/formal_ipc.rs) and rvf.uitest.v1
# read_frame/write_frame framing
# (crates/ruviform-ui-test/tests/formal_transport.rs) — plus the
# archive-parser slice-2 suite covering TAR/ZIP reader
# ArchiveReadLimits gates, ArchiveErrorKind classification and
# receipt invariants
# (crates/ruviform-io-archive/tests/formal_archive.rs) — plus the
# structured-document slice-3 suite covering JSON/YAML/TOML/CSV/XML
# readers, the shared InputLimits/BoundedRead byte budget, stable
# DocumentErrorKind sets and per-format named limits
# (crates/ruviform-io-structured/tests/formal_structured.rs — the
# crate's `default = []` feature set requires --all-features) — plus
# the WAV-backend slice-4 suite covering RIFF/WAVE serialization,
# canonical f32→wire conversion, and the muxer finalize/WavReceipt
# contract (crates/ruviform-io-wav/tests/formal_wav.rs). It is
# a plain `cargo test` lane and runs natively on every host — the
# 1-command re-run entry for AC#1.
[tasks.test-formal]
description = "Issue #806 D-layer formal lane (manual/opt-in — NOT a CI-required gate): run the wire-codec + archive-parser + structured-document + WAV-backend proptest suites — `cargo test --locked -p ruviform-ui --test formal_ipc` + `cargo test --locked -p ruviform-ui-test --test formal_transport` + `cargo test --locked -p ruviform-io-archive --test formal_archive` + `cargo test --locked -p ruviform-io-structured --all-features --test formal_structured` + `cargo test --locked -p ruviform-io-wav --test formal_wav` (rvf.ipc.v1 parse_intent/valid_op/Event::to_json + rvf.uitest.v1 read_frame/write_frame + TAR/ZIP reader limits/error/receipt contracts + JSON/YAML/TOML/CSV/XML reader limits/error-kind contracts + RIFF/WAVE header serialization, canonical f32→wire conversion and muxer finalize/WavReceipt contracts; runs natively; writes only target/)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo test --locked -p ruviform-ui --test formal_ipc
cargo test --locked -p ruviform-ui-test --test formal_transport
cargo test --locked -p ruviform-io-archive --test formal_archive
cargo test --locked -p ruviform-io-structured --all-features --test formal_structured
cargo test --locked -p ruviform-io-wav --test formal_wav
'''

# test-formal-kani is the Issue #806 D-layer bounded-proof lane
# (manual/opt-in — NOT a CI-required gate): it runs the
# `#[cfg(kani)]` proof harnesses co-located with the proptest
# suites. Kani needs a Linux CBMC toolchain, so the lane
# env-detects: a native `cargo kani` first, then a WSL2 distro
# (Kani cannot run on native Windows). With no selector it keeps the
# legacy aggregate behavior. Selective Property-group entries are
# `w-ipc-op` for the valid_op byte-core proofs, `arc-idx-limit` for the
# ZIP index decision-core proof, `arc-payload-limit` for the TAR
# declared-size decision-core proof, `sd-csv-limits` for the structured CSV
# limit decision-core proofs, and `sd-byte-budget` for the structured
# BoundedRead proof. Unknown selectors are usage errors and exit before
# environment detection. In
# WSL the repository is
# reached via /mnt/<drive> but the target dir is forced onto the
# WSL native filesystem (/mnt builds are too slow; the Windows-side
# cargo output dir is untouched). Slice 3 (structured documents) is
# a separate `cargo kani` invocation with `--all-features`: the
# crate's `default = []` feature set means the JSON/YAML/TOML/CSV/XML
# proofs only compile with features on — including the in-src
# `BoundedRead` proof in `src/input.rs`. Structured limit decisions
# are proven against pure in-src decision cores, so the invocation no
# longer disables unwinding assertions. Slice 4 (PCM WAV) is a third,
# separate invocation —
# `-p ruviform-io-wav` covers the `open_muxer` harness in
# tests/formal_wav.rs plus the in-src `write_sample`/`Wire`/`fmt`
# proofs in src/convert.rs and src/wav.rs. Unlike the other
# invocations it runs `-j1`: the WAV proofs unroll `Wire::new` /
# header serialization repeatedly, and each harness's CBMC process
# peaks at ~1.5-2 GiB — 4-way concurrency pushed the reference WSL2
# service past its crash point (`Wsl/Service/E_UNEXPECTED`).
# Sequential keeps every harness under that ceiling; the lane is
# manual/opt-in so latency is acceptable. The verdict aggregates all
# invocations: pass only when every harness verifies; fail if any
# fails. No usable environment reports verdict `not_run` + reason +
# provision guidance and exits 0 — a missing environment is not a
# lane failure. Exit 1 is reserved for a real verification failure
# (fail-closed). Provision runbook:
# docs/specs/formal-verification.md.
[tasks.test-formal-kani]
description = "Issue #806/#1015 Kani bounded-proof lane (manual/opt-in — NOT a CI-required gate): no selector keeps the aggregate invocations; `w-ipc-op`, `arc-idx-limit`, `arc-payload-limit`, `sd-csv-limits`, and `sd-byte-budget` run only their selective proofs; unknown selectors exit 2 before Kani. env-detect (native cargo kani → WSL2 distro); WSL target dir on the native FS, never /mnt; verdict aggregates invocations; honest `not_run` + reason + provision guidance and exit 0 when no environment exists; exit 1 only on a real verification failure"
raw_args = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

usage() {
  echo "usage: mise run test-formal-kani [w-ipc-op|arc-idx-limit|arc-payload-limit|sd-csv-limits|sd-byte-budget]" >&2
}

if [ "$#" -gt 1 ]; then
  usage
  exit 2
fi
SELECTOR="${1:-}"
case "$SELECTOR" in
  ""|w-ipc-op|arc-idx-limit|arc-payload-limit|sd-csv-limits|sd-byte-budget) ;;
  *)
    usage
    exit 2
    ;;
esac

verdict() {
  printf '{"lane":"test-formal-kani","verdict":"%s","reason":"%s"}\n' "$1" "$2"
}

# 1) native cargo kani (Linux/macOS hosts, or a Windows host that
#    already runs kani natively)
if cargo kani --version >/dev/null 2>&1; then
  rc=0
  if [ "$SELECTOR" = "w-ipc-op" ]; then
    cargo kani -j1 --output-format terse -p ruviform-ui --harness w_ipc_op || rc=1
  elif [ "$SELECTOR" = "arc-idx-limit" ]; then
    cargo kani -j1 --output-format terse -p ruviform-io-archive --harness arc_idx_limit || rc=1
  elif [ "$SELECTOR" = "arc-payload-limit" ]; then
    cargo kani -j1 --output-format terse -p ruviform-io-archive --harness arc_payload_limit || rc=1
  elif [ "$SELECTOR" = "sd-csv-limits" ]; then
    cargo kani -j1 --output-format terse --all-features -p ruviform-io-structured --harness csv_limit_decision || rc=1
  elif [ "$SELECTOR" = "sd-byte-budget" ]; then
    cargo kani -j1 --output-format terse --all-features -p ruviform-io-structured --harness bounded_read_budget_gate || rc=1
  else
    cargo kani --tests -j4 --output-format terse -p ruviform-ui -p ruviform-ui-test -p ruviform-io-archive || rc=1
    cargo kani --tests -j4 --output-format terse --all-features -p ruviform-io-structured || rc=1
    cargo kani --tests -j1 --output-format terse -p ruviform-io-wav || rc=1
  fi
  if [ "$rc" -eq 0 ]; then
    verdict pass "native cargo kani verification succeeded"
    exit 0
  else
    verdict fail "native cargo kani verification failed"
    exit 1
  fi
fi

# 2) WSL2: find a distro that has cargo + cargo kani
if command -v wsl.exe >/dev/null 2>&1; then
  DISTRO=""
  DISTROS="$(WSL_UTF8=1 wsl.exe -l -q 2>/dev/null | tr -d '\0\r')"
  while IFS= read -r d; do
    [ -z "$d" ] && continue
    if wsl.exe -d "$d" -- bash -lc 'command -v cargo >/dev/null 2>&1 && cargo kani --version >/dev/null 2>&1'; then
      DISTRO="$d"
      break
    fi
  done <<< "$DISTROS"
  if [ -n "$DISTRO" ]; then
    WIN_PWD="$(pwd -W 2>/dev/null || pwd)"
    REPO_WSL="$(wsl.exe -d "$DISTRO" -- wslpath -a "$WIN_PWD" | tr -d '\r')"
    if [ -z "$REPO_WSL" ]; then
      verdict not_run "environment_blocked: WSL distro $DISTRO cannot map repo path $WIN_PWD (run the lane from a /mnt/<drive>-visible path)"
      exit 0
    fi
    rc=0
    if [ "$SELECTOR" = "w-ipc-op" ]; then
      wsl.exe -d "$DISTRO" -- bash -lc "cd '$REPO_WSL' && CARGO_TARGET_DIR=\"\$HOME/.cache/ruviform-kani/target\" cargo kani -j1 --output-format terse -p ruviform-ui --harness w_ipc_op" || rc=1
    elif [ "$SELECTOR" = "arc-idx-limit" ]; then
      wsl.exe -d "$DISTRO" -- bash -lc "cd '$REPO_WSL' && CARGO_TARGET_DIR=\"\$HOME/.cache/ruviform-kani/target\" cargo kani -j1 --output-format terse -p ruviform-io-archive --harness arc_idx_limit" || rc=1
    elif [ "$SELECTOR" = "arc-payload-limit" ]; then
      wsl.exe -d "$DISTRO" -- bash -lc "cd '$REPO_WSL' && CARGO_TARGET_DIR=\"\$HOME/.cache/ruviform-kani/target\" cargo kani -j1 --output-format terse -p ruviform-io-archive --harness arc_payload_limit" || rc=1
    elif [ "$SELECTOR" = "sd-csv-limits" ]; then
      wsl.exe -d "$DISTRO" -- bash -lc "cd '$REPO_WSL' && CARGO_TARGET_DIR=\"\$HOME/.cache/ruviform-kani/target\" cargo kani -j1 --output-format terse --all-features -p ruviform-io-structured --harness csv_limit_decision" || rc=1
    elif [ "$SELECTOR" = "sd-byte-budget" ]; then
      wsl.exe -d "$DISTRO" -- bash -lc "cd '$REPO_WSL' && CARGO_TARGET_DIR=\"\$HOME/.cache/ruviform-kani/target\" cargo kani -j1 --output-format terse --all-features -p ruviform-io-structured --harness bounded_read_budget_gate" || rc=1
    else
      wsl.exe -d "$DISTRO" -- bash -lc "cd '$REPO_WSL' && CARGO_TARGET_DIR=\"\$HOME/.cache/ruviform-kani/target\" cargo kani --tests -j4 --output-format terse -p ruviform-ui -p ruviform-ui-test -p ruviform-io-archive" || rc=1
      wsl.exe -d "$DISTRO" -- bash -lc "cd '$REPO_WSL' && CARGO_TARGET_DIR=\"\$HOME/.cache/ruviform-kani/target\" cargo kani --tests -j4 --output-format terse --all-features -p ruviform-io-structured" || rc=1
      wsl.exe -d "$DISTRO" -- bash -lc "cd '$REPO_WSL' && CARGO_TARGET_DIR=\"\$HOME/.cache/ruviform-kani/target\" cargo kani --tests -j1 --output-format terse -p ruviform-io-wav" || rc=1
    fi
    if [ "$rc" -eq 0 ]; then
      verdict pass "WSL2 ($DISTRO) cargo kani verification succeeded"
      exit 0
    else
      verdict fail "WSL2 ($DISTRO) cargo kani verification failed"
      exit 1
    fi
  fi
  verdict not_run "environment_blocked: wsl.exe present but no WSL2 distro has cargo kani — provision per docs/specs/formal-verification.md (rustup + cargo install --locked kani-verifier + cargo kani setup)"
  exit 0
fi

verdict not_run "environment_blocked: no native cargo kani and no wsl.exe — provision Kani per docs/specs/formal-verification.md"
exit 0
'''

[tasks.build]
description = "Verify one Cargo package: mise run build <package> [cargo flags] (required package)"
raw_args = true
run = "cargo build --locked -p"

# RT contract tests and benchmarks share the dev/bench profiles (no -ci
# variants yet). `test-rt` selects the `rt_*`-prefixed RT contract tests by name
# filter (added in Issues #18/#21, e.g. `rt_output_callback_path_allocates_nothing`);
# a zero-match run still exits successfully, so it stays meaningful as RT
# tests grow and degrades to a skip-equivalent pass if they are ever absent.
# `bench` is the full-measurement entry point; `bench-smoke` runs each
# benchmark once via criterion's `--test` mode and is what CI's bench job
# calls (full measurement stays a local, manual run).

[tasks.test-rt]
description = "Run RT contract tests with `cargo test --workspace rt_` name filter (dev/test profile; zero matches still exit successfully; writes only target/)"
run = "cargo test --workspace rt_"

[tasks.bench]
description = "Run workspace benchmarks with `cargo bench --workspace` (bench profile; full-measurement entry point; writes only target/ and target/criterion/)"
run = "cargo bench --workspace"

[tasks.bench-smoke]
description = "Smoke-test the ruviform-math, ruviform-rt, ruviform-viz, ruviform-numeric and ruviform-io-e2e benchmarks with `cargo bench -p ruviform-math -p ruviform-rt -p ruviform-viz -p ruviform-numeric -p ruviform-io-e2e -- --test` (bench profile; runs each bench once without measurement; the CI bench job calls this; writes only target/)"
run = "cargo bench -p ruviform-math -p ruviform-rt -p ruviform-viz -p ruviform-numeric -p ruviform-io-e2e -- --test"

# bench-frozen is a manual/opt-in lane (Issue #807): it is not part of the CI
# bench job, which keeps calling bench-smoke only. Modes: no arg = gated real
# run against the pinned baseline; --selftest = inject degraded dispatch to
# prove the gate fails; --write-baseline <path> = emit an un-promoted
# candidate for manual review/promotion. Keep evidence (run JSONL, gate
# verdict, decision.tsv) under evidence/<issue>/.
[tasks.bench-frozen]
description = "Run the frozen ruviform-math dsp SIMD A/B benchmark with `cargo bench -p ruviform-math --bench dsp_frozen -- <args>` (bench profile; in-process force_fallback vs detect ratio gate vs pinned baseline benches/frozen/dsp_baseline.json, fail-closed; manual/opt-in lane — not in the CI bench job; pass `--selftest` to prove gate failure, `--write-baseline <path>` to emit a baseline candidate; writes only target/)"
raw_args = true
run = "cargo bench --locked -p ruviform-math --bench dsp_frozen --"

# bench-frozen-e2e is a manual/opt-in lane (Issue #807 slice 2): the same
# contract family as bench-frozen applied to the deterministic E2E
# pipeline legs of ruviform-audio-test — output/session (scripted output
# -> production Session::open -> plan.drive callback -> captured PCM) and
# input/typed-rt (scripted input -> InputCapture -> RtRuntime
# input_writer -> process -> output_reader). The gate checks each leg's
# normalized wall (median rep ns / in-process ref-yardstick median) plus
# the observed-output digest fingerprint against pinned thresholds in
# benches/frozen/pipeline_baseline.json, fail-closed. Modes: no arg =
# gated real run; --selftest = inject wall-floor + Xrun degradations to
# prove the gate fails; --write-baseline <path> = emit an un-promoted
# candidate for manual review/promotion. Keep evidence (run JSONL, gate
# verdict, decision.tsv) under evidence/<issue>/.
[tasks.bench-frozen-e2e]
description = "Run the frozen ruviform-audio-test E2E pipeline benchmark with `cargo bench -p ruviform-audio-test --bench pipeline_frozen -- <args>` (bench profile; normalized-wall + frozen-digest gate vs pinned baseline benches/frozen/pipeline_baseline.json, fail-closed; manual/opt-in lane — not in the CI bench job; pass `--selftest` to prove gate failure, `--write-baseline <path>` to emit a baseline candidate; writes only target/)"
raw_args = true
run = "cargo bench --locked -p ruviform-audio-test --bench pipeline_frozen --"

# Workspace scope (-full) is independent of execution profile. MISE_ENV=ci
# selects the existing Cargo ci profile and disables incremental compilation;
# ordinary local *-full uses the dev/test profile. The CI workflow keeps its
# existing pinned Rust via mise.ci.toml.
[tasks.check-full]
description = "Workspace-wide check; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo check --workspace --all-targets{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.lint-full]
description = "Workspace-wide lint; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo clippy --workspace --all-targets{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %} -- -D warnings'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.test-full]
description = "Workspace-wide test; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo test --workspace{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.build-full]
description = "Workspace-wide build; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo build --workspace{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.verify-full]
description = "Workspace standard full verification: fmt-check, lint-full, test-full (profile selected by MISE_ENV)"
run = [
  "mise run fmt-check",
  "mise run lint-full",
  "mise run test-full",
]

# Issue #366 (Full CI Stage 1): contract tests for the ci/summary aggregated
# fail-closed verdict. The `ci-summary` CI job runs this before evaluating so
# a broken evaluator fails the job instead of publishing a wrong verdict.
[tasks.test-ci-summary]
description = "Run ci/summary verdict contract tests via `node --test ci/summary/` (needs result matrix, per-leg checkout-sha evidence, expected_sha dispatch contract, report JSON shape; requires node from the pinned toolchain)"
run = "node --test ci/summary/"

# Issue #368 (CI failure Issue Tracker): contract tests for the ci/tracker
# evaluator. The `track` job in ci-issue-tracker.yml runs this before any
# GitHub API call so a broken evaluator fails the job instead of creating/
# updating/closing the wrong issue. All tests use a mock client — offline.
[tasks.test-ci-tracker]
description = "Run ci/tracker contract tests via `node --test ci/tracker/` (valid-run filter and conclusion matrices, plan action matrix incl. run-id/attempt + updated_at ordering and compare close-guard, marker roundtrip, sanitize, API failure propagation; mock client only, no network; requires node from the pinned toolchain)"
run = "node --test ci/tracker/"

# Issue #367 (daily scheduler): contract tests for the ci/daily decision
# evaluator. The `daily-ci` job runs this before the real dispatch path so
# a broken evaluator fails the job instead of deciding wrongly.
[tasks.test-ci-daily]
description = "Run ci/daily scheduler decision contract tests via `node --test ci/daily/` (decision matrix, in-flight/unknown hold, bounded retry budget, dispatch confirm + landed-sha, report JSON shape, workflow trigger contract ci-yml-contract.test.mjs; requires node from the pinned toolchain)"
run = "node --test ci/daily/"

# Issue #294 (cross-consumer candidate-tuple gate): contract tests for the
# ci/consumer-verify evidence evaluator. The `preflight` job in
# consumer-verify.yml runs this before any lane executes so a broken
# evaluator fails the run instead of recording a wrong status.
[tasks.test-ci-consumer-verify]
description = "Run ci/consumer-verify contract tests via `node --test ci/consumer-verify/` (classify-ref matrix, lane/status derivation, tuple match/mismatch, evidence JSON+summary shape, secret non-leak, workflow yml structure contract; requires node from the pinned toolchain)"
run = "node --test ci/consumer-verify/"

[tasks.test-plugin-core]
description = "Run plugin-core contract tests"
run = "cargo test -p ruviform-plugin-core"
[tasks.lint-plugin-core]
description = "Lint plugin-core and its test targets"
run = "cargo clippy -p ruviform-plugin-core --all-targets -- -D warnings"

# Issue #630: opt-in external ABI validator lane (clap-validator + VST3 SDK
# validator against the test-plugin fixtures). NOT a CI-required gate —
# external tools must be supplied via --clap-validator/--vst3-validator or
# RUVIFORM_ABI_VALIDATOR_DIR; missing tools yield honest NotRun verdicts.
[tasks.test-plugin-abi-validator]
description = "Run external ABI validators (clap-validator + VST3 SDK validator) against the test-plugin suite — opt-in, NOT a CI-required gate (Issue #630; evidence/rf630/)"
run = "node ci/plugin-abi-validator/run.mjs"

# Feature lanes: `cargo test --workspace` only covers default features, so
# feature-gated code paths get their own tasks and a separate CI job.
[tasks.test-video-proc-icc]
description = "Run video-proc tests with the icc feature enabled (moxcms ICC path)"
run = "cargo test -p ruviform-video-proc --features icc"
[tasks.lint-video-proc-icc]
description = "Lint video-proc and its test targets with the icc feature enabled"
run = "cargo clippy -p ruviform-video-proc --all-targets --features icc -- -D warnings"

# IO compression lane (Issues #300/#301): gzip/deflate/zstd are non-default features and
# `cargo test --workspace` covers default features only. The lane runs the
# full feature matrix because reduced feature sets gate different code —
# dead code under `default = []` or a single format only fails under
# `-D warnings` at that exact combination. `&&` chains keep the `-p` args
# inside the task body (established convention from the retired ci/impact
# lane-owner derivation; kept so the feature matrix stays grep-able).
[tasks.check-io-compression]
description = "Type-check io-compression across its feature matrix (default=[] plus each format and combined)"
run = "cargo check -p ruviform-io-compression --all-targets && cargo check -p ruviform-io-compression --all-targets --features gzip && cargo check -p ruviform-io-compression --all-targets --features deflate && cargo check -p ruviform-io-compression --all-targets --features zstd && cargo check -p ruviform-io-compression --all-targets --features gzip,deflate,zstd"
[tasks.lint-io-compression]
description = "Lint io-compression and its test targets across the full feature matrix"
run = "cargo clippy -p ruviform-io-compression --all-targets -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features gzip -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features deflate -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features zstd -- -D warnings && cargo clippy -p ruviform-io-compression --all-targets --features gzip,deflate,zstd -- -D warnings"
[tasks.test-io-compression]
description = "Run io-compression tests across its feature matrix (unit/integration/doc tests per combination)"
run = "cargo test -p ruviform-io-compression && cargo test -p ruviform-io-compression --features gzip && cargo test -p ruviform-io-compression --features deflate && cargo test -p ruviform-io-compression --features zstd && cargo test -p ruviform-io-compression --features gzip,deflate,zstd"

# IO structured lane (Issue #299): json/yaml/toml/csv/xml are non-default
# features so `cargo test --workspace` covers none of the format modules.
# Same `&&`-chained single-string form as io-compression: dead code under
# `default = []` or a lone format only fails `-D warnings` at that exact
# combination. The matrix pins the spec-required combinations — default,
# `xml` alone, `xml` + `file`, and `--all-features` (every format + file).
# These tasks are the local/CI-shared entry points; wiring a dedicated CI
# job is tracked separately (io-structured has had no lane since #297).
[tasks.check-io-structured]
description = "Type-check io-structured across its format feature matrix (default, xml, xml+file, all features)"
run = "cargo check -p ruviform-io-structured --all-targets && cargo check -p ruviform-io-structured --all-targets --features xml && cargo check -p ruviform-io-structured --all-targets --features xml,file && cargo check -p ruviform-io-structured --all-targets --all-features"
[tasks.lint-io-structured]
description = "Lint io-structured and its test targets across the format feature matrix"
run = "cargo clippy -p ruviform-io-structured --all-targets -- -D warnings && cargo clippy -p ruviform-io-structured --all-targets --features xml -- -D warnings && cargo clippy -p ruviform-io-structured --all-targets --features xml,file -- -D warnings && cargo clippy -p ruviform-io-structured --all-targets --all-features -- -D warnings"
[tasks.test-io-structured]
description = "Run io-structured tests across the format feature matrix (unit/integration/doc tests per combination)"
run = "cargo test -p ruviform-io-structured && cargo test -p ruviform-io-structured --features xml && cargo test -p ruviform-io-structured --features xml,file && cargo test -p ruviform-io-structured --all-features"

# IO composition lane (Issue #306): the ruviform-io-e2e crate carries the
# cross-layer boundary tests (StagedFile lifecycle, Structured→StagedFile,
# TAR/ZIP→Gzip/Zstd→StagedFile, secure extraction, WavMuxer→seal→decode→
# publish). It is test-only — dev-dependencies pull the feature
# combinations the boundary needs (structured json,csv,file; compression
# gzip,zstd), so `-p` alone exercises the full composition surface.
[tasks.check-io-e2e]
description = "Type-check the io-e2e composition test crate and all its test targets"
run = "cargo check -p ruviform-io-e2e --all-targets"
[tasks.lint-io-e2e]
description = "Lint the io-e2e composition test crate and its test targets"
run = "cargo clippy -p ruviform-io-e2e --all-targets -- -D warnings"
[tasks.test-io-e2e]
description = "Run the io-e2e composition boundary tests (staged lifecycle, structured/compression/archive/wav layers)"
run = "cargo test -p ruviform-io-e2e"
# G08 opt-in lane (Issue #306): bounded, seed-fixed corpus replay —
# NOT part of the normal test-io-e2e lane (the test is #[ignore]d).
# Fixed seed/case/byte/time budgets live in
# crates/ruviform-io-e2e/tests/corpus_replay.rs; format exclusions
# (deflate, WAV, secure extraction, publish FS path, sustained fuzz)
# are documented there and in evidence/rf306/.
[tasks.test-io-e2e-corpus]
description = "Run the opt-in bounded corpus replay for io-e2e readers (fixed seed, 48 cases/format, byte+time budgets; Issue #306 G08)"
run = "cargo test -p ruviform-io-e2e --test corpus_replay -- --ignored --nocapture"

# Observability lane (Issue #281 G0): logging/tracing-export/
# allocation-probe/integration are non-default features and
# `cargo test --workspace`/`test-full` never compile most
# feature-gated targets (tests/logging.rs, tests/integration.rs,
# tests/rt_boundary.rs, examples/logging_host.rs, src/profiling/*).
# Same `&&`-chained single-string form as io-compression: dead code
# under a reduced feature set only fails `-D warnings` at that exact
# combination. The matrix pins default (= --no-default-features, since
# `default = []`), each feature alone, and --all-features (full
# unify). Stable toolchain — `test-observability-msrv` is the
# separate MSRV 1.89 lane.
[tasks.check-observability]
description = "Type-check ruviform-observability across its feature matrix (default plus each optional feature and all features; Issue #281 G0)"
run = "cargo check -p ruviform-observability --all-targets && cargo check -p ruviform-observability --all-targets --features logging && cargo check -p ruviform-observability --all-targets --features tracing-export && cargo check -p ruviform-observability --all-targets --features allocation-probe && cargo check -p ruviform-observability --all-targets --features integration && cargo check -p ruviform-observability --all-targets --all-features"
[tasks.lint-observability]
description = "Lint ruviform-observability and its test targets across the feature matrix"
run = "cargo clippy -p ruviform-observability --all-targets -- -D warnings && cargo clippy -p ruviform-observability --all-targets --features logging -- -D warnings && cargo clippy -p ruviform-observability --all-targets --features tracing-export -- -D warnings && cargo clippy -p ruviform-observability --all-targets --features allocation-probe -- -D warnings && cargo clippy -p ruviform-observability --all-targets --features integration -- -D warnings && cargo clippy -p ruviform-observability --all-targets --all-features -- -D warnings"
[tasks.test-observability]
description = "Run ruviform-observability tests across the feature matrix (unit/integration/doc tests per combination)"
run = "cargo test -p ruviform-observability && cargo test -p ruviform-observability --features logging && cargo test -p ruviform-observability --features tracing-export && cargo test -p ruviform-observability --features allocation-probe && cargo test -p ruviform-observability --features integration && cargo test -p ruviform-observability --all-features"


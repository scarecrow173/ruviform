# os_endpoint_midi_e2e.rs` drives the production WinMM backend →
# bidirectional name-match loopback-style pair → `InputTx::pump` →
# `InputStage` → `attach` → `PluginNode` → typed `GraphRuntime` →
# out-of-process real-ABI VST3 `test_instrument` chain end-to-end,
# so it needs a provisioned virtual MIDI loopback pair (loopMIDI /
# Windows MIDI Services loopback) AND both fixture artifacts — the
# crate's own cdylib (`crate-type = ["cdylib", "rlib"]`) plus the
# `ruviform-plugin-test-vst3-l1-runner` runner binary
# (`required-features = ["l1-runner"]`). Like `test-l1-real-plugin`
# the lane builds those artifacts first: their absence is an
# `assert!` failure (Fail), not a `NotRun` (test-spec R2). This
# task is the only canonical entry point for the test — `#![cfg(
# feature = "l1-runner")]` + `#[ignore]` + `required-features`
# keep it out of default `cargo test`, and no other lane collects
# it (`test-midi-virtual-endpoint` selects `--test loopback` in a
# different crate; `test-l1-real-plugin` selects only its own named
# `--test` targets). With no pair provisioned the verifier prints
# `verdict: NotRun — NOT_PROVISIONED` and exits honestly
# (fail-closed, never a Pass — the name match is a loopback
# candidate, not a `virtual-os-endpoint` claim). Provisioning-
# dependent manual lane: never in CI; run records live under
# `evidence/rf253/`. The canonical `run` carries no `--nocapture`
# — verdict lines sit inside libtest capture, so verdict harvest
# uses the auxiliary direct cargo invocation recorded in the
# evidence. `--test-threads=1` serializes real port opens like the
# other virtual-endpoint lanes. Lint coverage needs no dedicated
# lane: `lint-l1-real-plugin` (`cargo clippy --all-targets
# --features …/l1-runner`) already lints this test target.
[tasks.test-os-endpoint-midi-e2e]
description = "Build the test-fixture cdylib + `l1-runner` runner bin, then run the `#[ignore]`-gated OS-endpoint MIDI e2e verifier (`-p ruviform-plugin-test-vst3 --features l1-runner --test os_endpoint_midi_e2e -- --ignored`) — requires a provisioned virtual MIDI loopback pair (loopMIDI / Windows MIDI Services loopback); unprovisioned hosts report verdict: NotRun (never fabricates a Pass); manual lane, never CI"
run = [
  "cargo build -p ruviform-plugin-test-vst3 --features l1-runner",
  "cargo test -p ruviform-plugin-test-vst3 --features l1-runner --test os_endpoint_midi_e2e -- --ignored --test-threads=1",
]

# RF-SCRIPT-01 PoC（Issue #559）— poc/script-coexist は `[workspace]` を持つ
# 独立 workspace のため、ルートの `check`/`lint`/`test`（`-p <package>`）
# では対象にできない。poc/ui・poc/plugin-gui と同じ隔離 PoC 先例に従い、
# 専用タスクを poc ディレクトリで実行する。vendored Luau C++ の build を
# ルート workspace/CI の対象から隔離する意図的な分離。
[tasks.poc-script-coexist-check]
description = "Type-check the RF-SCRIPT-01 coexist PoC (poc/script-coexist, isolated workspace): cargo check --locked --all-targets"
run = "cd poc/script-coexist && cargo check --locked --all-targets"

[tasks.poc-script-coexist-lint]
description = "Lint the RF-SCRIPT-01 coexist PoC at `-D warnings`: cargo clippy --locked --all-targets -- -D warnings"
run = "cd poc/script-coexist && cargo clippy --locked --all-targets -- -D warnings"

[tasks.poc-script-coexist-test]
description = "Run the RF-SCRIPT-01 coexist PoC fixture suite (FX-P/FX-N): cargo test --locked --all-targets"
run = "cd poc/script-coexist && cargo test --locked --all-targets"

[tasks.poc-script-coexist-run]
description = "Run the RF-SCRIPT-01 coexist PoC demo binary (single-binary Luau+Rhai registry selection, alternating eval, same-digest proof, fail-closed demo)"
run = "cd poc/script-coexist && cargo run --locked --bin script-coexist-poc"

# Issue #953: Linux 検証 docker イメージ経由の lane 実行。
# manual/opt-in lane であり CI required gate ではない。ローカル開発環境が
# Windows/macOS でも Linux ネイティブの toolchain・build/link/test を
# push 前に実走確認できる。使い方と既存 CI との役割分担は
# evidence/rf953/ を参照。イメージ定義: docker/linux-verify/。
[tasks.verify-docker-build]
description = "Build the ruviform Linux verification docker image (Issue #953; manual/opt-in — not a CI-required gate; tag: ruviform-linux-verify, context: docker/linux-verify)"
run = "docker build -f docker/linux-verify/Dockerfile -t ruviform-linux-verify docker/linux-verify"

[tasks.verify-docker]
description = "Run a mise verification lane inside the Linux docker image: mise run verify-docker <task> [args] (Issue #953; manual/opt-in — not a CI-required gate; worktree is synced read-only into a named volume so target/ and .git stay container-local; e.g. `mise run verify-docker fmt-check`, `mise run verify-docker test ruviform-io-file`)"
depends = ["verify-docker-build"]
raw_args = true
# 実体は docker/linux-verify/verify-docker.sh（mise が Windows で複数行
# script を一時ファイル化する際の改行コード差異を回避し、単体実行も可能にする）
run = "bash docker/linux-verify/verify-docker.sh"

    name: ui-verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: "0"
      # checkout-sha artifact leg name (Issue #366 sha evidence)
      CHECKOUT_LEG: ui-verify-${{ matrix.os }}

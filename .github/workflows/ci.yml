name: ci

# Automatically verify pull requests against main and changes merged to main.
# Keep manual dispatch for targeted diagnosis and reruns.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# CI only needs the pinned Rust toolchain and prek. Do not activate
# optional developer tools such as pipx:serena-agent during mise exec/run.
env:
  MISE_ENABLE_TOOLS: rust,prek

permissions:
  contents: read

# Same-PR runs supersede each other: a new pull_request run resolves to a
# per-PR group (refs/pull/<N>/merge) and cancels the in-progress/pending
# run for that PR. Other triggers (push to main, workflow_dispatch)
# resolve to a unique run_id group, so they are never cancelled — and
# different PRs or workflows never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep sibling OS jobs running so a manual verification run reports
      # the result for every platform even if one of them fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Measure disk usage (before build)
        if: matrix.os == 'ubuntu-latest'
        run: df -h

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-required tools from mise.lock
        run: |
          mise trust
          mise install --locked rust prek

      # cpal's ALSA backend links via alsa-sys, whose build script
      # requires the ALSA development headers (pkg-config).
      - name: Install ALSA development headers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Restore cargo registry/git index cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check config files with prek
        run: mise exec -- prek run --all-files

      - name: Check formatting (mise run fmt-check)
        run: mise run fmt-check

      - name: Type-check workspace (mise run check-ci)
        run: mise run check-ci

      - name: Lint workspace (mise run lint-ci)
        run: mise run lint-ci

      - name: Test workspace (mise run test-ci)
        run: mise run test-ci

      - name: Measure disk usage (after build)
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h
          du -sh target
          du -sh target/ci/deps target/ci/build 2>/dev/null || true

  rt-verify:
    name: rt-verify
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-required tools from mise.lock
        run: |
          mise trust
          mise install --locked rust prek

      # cpal's ALSA backend links via alsa-sys, whose build script
      # requires the ALSA development headers (pkg-config).
      - name: Install ALSA development headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Restore cargo registry/git index cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The `rt_` filter matches substrings and succeeds even with zero tests.
      # Reject empty strict-prefix selections before running the existing RT suite.
      - name: Require non-empty RT contract test selection
        shell: bash
        run: |
          test_list="$(mise exec -- cargo test --workspace --locked rt_ -- --list)"
          strict_count="$(printf '%s\n' "$test_list" | grep -Ec '(^|::)rt_[^[:space:]]+: test$' || true)"
          echo "Strict rt_ contract tests: $strict_count"
          test "$strict_count" -gt 0

      - name: Run RT contract tests (mise run test-rt)
        run: mise run test-rt

  icc-verify:
    name: icc-verify
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-required tools from mise.lock
        run: |
          mise trust
          mise install --locked rust prek

      - name: Restore cargo registry/git index cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `cargo test --workspace` covers default features only — the
      # feature-gated ICC path (`ruviform-video-proc --features icc`)
      # gets its own lane so it cannot silently regress.
      - name: Test video-proc icc feature (mise run test-video-proc-icc)
        run: mise run test-video-proc-icc

      - name: Lint video-proc icc feature (mise run lint-video-proc-icc)
        run: mise run lint-video-proc-icc

  # UI webview lane (Issue #156): the adapter's `webview` feature is
  # non-default so the main workspace lanes stay headless; this job
  # type-checks, lints and tests the feature-enabled surface
  # (rvf:// scheme/data handlers are headless-testable — actual
  # windowed runs are manual verification, like audio-device examples).
  ui-verify:
    name: ui-verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: "0"
      # Issue #332 (CI-OPT-05): pin the Playwright browser directory inside the
      # workspace so `actions/cache` can use one relative path on all three
      # OSes (defaults differ per OS). Install and test steps resolve the
      # same directory; local runs keep the OS-default path.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-required tools from mise.lock
        run: |
          mise trust
          mise install --locked rust prek
          mise install node@26.12.1

      - name: Install WebKitGTK development headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Restore cargo registry/git index cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-ui-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ui-

      # Issue #330: install every ui/* package-lock once per job. The
      # check/test/build tasks below `depends` on the same freshness-checked
      # install-ui-* tasks, so their npm ci is skipped while the lockfiles
      # are unchanged — each package is installed exactly once here.
      - name: Install UI npm dependencies (mise run setup-ui)
        run: mise run setup-ui

      - name: Type-check UI webview feature (mise run check-ui-webview)
        run: mise run check-ui-webview

      - name: Lint UI webview feature (mise run lint-ui-webview)
        run: mise run lint-ui-webview

      - name: Test UI webview feature (mise run test-ui-webview)
        run: mise run test-ui-webview

      - name: Type-check headless UI contract (mise run check-ui-headless)
        run: mise run check-ui-headless

      - name: Test headless UI contract (mise run test-ui-headless)
        run: mise run test-ui-headless

      - name: Type-check UI components (mise run check-ui-components)
        run: mise run check-ui-components

      - name: Test UI components (mise run test-ui-components)
        run: mise run test-ui-components

      - name: Build UI components dist (mise run build-ui-components)
        run: mise run build-ui-components

      - name: Type-check UI viz renderers (mise run check-ui-viz)
        run: mise run check-ui-viz

      - name: Test UI viz renderers (mise run test-ui-viz)
        run: mise run test-ui-viz

      - name: Build UI viz dist (mise run build-ui-viz)
        run: mise run build-ui-viz

      - name: Type-check UI binding (mise run check-ui-binding)
        run: mise run check-ui-binding

      - name: Test UI binding (mise run test-ui-binding)
        run: mise run test-ui-binding

      - name: Build UI binding dist (mise run build-ui-binding)
        run: mise run build-ui-binding

      - name: Type-check UI guitest (mise run check-ui-guitest)
        run: mise run check-ui-guitest

      - name: Test UI guitest (mise run test-ui-guitest)
        run: mise run test-ui-guitest

      - name: Type-check UI showcase (mise run check-ui-showcase)
        run: mise run check-ui-showcase

      - name: Test UI showcase (mise run test-ui-showcase)
        run: mise run test-ui-showcase

      - name: Build UI showcase dist (mise run build-ui-showcase)
        run: mise run build-ui-showcase

      - name: Type-check UI browser-test harness (mise run check-ui-browser-test)
        run: mise run check-ui-browser-test

      # Chromium system libraries for the Playwright-managed browser; needed
      # once on Linux only. Requires the ui/browser-test node_modules that
      # the check step above (via install-ui-browser-test) already installed.
      # Issue #332: OS system libraries are a separate layer from the browser
      # binary cache below — they always run, cached browser or not.
      - name: Install Playwright browser system deps (Linux)
        if: runner.os == 'Linux'
        run: npm --prefix ui/browser-test exec -- playwright install-deps chromium

      # Browser binary cache (Issue #332): the key is pinned to the Playwright
      # version and the Chromium revision the lockfile resolves to — a bump
      # changes the key and falls back to a plain install. No restore-keys:
      # restoring a stale-version cache only carries unused revisions.
      - name: Read Playwright browser version/revision
        id: pw-meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(mise exec -- node -p "require('./ui/browser-test/node_modules/@playwright/test/package.json').version")"
          revision="$(mise exec -- node -p "require('./ui/browser-test/node_modules/playwright-core/browsers.json').browsers.find(b=>b.name==='chromium').revision")"
          test -n "$version" && test -n "$revision"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium cache
        uses: actions/cache@v6.1.0
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-pw${{ steps.pw-meta.outputs.version }}-chromium${{ steps.pw-meta.outputs.revision }}

      # `playwright install` is revision-idempotent: a cache hit makes this a
      # ~1-3s presence check, a miss downloads the pinned revision. This step
      # is the browser-download measurement point (kept out of the test step).
      - name: Prepare Playwright Chromium (mise run install-ui-browser-chromium)
        run: mise run install-ui-browser-chromium

      # A restored directory whose binaries are corrupt can still satisfy
      # playwright's presence check, so validate with a real headless launch
      # (the same headless-shell path the test suite uses). On failure, wipe
      # the directory and reinstall — never proceed to tests on an
      # unvalidated browser. Linux needs the system deps installed above.
      - name: Validate Playwright Chromium launch
        shell: bash
        run: |
          set -u
          probe="${RUNNER_TEMP:-$(mktemp -d)}/chromium-launch-probe.png"
          if ! npm --prefix ui/browser-test exec -- playwright screenshot --browser chromium about:blank "$probe"; then
            echo "::warning::cached Chromium failed launch validation; wiping ${PLAYWRIGHT_BROWSERS_PATH} and reinstalling"
            rm -rf "${PLAYWRIGHT_BROWSERS_PATH:?must be a non-empty workspace path}"
            mise run install-ui-browser-chromium
            npm --prefix ui/browser-test exec -- playwright screenshot --browser chromium about:blank "$probe"
          fi

      - name: Run UI browser tests (mise run test-ui-browser)
        run: mise run test-ui-browser

      # Browser-lane evidence only (Issue #294 gate input): evidence.json
      # records env/revision/seed and pass/fail/skipped per spec; failure
      # traces and screenshots land here too. Never an OS WebView / native
      # GPU / product E2E signal.
      - name: Upload UI browser evidence (browser lane)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-evidence-${{ matrix.os }}
          path: ui/browser-test/test-results/
          if-no-files-found: warn
          retention-days: 30

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-required tools from mise.lock
        run: |
          mise trust
          mise install --locked rust prek

      # cpal's ALSA backend links via alsa-sys, whose build script
      # requires the ALSA development headers (pkg-config).
      - name: Install ALSA development headers (Linux)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Restore cargo registry/git index cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Smoke only: `--test` runs each benchmark once without measurement.
      # Full measurement (mise run bench) stays a local manual run.
      - name: Smoke-test benchmarks (mise run bench-smoke)
        run: mise run bench-smoke

  l1-real-verify:
    name: l1-real-verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep sibling OS jobs running so a manual verification run reports
      # the result for every platform even if one of them fails — the
      # dlopen/spawn/COM paths this lane exercises are platform-shaped.
      # First exercise on macOS: the raw-.dylib (non-bundle) CLAP
      # resolution and the VST3 bundleEntry paths run here for the
      # first time — a red macOS leg is a platform finding, not a
      # regression.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-required tools from mise.lock
        run: |
          mise trust
          mise install --locked rust prek

      - name: Restore cargo registry/git index cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The real-plugin L1 lane (Issue #114) is the only execution entry
      # for the `#[ignore]`-gated adapter E2E: it builds the fixture
      # cdylibs + `host`-feature runner bins, runs the in-process bridge
      # + runner-bin unit tests, then the out-of-process E2E. No ALSA
      # step — the adapter dependency tree contains no cpal.
      - name: Run real-plugin L1 lane (mise run test-l1-real-plugin)
        run: mise run test-l1-real-plugin

      - name: Lint host feature (mise run lint-l1-real-plugin)
        run: mise run lint-l1-real-plugin

          restore-keys: ${{ runner.os }}-cargo-

      # `cargo test --workspace` covers default features only — the
      # feature-gated ICC path (`ruviform-video-proc --features icc`)
      # gets its own lane so it cannot silently regress.
      - name: Test video-proc icc feature (mise run test-video-proc-icc)
        run: mise run test-video-proc-icc

      - name: Lint video-proc icc feature (mise run lint-video-proc-icc)
        run: mise run lint-video-proc-icc

  # IO compression lane (Issues #300/#301): gzip/deflate/zstd are non-default
  # features so `cargo test --workspace` never compiles their code paths; this
  # job runs the full feature matrix (default + each format + combined)
  # because dead code under a reduced feature set only fails `-D warnings` at
  # that exact combination. The zstd backend compiles vendored C via `cc`
  # (gcc present on ubuntu-latest).
  compression-verify:
    name: compression-verify
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      # checkout-sha artifact leg name (Issue #366 sha evidence)
      CHECKOUT_LEG: compression-verify

  rt-verify:
    name: rt-verify
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      # checkout-sha artifact leg name (Issue #366 sha evidence)
      CHECKOUT_LEG: rt-verify

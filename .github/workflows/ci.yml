      # Issue #366 sha evidence: measure what this leg actually checked out
      # and ship it to ci-summary — the leg name comes from the job-level
      # CHECKOUT_LEG env (matrix lanes expand matrix.os there, where the
      # context is valid), keeping these two steps identical across lanes.
      - name: Record actual checkout SHA
        shell: bash
        env:
          CHECKOUT_SHA_FILE: checkout-sha-${{ env.CHECKOUT_LEG }}-attempt-${{ github.run_attempt }}.txt
        run: git rev-parse HEAD > "$CHECKOUT_SHA_FILE"

      - name: Upload checkout SHA evidence
        # Artifact names are unique per workflow run under
        # upload-artifact v4, so the run attempt is part of the name:
        # re-running all or failed jobs uploads a fresh artifact instead
        # of failing with a name conflict or overwriting the earlier
        # attempt's evidence. ci-summary selects the latest attempt per
        # leg (matching `needs.<job>.result` latest-attempt semantics).
        uses: actions/upload-artifact@v4
        with:
          name: checkout-sha-${{ env.CHECKOUT_LEG }}-attempt-${{ github.run_attempt }}
          path: checkout-sha-${{ env.CHECKOUT_LEG }}-attempt-${{ github.run_attempt }}.txt
          if-no-files-found: error
          retention-days: 30

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-required tools from mise.lock
        run: |
          mise trust
          mise install --locked rust prek
          mise install node@26.12.1

      - name: Install WebKitGTK development headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Restore cargo registry/git index cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-ui-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ui-

      # Issue #329 (CI-OPT-02): same sccache setup as `verify` — the webview
      # feature lane compiles a different feature set, which sccache keeps
      # distinct by construction (compiler hash + full args + preprocessed
      # source). Kill switch: repo variable CI_SCCACHE_DISABLE=1.
      - name: Set up sccache
        if: vars.CI_SCCACHE_DISABLE != '1'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.19.0"

      - name: Export sccache GHA backend env

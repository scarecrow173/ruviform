          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check io-compression feature matrix (mise run check-io-compression)
        run: mise run check-io-compression

      - name: Test io-compression feature matrix (mise run test-io-compression)

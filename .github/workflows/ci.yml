name: ci

# Full CI: every run executes the complete lane set unconditionally — the
# retired impact classifier / selective `if:` machinery (Issue #333/#346)
# is gone per Issue #366 Stage 1. Entry is workflow_dispatch ONLY (Issue
# #365 rule 1 / #326 Stage 4): the daily scheduler decides whether current
# main needs verification and dispatches with expected_sha, and humans
# dispatch for diagnosis/repair. PR creation/updates and main pushes
# deliberately start nothing — required checks were retired first (the
# `main-checkstatus` ruleset is disabled, so no merge deadlock).
on:
  workflow_dispatch:
    inputs:
      # Issue #366/#367 dispatch contract: the daily scheduler passes the
      # main HEAD it intends to verify. `ci-summary` fails when the run
      # actually checked out a different revision — a different SHA is never
      # recorded as the expected one. Empty disables the check (manual
      # dispatch without the input).
      expected_sha:
        description: "Expected main HEAD SHA this run verifies (daily-ci dispatch contract; empty = no check)"
        required: false
        type: string

# CI only needs the pinned Rust toolchain and prek. Do not activate
# optional developer tools such as pipx:serena-agent during mise exec/run.
env:
  MISE_ENABLE_TOOLS: rust,prek

permissions:
  contents: read

# Every run gets a unique group and is never cancelled (ADR-328's
# non-PR invariant — its event-conditional expression always resolved to
# this same shape for non-PR triggers, and pull_request events no longer
# exist after the dispatch-only migration).
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Issue #366 (Full CI Stage 1): every lane job runs unconditionally — no
  # classifier, no `needs: [impact]`, no lane `if:`. The fail-closed half
  # lives in the terminal `ci-summary` job, where any lane that did not end
  # in `success` (failure / cancelled / skipped / not-run / unknown) fails
  # the whole run.
  #
  # Issue #333/#326 rev 2026-11-05, kept in Stage 1: macOS legs were split
  # into physically separate `*-macos` jobs so macOS starvation could not
  # queue-cancel what were then the nine required Linux/Windows contexts
  # (the `main-checkstatus` ruleset is disabled since Issue #326 Stage 4 —
  # the split is retained: `ci-summary` consumes each per-OS result from
  # `needs` directly). Folding them into the matrices is a deferred
  # Stage-2 simplification (docs/designs/issue-366-full-ci-stage1.md).
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep sibling OS jobs running so a manual verification run reports
      # the result for every platform even if one of them fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: "0"
      # checkout-sha artifact leg name (Issue #366 sha evidence)
      CHECKOUT_LEG: verify-${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Issue #366 sha evidence: pin every lane to the trigger snapshot —
          # lane jobs start at different times and could otherwise float to a
          # newer ref head between their checkouts.
          ref: ${{ github.sha }}

      # Issue #366 sha evidence: measure what this leg actually checked out
      # and ship it to ci-summary — the leg name comes from the job-level
      # CHECKOUT_LEG env (matrix lanes expand matrix.os there, where the
      # context is valid), keeping these two steps identical across lanes.
      - name: Record actual checkout SHA
        shell: bash
        env:
          CHECKOUT_SHA_FILE: checkout-sha-${{ env.CHECKOUT_LEG }}-attempt-${{ github.run_attempt }}.txt
        run: git rev-parse HEAD > "$CHECKOUT_SHA_FILE"

      - name: Upload checkout SHA evidence
        # Artifact names are unique per workflow run under
        # upload-artifact v4, so the run attempt is part of the name:
        # re-running all or failed jobs uploads a fresh artifact instead
        # of failing with a name conflict or overwriting the earlier
        # attempt's evidence. ci-summary selects the latest attempt per
        # leg (matching `needs.<job>.result` latest-attempt semantics).
        uses: actions/upload-artifact@v4
        with:
          name: checkout-sha-${{ env.CHECKOUT_LEG }}-attempt-${{ github.run_attempt }}
          path: checkout-sha-${{ env.CHECKOUT_LEG }}-attempt-${{ github.run_attempt }}.txt
          if-no-files-found: error
          retention-days: 30

      - name: Measure disk usage (before build)
        if: matrix.os == 'ubuntu-latest'
        run: df -h

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-required tools from mise.lock
        run: |
          mise trust
          mise install --locked rust prek

      # cpal's ALSA backend links via alsa-sys, whose build script
      # requires the ALSA development headers (pkg-config).
      - name: Install ALSA development headers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Restore cargo registry/git index cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Issue #329 (CI-OPT-02): sccache content-addressed compile cache on the
      # GitHub Actions cache backend. The cache service credentials
      # (ACTIONS_RESULTS_URL/ACTIONS_RUNTIME_TOKEN) reach JS actions only, not
      # `run` steps — the github-script step re-exports them plus
      # RUSTC_WRAPPER/SCCACHE_* via GITHUB_ENV. Kill switch: repo variable
      # CI_SCCACHE_DISABLE=1 skips every sccache step so cargo runs plain rustc.
      - name: Set up sccache
        if: vars.CI_SCCACHE_DISABLE != '1'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.19.0"

      - name: Export sccache GHA backend env
        if: vars.CI_SCCACHE_DISABLE != '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const url = process.env.ACTIONS_RESULTS_URL || '';
            const gha = token !== '' && url !== '';
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);
            core.exportVariable('ACTIONS_RESULTS_URL', url);
            core.exportVariable('SCCACHE_GHA_ENABLED', gha ? 'true' : 'false');
            core.exportVariable('SCCACHE_GHA_VERSION', `ruviform-v1-${process.env.RUNNER_OS || 'unknown'}`);
            core.exportVariable('RUSTC_WRAPPER', 'sccache');
            core.info(`sccache GHA backend: ${gha ? 'enabled' : 'disabled (cache credentials absent)'}`);

      - name: Verify sccache environment
        if: vars.CI_SCCACHE_DISABLE != '1'
        shell: bash
        run: |
          set -euo pipefail
          command -v sccache
          sccache --version
          echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
          echo "SCCACHE_GHA_ENABLED=$SCCACHE_GHA_ENABLED"
          echo "SCCACHE_GHA_VERSION=$SCCACHE_GHA_VERSION"
          if [ -n "${ACTIONS_RESULTS_URL:-}" ]; then echo "ACTIONS_RESULTS_URL: set"; else echo "::warning::ACTIONS_RESULTS_URL missing — sccache GHA backend disabled (local disk fallback)"; fi
          if [ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]; then echo "ACTIONS_RUNTIME_TOKEN: set"; else echo "::warning::ACTIONS_RUNTIME_TOKEN missing — sccache GHA backend disabled (local disk fallback)"; fi

      - name: Check config files with prek
        run: mise exec -- prek run --all-files

      - name: Check formatting (mise run fmt-check)
        run: mise run fmt-check

      # Issue #331 (CI-OPT-04): `cargo clippy` compiles workspace members with
      # clippy-driver in check mode and emits every rustc diagnostic plus
      # clippy lints, so a separate `cargo check` step only re-evaluated the
      # same unit set a second time. This step owns type-checking and warning
      # detection for the whole workspace (--all-targets).
      - name: Type-check & lint workspace (mise run lint-ci)
        run: mise run lint-ci

      - name: Test workspace (mise run test-ci)
        run: mise run test-ci

      - name: sccache statistics
        if: vars.CI_SCCACHE_DISABLE != '1'
        shell: bash
        run: sccache --show-stats || true

      - name: Measure disk usage (after build)
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h
          du -sh target
          du -sh target/ci/deps target/ci/build 2>/dev/null || true

  # macOS leg of `verify` (Issue #333/#326 rev 2026-11-05,
  # kept in #366 Stage 1): identical lane steps, physically separate job —
  # `ci-summary` consumes its per-OS result from `needs` directly.
  verify-macos:
    name: verify-macos
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
      # checkout-sha artifact leg name (Issue #366 sha evidence)

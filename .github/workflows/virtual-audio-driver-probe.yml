name: virtual-audio-driver-probe

# Issue #977 Slice B stage 1 — virtual audio endpoint driver の手動 install
# 実測 probe。Issue #978 Slice C で DMus MIDI miniport の midi-loopback
# stage を、Issue #979 Slice E で midi-endpoint-probe stage を追加済み。
#
# 目的: repo 内ソースのみの SysVAD 派生 driver package
# （drivers/rvf-virtual-audio/）を provisioning primitive
# （tools/virtual-audio-driver/Provision-RvfVirtualAudioEndpoint.ps1）で
# build → test-sign → driver store staging → root-enumerated MEDIA devnode
# 結合 → endpoint readiness 確認し、MMDevice endpoint 列挙 →
# endpoint_probe pair 候補検出 → midi_endpoint_probe
# loopback 候補検出 → virtual_endpoint streaming round-trip →
# tests/loopback.rs MIDI round-trip → os_endpoint wiring →
# os-endpoint-midi-e2e → fault-cases → cleanup まで stage 分解で
# 実測し、どの stage まで成立するかを判定材料として記録する。判定は
# evidence の解釈に委ね、workflow 自体は測定の完走のみを成功条件とする。
#
# leg 構成:
#   windows-2025    x64 Server 2025 — 唯一 leg。kernel-load の test-signing
#                   が成立するのは x64 のみ（ARM64 は VBS CI で kernel
#                   load が必ず失敗 — rf961 attempt-9 実測）。
#
# 契約:
#   - workflow_dispatch 専用。required gate・ci-summary の needs・ruleset
#     とは一切接続しない独立 manual lane。
#   - absence-is-data: stage の失敗・測定対象の不在は判定材料であり job
#     失敗ではない。各 stage は観測結果を vaudio-probe-<os>.json の
#     {stage,status,detail,exit_code} レコードと stage-*-<os>.txt の生ログ
#     に記録して完走する。job が赤くなるのは probe 機構自体の破損
#     （script エラー・checkout 失敗・artifact upload 失敗）のみ。
#   - 失敗時も evidence を採取する — cleanup と artifact upload は
#     if: always() で実行し、途中 stage が停止してもそこまでの
#     JSON+ログ+package が leg ごと artifact に残る。
#   - bcdedit の testsigning flag 設定・OS 再起動は一切行わない
#     （testsigning=Yes・SecureBoot OFF は runner 出荷状態として確定済み。
#     job 内 reboot は runner session を kill して job 失敗＝evidence 破損
#     — evidence/rf952/web-sources-signing-runner-wms.md §2.3）。
#   - driver package は repo 内ソースのみ。prebuilt .sys/.cat/.cer の
#     commit・外部 binary download は行わない。
#   - devnode 作成は devcon 非依存（setupapi/newdev P/Invoke —
#     tools/testsigned-driver/TestDevice.ps1 を primitive から再利用）。
#     MEDIA class 指定で audio device class として作成する。
#   - OS state を変更する provisioning/cleanup logic は workflow inline に
#     残さず、Provision/Unprovision script pair の state JSON と exit code
#     を workflow adapter が従来 stage/artifact 形状へ投影する。
#   - endpoint_probe は観測 probe であり pair 未検出を失敗扱いしない
#     （probe 本体が宣言するとおり出力は survey evidence）。
#
# status 語彙（fail-closed — Issue #627 contract・POLICIES §3 と同規則）:
#   ok / absent / blocked / not_run / error（tools/testsigned-driver/
#   probe-stage.ps1 のコメントを参照）。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_ENABLE_TOOLS: rust
  MISE_ENV: ci

jobs:
  probe:
    name: vaudio-probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      # 前回 attempt の workspace 残存物（untracked stage log・package）は
      # 計測前に除去する — stage 記録は attempt ごとに新規に積み直す。
      - name: Reset probe workspace
        shell: pwsh
        run: |
          $os = '${{ matrix.os }}'
          Remove-Item "vaudio-probe-$os.json", "vaudio-state-$os.json", "vaudio-primitive-state.json", "vaudio-unprovision-state.json", "vaudio-primitive-provision", "vaudio-primitive-unprovision", "stage-*-$os.txt", "endpoint-probe-$os.txt", "midi-endpoint-probe-$os.txt", "os-endpoint-run-metadata-$os", "os-endpoint-midi-e2e-run-metadata-$os", "fault-*-$os*", 'vaudio-pkg', 'vaudio-cert.cer' -Recurse -Force -ErrorAction SilentlyContinue

      # endpoint_probe 実行用の Rust toolchain。driver install 経路とは独立
      # に復元し、endpoint-probe stage がいつでも走れる状態にしておく。
      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore Rust toolchain from mise.lock
        run: |
          mise trust
          mise install --locked rust

      - name: Restore cargo registry/git index cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # provisioning primitive — build/test-sign/install/devnode/mic consent/
      # readiness は tools/virtual-audio-driver/Provision-RvfVirtualAudioEndpoint.ps1
      # へ抽出した。workflow 側は子 process の exit code を捕捉し、primitive の
      # 観測状態（exit 1）で job を赤くせず、contract violation（exit 2）だけを
      # probe 機構破損として返す。legacy artifact 利用者のため、実測した primitive
      # stage だけを従来 stage 名へ投影し、state key も互換維持する。
      - name: Provision virtual audio endpoint primitive
        if: always()
        shell: pwsh
        run: |
          . ./tools/testsigned-driver/probe-stage.ps1
          $os = '${{ matrix.os }}'
          $json = "vaudio-probe-$os.json"
          $state = "vaudio-state-$os.json"
          $runnerTemp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $primitiveRoot = Join-Path $runnerTemp 'rvf-virtual-audio-primitive'
          $workspace = Join-Path $primitiveRoot 'workspace'
          $provisionEvidence = Join-Path $primitiveRoot 'provision-evidence'
          $primitiveStatePath = Join-Path $primitiveRoot 'provision-state.json'
          New-Item -ItemType Directory -Force $workspace, $provisionEvidence | Out-Null

          $primitiveArgs = @(
            '-NoProfile', '-NonInteractive', '-File', './tools/virtual-audio-driver/Provision-RvfVirtualAudioEndpoint.ps1',
            '-SourceRoot', $PWD.Path,
            '-ExpectedSourceRev', '${{ github.sha }}',
            '-WorkspaceRoot', $workspace,
            '-StatePath', $primitiveStatePath,
            '-EvidenceDir', $provisionEvidence,
            '-Arch', 'x64',
            '-Configuration', 'Release',
            '-TimeoutSeconds', '3600',
            '-CleanupOnFailure', 'Full',
            '-AllowWdkInstall',
            '-AllowMicConsentProvisioning'
          )
          $provisionOut = @(& pwsh @primitiveArgs 2>&1)
          $primitiveExit = $LASTEXITCODE
          $provisionOut | Tee-Object -FilePath (Join-Path $provisionEvidence 'workflow-adapter-provision.txt')
          "primitive exit=$primitiveExit" | Tee-Object -FilePath (Join-Path $provisionEvidence 'workflow-adapter-provision.txt') -Append

          $contractViolation = ($primitiveExit -eq 2)
          if (-not (Test-Path -LiteralPath $primitiveStatePath)) {
            Add-StageRecord -JsonPath $json -Stage env-build-surface -Status error -Detail "PROVISION_CONTRACT_NO_STATE exit=$primitiveExit" -ExitCode $primitiveExit
            exit 2
          }

          $localStatePath = "$PWD\vaudio-primitive-state.json"
          Copy-Item -LiteralPath $primitiveStatePath -Destination $localStatePath -Force
          $localEvidence = "$PWD\vaudio-primitive-provision"
          New-Item -ItemType Directory -Force $localEvidence | Out-Null
          Copy-Item -Path (Join-Path $provisionEvidence '*') -Destination $localEvidence -Recurse -Force -ErrorAction SilentlyContinue
          $primitivePkg = Join-Path $workspace 'vaudio-pkg'
          $localPkg = "$PWD\vaudio-pkg"
          if (Test-Path -LiteralPath $primitivePkg) {
            if (Test-Path -LiteralPath $localPkg) { Remove-Item -LiteralPath $localPkg -Recurse -Force }
            Copy-Item -LiteralPath $primitivePkg -Destination $localPkg -Recurse -Force
          }
          $primitiveCer = Join-Path $provisionEvidence 'vaudio-cert.cer'
          $localCer = "$PWD\vaudio-cert.cer"
          if (Test-Path -LiteralPath $primitiveCer) { Copy-Item -LiteralPath $primitiveCer -Destination $localCer -Force }

          $primitive = Get-Content -LiteralPath $localStatePath -Raw -Encoding UTF8 | ConvertFrom-Json
          Set-ProbeState $state 'msbuild' $primitive.runner.msbuild
          Set-ProbeState $state 'vs_install' $primitive.runner.vs_install
          $legacyKmHeaders = $primitive.runner.initial_km_headers
          if ($primitive.runner.wdk_install_attempted) { $legacyKmHeaders = $primitive.runner.wdm_header_count }
          Set-ProbeState $state 'km_headers' $legacyKmHeaders
          Set-ProbeState $state 'km_libs' $primitive.runner.initial_km_libs
          Set-ProbeState $state 'sys_path' $primitive.package.sys_path
          if (Test-Path -LiteralPath $localPkg) {
            $localCat = Get-ChildItem -LiteralPath $localPkg -Filter '*.cat' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($localCat) { Set-ProbeState $state 'cat_path' $localCat.FullName } else { Set-ProbeState $state 'cat_path' $primitive.package.cat_path }
            Set-ProbeState $state 'pkg_dir' $localPkg
          } else {
            Set-ProbeState $state 'cat_path' $primitive.package.cat_path
            Set-ProbeState $state 'pkg_dir' $primitive.package.package_dir
          }
          Set-ProbeState $state 'cert_thumbprint' $primitive.os_state.cert_thumbprint
          if (Test-Path -LiteralPath $localCer) { Set-ProbeState $state 'cert_cer_path' $localCer }
          Set-ProbeState $state 'inf_published' $primitive.os_state.inf_published
          Set-ProbeState $state 'inf_staged' ([bool]$primitive.os_state.inf_published)
          Set-ProbeState $state 'instance_id' $primitive.os_state.instance_id

          $stageMap = @(
            [pscustomobject]@{ primitive = 'environment'; legacy = 'env-build-surface' },
            [pscustomobject]@{ primitive = 'driver-build'; legacy = 'driver-build' },
            [pscustomobject]@{ primitive = 'catalog'; legacy = 'catalog-create' },
            [pscustomobject]@{ primitive = 'cert-create'; legacy = 'cert-create' },
            [pscustomobject]@{ primitive = 'cert-install'; legacy = 'store-register' },
            [pscustomobject]@{ primitive = 'sign'; legacy = 'sign' },
            [pscustomobject]@{ primitive = 'sign-verify'; legacy = 'sign-verify' },
            [pscustomobject]@{ primitive = 'driver-store'; legacy = 'pnputil-add-driver' },
            [pscustomobject]@{ primitive = 'enum-verify-pre-devnode'; legacy = 'enum-verify' },
            [pscustomobject]@{ primitive = 'devnode'; legacy = 'devnode-create' }
          )
          foreach ($map in $stageMap) {
            $legacyLog = "stage-$($map.legacy)-$os.txt"
            New-Item -ItemType File -Force $legacyLog | Out-Null
            "projected from primitive stage '$($map.primitive)' (rvf-virtual-audio-provisioning/v1)" | Out-Probe $legacyLog
            if ($map.legacy -eq 'env-build-surface') {
              "runner: ${{ runner.name }} os=${{ runner.os }} arch=${{ runner.arch }}" | Out-Probe $legacyLog
              "ref: ${{ github.ref }} sha: ${{ github.sha }}" | Out-Probe $legacyLog
              "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} attempt=${{ github.run_attempt }}" | Out-Probe $legacyLog
              "host: $(hostname) user: $(whoami) timestamp-utc: $([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Out-Probe $legacyLog
            }
            if ($map.legacy -eq 'driver-build') {
              $wdkLog = Join-Path $localEvidence 'stage-wdk.log'
              if (Test-Path -LiteralPath $wdkLog) {
                '== primitive wdk/tool discovery and install ==' | Out-Probe $legacyLog
                Get-Content -LiteralPath $wdkLog -Encoding UTF8 | ForEach-Object { $_ | Out-Probe $legacyLog }
                '== primitive driver build ==' | Out-Probe $legacyLog
              }
            }
            $primitiveLogName = if ($map.legacy -eq 'enum-verify') { 'stage-enum-verify-pre-devnode.log' } else { "stage-$($map.primitive).log" }
            $primitiveLog = Join-Path $localEvidence $primitiveLogName
            if (Test-Path -LiteralPath $primitiveLog) {
              Get-Content -LiteralPath $primitiveLog -Encoding UTF8 | ForEach-Object { $_ | Out-Probe $legacyLog }
            } else {
              "  primitive stage log absent: $primitiveLog" | Out-Probe $legacyLog
            }

            $recs = @($primitive.stages | Where-Object { $_.stage -eq $map.primitive } | Select-Object -Last 1)
            $rec = if ($recs.Count) { $recs[0] } else { $null }
            $projectedStatus = 'blocked'
            $projectedDetail = "primitive stage '$($map.primitive)' not executed; provision terminal=$($primitive.status)/$($primitive.detail)"
            $projectedExit = $null
            if ($map.legacy -eq 'enum-verify') {
              $pre = $primitive.os_state.pre_devnode
              if ($pre) {
                $projectedStatus = if ($pre.inf_in_store) { 'ok' } else { 'error' }
                $projectedDetail = "inf_in_store=$($pre.inf_in_store); matching_devnodes=$($pre.matching_devnodes)"
                if ($pre.published_name) { Set-ProbeState $state 'inf_published' $pre.published_name }
                Set-ProbeState $state 'inf_staged' ([bool]$pre.inf_in_store)
              } else {
                $projectedStatus = 'blocked'
                $projectedDetail = 'pre-devnode enum observation missing from primitive state'
              }
            } elseif ($rec) {
              $projectedStatus = $rec.status
              $projectedDetail = $rec.detail
              $projectedExit = $rec.exit_code
              if ($map.legacy -eq 'catalog-create' -and (Test-Path -LiteralPath $localPkg)) {
                $localCatRecord = Get-ChildItem -LiteralPath $localPkg -Filter '*.cat' -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($localCatRecord) { $projectedDetail = "cat=$($localCatRecord.FullName)" }
              }
            } elseif ($map.legacy -eq 'driver-build') {
              $wdks = @($primitive.stages | Where-Object { $_.stage -eq 'wdk' } | Select-Object -Last 1)
              if ($wdks.Count -and $wdks[0].status -ne 'ok') {
                $projectedStatus = $wdks[0].status
                $projectedDetail = "driver-build not executed because wdk stage=$($wdks[0].status); $($wdks[0].detail)"
                $projectedExit = $wdks[0].exit_code
              }
            }
            Add-StageRecord -JsonPath $json -Stage $map.legacy -Status $projectedStatus -Detail $projectedDetail -ExitCode $projectedExit
          }

          "primitive terminal status=$($primitive.status) detail=$($primitive.detail) exit=$primitiveExit state=$localStatePath" | Tee-Object -FilePath (Join-Path $localEvidence 'workflow-adapter-summary.txt')
          if ($contractViolation) { exit 2 }
          exit 0

      # endpoint_probe: MMDevice 列挙 + render↔capture pair 候補検出。
      # driver install の成否に関わらず実施する（未 install でも enumeration
      # 結果・pair 不在は判定材料）。pair 未検出は観測値であり失敗扱いしない。
      - name: Stage endpoint-probe
        if: always()
        shell: pwsh
        run: |
          . ./tools/testsigned-driver/probe-stage.ps1
          $os = '${{ matrix.os }}'
          $json = "vaudio-probe-$os.json"
          $state = "vaudio-state-$os.json"
          $log = "stage-endpoint-probe-$os.txt"
          New-Item -ItemType File -Force $log | Out-Null

          $devnodeStatus = Get-StageStatus $json 'devnode-create'
          "  prerequisite devnode-create: $devnodeStatus" | Out-Probe $log

          $kv = @(& ./tools/virtual-audio-driver/Invoke-EndpointProbe.ps1 -OutFile "endpoint-probe-$os.txt" 2>&1)
          $kv | ForEach-Object { "  $_" | Out-Probe $log }
          $probeExit = $LASTEXITCODE
          $pairCount = (($kv | Where-Object { $_ -match '^pair_count=' } | Select-Object -First 1) -replace '^pair_count=', '')
          $endpoints = (($kv | Where-Object { $_ -match '^endpoints_enumerated=' } | Select-Object -First 1) -replace '^endpoints_enumerated=', '')
          "  probe script exit=$probeExit pair_count=$pairCount endpoints=$endpoints" | Out-Probe $log

          $detail = "devnode=$devnodeStatus; probe_exit=$probeExit; $(($kv | Where-Object { $_ -match '=' }) -join '; ')"
          Add-StageRecord -JsonPath $json -Stage endpoint-probe -Status $(if ($probeExit -eq 0) { 'ok' } else { 'error' }) -Detail $detail -ExitCode $probeExit
          exit 0

      # midi_endpoint_probe: WinMM midiIn/midiOut 列挙 + loopback-style
      # pair 候補検出（endpoint-probe の MIDI 版）。driver install の成否に
      # 関わらず実施する（未 install でも列挙結果・候補不在は判定材料）。
      # 候補未検出は観測値であり失敗扱いしない。
      - name: Stage midi-endpoint-probe
        if: always()
        shell: pwsh
        run: |
          . ./tools/testsigned-driver/probe-stage.ps1
          $os = '${{ matrix.os }}'
          $json = "vaudio-probe-$os.json"
          $log = "stage-midi-endpoint-probe-$os.txt"
          New-Item -ItemType File -Force $log | Out-Null

          $devnodeStatus = Get-StageStatus $json 'devnode-create'
          "  prerequisite devnode-create: $devnodeStatus" | Out-Probe $log

          $kv = @(& ./tools/virtual-audio-driver/Invoke-MidiEndpointProbe.ps1 -OutFile "midi-endpoint-probe-$os.txt" 2>&1)
          $kv | ForEach-Object { "  $_" | Out-Probe $log }
          $probeExit = $LASTEXITCODE
          $candidates = (($kv | Where-Object { $_ -match '^loopback_candidates=' } | Select-Object -First 1) -replace '^loopback_candidates=', '')
          $provisioning = (($kv | Where-Object { $_ -match '^provisioning=' } | Select-Object -First 1) -replace '^provisioning=', '')
          "  probe script exit=$probeExit loopback_candidates=$candidates provisioning=$provisioning" | Out-Probe $log

          $detail = "devnode=$devnodeStatus; probe_exit=$probeExit; $(($kv | Where-Object { $_ -match '=' }) -join '; ')"
          Add-StageRecord -JsonPath $json -Stage midi-endpoint-probe -Status $(if ($probeExit -eq 0) { 'ok' } else { 'error' }) -Detail $detail -ExitCode $probeExit
          exit 0

      # stream-roundtrip: tests/virtual_endpoint.rs の実走（AC3）— pair
      # candidate の render 側に 440Hz sine + marker burst を出力し、
      # capture 側で marker spacing・level ratio・tonal concentration を
      # 検証する真の audio round-trip。endpoint 列挙・pair 検出は test
      # 自身が行うため endpoint-probe の結果に依存せず常に試行する。
      # verdict 行（Pass/NotRun/Fail）を detail に記録 — NotRun は
      # 未 provisioned の正直な観測値で失敗扱いしない（fail-closed
      # contract と同型）。Fail のみ error 記録。
      - name: Stage stream-roundtrip
        if: always()
        shell: pwsh
        run: |
          . ./tools/testsigned-driver/probe-stage.ps1
          $os = '${{ matrix.os }}'
          $json = "vaudio-probe-$os.json"
          $log = "stage-stream-roundtrip-$os.txt"
          New-Item -ItemType File -Force $log | Out-Null

          $probeStatus = Get-StageStatus $json 'endpoint-probe'
          "  prerequisite endpoint-probe: $probeStatus" | Out-Probe $log

          # mic consent provisioning は Provision-RvfVirtualAudioEndpoint.ps1
          # へ抽出済み（workflow inline の OS state 変更を残さない）。ここでは
          # primitive state に記録済みの before/after・service restart を read-only
          # で detail へ引き、test は provisioning 済み環境を使う側に限定する。
          $consentNote = @()
          $primitiveStateForConsent = Join-Path $PWD 'vaudio-primitive-state.json'
          if (Test-Path -LiteralPath $primitiveStateForConsent) {
            try {
              $provisionState = Get-Content -LiteralPath $primitiveStateForConsent -Raw -Encoding UTF8 | ConvertFrom-Json
              foreach ($entry in @($provisionState.os_state.consent_after)) {
                if ($entry.tag) { $consentNote += "$($entry.tag)=$($entry.value)" }
              }
              foreach ($entry in @($provisionState.os_state.service_restart)) {
                if ($entry.service) { $consentNote += "$($entry.service)=$($entry.after)" }
              }
            } catch {
              $consentNote += "primitive-state-read-error=$($_.Exception.Message)"
            }
          } else {
            $consentNote += 'primitive-state=absent'
          }
          if (-not $consentNote.Count) { $consentNote += 'primitive-consent=unrecorded' }
          "  mic-consent primitive record: $($consentNote -join ', ')" | Out-Probe $log

          $out = @(& mise run test-audio-virtual-endpoint 2>&1)
          $testExit = $LASTEXITCODE
          $out | ForEach-Object { "  $_" | Out-Probe $log }
          $verdictLine = $out | Where-Object { $_ -match 'verdict:' } | Select-Object -Last 1
          $verdict = if ($verdictLine) { ($verdictLine -replace '.*verdict:\s*', '').Trim() } else { 'no-verdict-line' }
          "  test exit=$testExit verdict=$verdict" | Out-Probe $log

          $status = 'ok'
          if ($verdict -match '^Fail') { $status = 'error' }
          Add-StageRecord -JsonPath $json -Stage stream-roundtrip -Status $status -Detail "test_exit=$testExit; verdict=$verdict; consent=$($consentNote -join ',')" -ExitCode $testExit
          exit 0

      # midi-loopback: Issue #978 Slice C — tests/loopback.rs の実走。
      # WinMM midiIn/midiOut で同名 "Ruviform MIDI Loopback" pair を検出し
      # channel-voice 4 event の round-trip を検証する。port 検出は
      # DMus filter の pin-name GUID→MediaCategories 名解決が前提 —
      # devnode install 後にのみ成立するため、driver install の成否に
      # 関わらず試行し verdict 行（Pass/NotRun/Fail）を detail に記録
      # する。NotRun は未 provisioned の正直な観測値で失敗扱いしない
      # （stream-roundtrip と同じ fail-closed contract）。verdict 行を
      # 出せない異常終了（STATUS_ACCESS_VIOLATION 等、attempt-1 で
      # test_exit=5 / 0xC0000005 を観測）は error として記録する —
      # non-Fail を一律 ok 扱いした初版は crash を ok に見せていたため
      # Pass/NotRun 以外は全て error に改めた。mic consent provisioning
      # は MIDI port に無関係なため stream-roundtrip の consent 処理は
      # 複写しない。
      #
      # diagnostics: WinMM calls は wdmaud2.drv を test process に
      # in-process 読込するため、driver-side contract 違反は user-mode
      # AV として出る。faulting call の bisection 用に child pwsh で
      # midi-winmm-probe.ps1 を先走らせ（crash しても step は継続）、
      # test 実行後は Application log の Application Error/WER 記録
      # （faulting module + exception code）を log に採取する。
      - name: Stage midi-loopback
        if: always()
        shell: pwsh
        run: |
          . ./tools/testsigned-driver/probe-stage.ps1
          $os = '${{ matrix.os }}'
          $json = "vaudio-probe-$os.json"
          $log = "stage-midi-loopback-$os.txt"
          New-Item -ItemType File -Force $log | Out-Null

          $probeStatus = Get-StageStatus $json 'endpoint-probe'
          $devnodeStatus = Get-StageStatus $json 'devnode-create'
          "  prerequisite endpoint-probe: $probeStatus / devnode-create: $devnodeStatus" | Out-Probe $log

          # WinMM bisection probe — child process なので crash しても
          # step は継続し、log の最後の "step:" 行が faulting call。
          "  --- winmm-probe (child pwsh) ---" | Out-Probe $log
          $probeOut = @(& pwsh -NoProfile -NonInteractive -File tools/testsigned-driver/midi-winmm-probe.ps1 2>&1)
          $probeRc = $LASTEXITCODE
          $probeOut | ForEach-Object { "  $_" | Out-Probe $log }
          "  winmm-probe exit=$probeRc" | Out-Probe $log

          # crash dump 採取設定 — attempt-2 で全 WinMM call が child pwsh
          # probe で成功したのに test 本体のみ 0xC0000005 で落ちたため、
          # faulting module/stack を dump 解析で確定する。LocalDumps は
          # job agent の HKLM 書込権限で有効化。
          $dumpDir = "$PWD\crashdumps"
          New-Item -ItemType Directory -Force $dumpDir | Out-Null
          $ld = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $ld -Force | Out-Null
          Set-ItemProperty -Path $ld -Name DumpFolder -Value $dumpDir -Type ExpandString
          Set-ItemProperty -Path $ld -Name DumpCount -Value 5 -Type DWord
          Set-ItemProperty -Path $ld -Name DumpType -Value 2 -Type DWord
          "  LocalDumps enabled -> $dumpDir" | Out-Probe $log

          # test 本体 — mise task は arg forward しないため同じ選択を
          # mise exec 経由の cargo 直叩きで --nocapture を付与（crash 前の
          # 部分出力も拾う）。toolchain env は mise task と同一。
          "  --- loopback test ---" | Out-Probe $log
          $out = @(& mise exec -- cargo test -p ruviform-midi-device --test loopback -- --ignored --test-threads=1 --nocapture 2>&1)
          $testExit = $LASTEXITCODE
          $out | ForEach-Object { "  $_" | Out-Probe $log }
          $verdictLine = $out | Where-Object { $_ -match 'verdict:' } | Select-Object -Last 1
          $verdict = if ($verdictLine) { ($verdictLine -replace '.*verdict:\s*', '').Trim() } else { 'no-verdict-line' }
          "  test exit=$testExit verdict=$verdict" | Out-Probe $log

          # crash diagnostics — 直近の Application Error / WER 記録から
          # faulting module + exception code + offset を採取する。
          "  --- application error / WER events (last 15 min) ---" | Out-Probe $log
          try {
            $evs = Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-15) } -ErrorAction Stop |
              Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting|Application Hang' } |
              Select-Object -First 10
            if ($evs) {
              foreach ($e in $evs) {
                "  [$($e.TimeCreated.ToString('HH:mm:ss'))] $($e.ProviderName) id=$($e.Id)" | Out-Probe $log
                ($e.Message -split "`n") | Select-Object -First 8 | ForEach-Object { "    $_" | Out-Probe $log }
              }
            } else {
              "  (no error events)" | Out-Probe $log
            }
          } catch {
            "  event collect failed: $($_.Exception.Message)" | Out-Probe $log
          }
          $dumps = @(Get-ChildItem $dumpDir -Filter '*.dmp' -ErrorAction SilentlyContinue)
          "  crashdumps: $($dumps.Count) file(s) $(($dumps | ForEach-Object { "$($_.Name) $($_.Length)B" }) -join '; ')" | Out-Probe $log

          # cdb 下で test exe を再実行 — probe で全 WinMM call が成功する
          # のに Rust test だけが落ちるため、faulting module+stack を直接
          # 採取する（LocalDumps は runner で async write が間に合わない
          # ことがあるため debugger 直叩きを正本とする）。
          $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe","$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $testExe = Get-ChildItem "target\debug\deps\loopback-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cdb -and $testExe) {
            "  --- cdb re-run: $($testExe.Name) ---" | Out-Probe $log
            $cdbOut = @(& $cdb.FullName -g -G -c ".ecxr; .exr -1; kL40; lmva `${$ip}; q" $testExe.FullName --ignored --test-threads=1 2>&1)
            $cdbOut | Select-Object -First 120 | ForEach-Object { "  $_" | Out-Probe $log }
          } else {
            "  cdb not found or test exe missing (cdb=$($cdb -ne $null) exe=$($testExe -ne $null))" | Out-Probe $log
          }

          # fail-closed: verdict Pass/NotRun のみ ok。Fail・crash・
          # verdict 未到達・probe crash は error。
          $status = 'ok'
          if (-not ($verdict -match '^(Pass|NotRun)')) { $status = 'error' }
          if ($probeRc -ne 0) { $status = 'error' }
          Add-StageRecord -JsonPath $json -Stage midi-loopback -Status $status -Detail "test_exit=$testExit; verdict=$verdict; probe_exit=$probeRc" -ExitCode $testExit
          exit 0

      # os-endpoint-wiring: Issue #1001 Slice F — AC3 wiring leg 2 件
      # （audio `rf629.audio.virtual-endpoint.render-capture` / midi
      # `rf629.midi.virtual-endpoint.loopback`）の provisioned 実走。
      # stream-roundtrip stage で済ませた mic consent provisioning を同一
      # job 内で再利用するため `midi-loopback` 後・`cleanup` 前に置く。
      # canonical lane は `mise run test-os-endpoint-wiring` だが、passing
      # test の stderr は libtest が capture するため、ここでは RunMetadata
      # と verdict を surface させる補助証拠として mise 経由の直接 cargo
      # 実行に `--nocapture` を付ける。Pass/NotRun は fail-closed contract
      # 上の正常終端（stage ok）、Fail・crash・verdict/RunMetadata 未到達・
      # artifact copy 不能は error に写す。
      - name: Stage os-endpoint-wiring
        if: always()
        shell: pwsh
        env:
          RUVIFORM_RUN_REPO: ${{ github.repository }}
          RUVIFORM_RUN_SHA: ${{ github.sha }}
        run: |
          . ./tools/testsigned-driver/probe-stage.ps1
          $os = '${{ matrix.os }}'
          $json = "vaudio-probe-$os.json"
          $log = "stage-os-endpoint-wiring-$os.txt"
          $collect = "os-endpoint-run-metadata-$os"
          New-Item -ItemType File -Force $log | Out-Null
          New-Item -ItemType Directory -Force $collect | Out-Null

          $streamStatus = Get-StageStatus $json 'stream-roundtrip'
          $midiStatus = Get-StageStatus $json 'midi-loopback'
          "  prerequisite stream-roundtrip: $streamStatus / midi-loopback: $midiStatus" | Out-Probe $log
          "  run metadata identity: repo=${env:RUVIFORM_RUN_REPO} sha=${env:RUVIFORM_RUN_SHA}" | Out-Probe $log

          "  --- os_endpoint wiring legs (--nocapture auxiliary evidence; canonical lane: mise run test-os-endpoint-wiring) ---" | Out-Probe $log
          $out = @(& mise exec -- cargo test -p ruviform-audio-test --test os_endpoint -- --ignored --test-threads=1 --nocapture 2>&1)
          $testExit = $LASTEXITCODE
          $out | ForEach-Object { "  $_" | Out-Probe $log }
          "  test exit=$testExit" | Out-Probe $log

          $verdictLines = @($out | Where-Object { "$_" -match '^verdict:\s*' })
          $badVerdicts = @($verdictLines | Where-Object { "$_" -notmatch '^verdict:\s*(Pass|NotRun)' })
          "  verdict lines=$($verdictLines.Count)" | Out-Probe $log

          $audioCase = 'rf629.audio.virtual-endpoint.render-capture'
          $midiCase = 'rf629.midi.virtual-endpoint.loopback'
          $metadata = @()
          $metadataParseErrors = @()
          foreach ($line in $out) {
            $text = "$line"
            if ($text -match '^run_metadata:\s*(\{.*\})\s*$') {
              try {
                $metadata += ($Matches[1] | ConvertFrom-Json -ErrorAction Stop)
              } catch {
                $metadataParseErrors += $_.Exception.Message
                "  run_metadata parse error: $($_.Exception.Message)" | Out-Probe $log
              }
            }
          }
          $audioMeta = @($metadata | Where-Object { $_.case_id -eq $audioCase }) | Select-Object -Last 1
          $midiMeta = @($metadata | Where-Object { $_.case_id -eq $midiCase }) | Select-Object -Last 1
          $audioResult = if ($audioMeta) { $audioMeta.result } else { 'metadata-missing' }
          $midiResult = if ($midiMeta) { $midiMeta.result } else { 'metadata-missing' }
          "  metadata: audio=$audioResult midi=$midiResult records=$($metadata.Count)" | Out-Probe $log

          $copyFailures = @()
          $copied = 0
          foreach ($line in $out) {
            $text = "$line"
            if ($text -match '^run_metadata_path:\s*(.+?)\s*$') {
              $source = $Matches[1]
              try {
                if (-not (Test-Path -LiteralPath $source)) { throw "run metadata source missing: $source" }
                Copy-Item -LiteralPath $source -Destination $collect -Force -ErrorAction Stop
                $copied += 1
                "  copied run metadata: $source -> $collect" | Out-Probe $log
              } catch {
                $copyFailures += $_.Exception.Message
                "  run metadata copy error: $($_.Exception.Message)" | Out-Probe $log
              }
            }
          }
          $expectedFiles = @(
            'run-metadata-rf629-audio-virtual-endpoint-render-capture.json',
            'run-metadata-rf629-midi-virtual-endpoint-loopback.json'
          )
          $missingCopies = @($expectedFiles | Where-Object { -not (Test-Path -LiteralPath (Join-Path $collect $_)) })
          if ($missingCopies.Count) {
            "  missing copied metadata: $($missingCopies -join ', ')" | Out-Probe $log
          }
          "  collected metadata files: $((Get-ChildItem $collect -Filter '*.json' -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')" | Out-Probe $log

          $metadataProblems = @()
          foreach ($case in @(
              @{ label = 'audio'; meta = $audioMeta; caseId = $audioCase },
              @{ label = 'midi'; meta = $midiMeta; caseId = $midiCase }
            )) {
            if (-not $case.meta) {
              $metadataProblems += "$($case.label):missing"
              continue
            }
            if ($case.meta.level -ne 'ext-l3') { $metadataProblems += "$($case.label):level=$($case.meta.level)" }
            if ($case.meta.environment_kind -ne 'virtual-os-endpoint') { $metadataProblems += "$($case.label):environment=$($case.meta.environment_kind)" }
            if ($case.meta.repo -ne ${env:RUVIFORM_RUN_REPO}) { $metadataProblems += "$($case.label):repo=$($case.meta.repo)" }
            if ($case.meta.sha -ne ${env:RUVIFORM_RUN_SHA}) { $metadataProblems += "$($case.label):sha=$($case.meta.sha)" }
            if ($case.meta.result -notin @('pass', 'not-run')) { $metadataProblems += "$($case.label):result=$($case.meta.result)" }
          }
          if ($metadataProblems.Count) {
            "  metadata problems: $($metadataProblems -join '; ')" | Out-Probe $log
          }

          # fail-closed: Pass/NotRun は観測終端として ok。Fail・crash
          # （test exit 非ゼロ）・verdict 未到達・RunMetadata 未到達/不正・
          # artifact copy 不能は error。両 leg pass の AC 判定は stage status
          # ではなく RunMetadata JSON 本体を読んで行う。
          $status = 'ok'
          if ($testExit -ne 0) { $status = 'error' }
          if ($verdictLines.Count -lt 2 -or $badVerdicts.Count) { $status = 'error' }
          if (-not $audioMeta -or -not $midiMeta -or $metadataParseErrors.Count -or $metadataProblems.Count) { $status = 'error' }
          if ($copyFailures.Count -or $missingCopies.Count -or $copied -lt 2) { $status = 'error' }
          $detail = "test_exit=$testExit; audio=$audioResult; midi=$midiResult; verdicts=$($verdictLines.Count); metadata=$($metadata.Count); copied=$copied"
          if ($metadataProblems.Count) { $detail += "; metadata_problems=$($metadataProblems -join '|')" }
          if ($copyFailures.Count) { $detail += "; copy_errors=$($copyFailures.Count)" }
          Add-StageRecord -JsonPath $json -Stage os-endpoint-wiring -Status $status -Detail $detail -ExitCode $testExit
          exit 0

      # os-endpoint-midi-e2e: Issue #253 AC1/AC6 — provisioned RvfMidi
      # loopback pair 経由で production WinMM backend → InputTx →
      # InputStage → attach → typed graph → out-of-process VST3
      # test_instrument まで通す vertical slice の実走。RF#628 trace
      # supply を stimulus source とし、RunMetadata を artifact へ集約
      # する。`midi-loopback` が同じ pair の raw round-trip、
      # `midi-endpoint-probe` が candidate/provisioning provenance を
      # 記録済みであるため、cleanup 前のこの位置で実行する。canonical
      # lane は `mise run test-os-endpoint-midi-e2e` だが、passing test
      # の stderr は libtest が capture するため、ここでは fixture build
      # 後に mise 経由の直接 cargo 実行へ `--nocapture` を付ける。
      # RvfMidi provenance を伴う Pass/NotRun は fail-closed contract 上の
      # 正常終端（stage ok）、Fail・crash・verdict/RunMetadata 未到達・
      # artifact copy 不能・provenance なし Pass は error に写す。
      # AC 判定は stage status ではなく RunMetadata JSON
      # 本体と midi-endpoint-probe / midi-loopback の provenance を読む。
      - name: Stage os-endpoint-midi-e2e
        if: always()
        shell: pwsh
        env:
          RUVIFORM_RUN_REPO: ${{ github.repository }}
          RUVIFORM_RUN_SHA: ${{ github.sha }}
        run: |
          . ./tools/testsigned-driver/probe-stage.ps1
          $os = '${{ matrix.os }}'
          $json = "vaudio-probe-$os.json"
          $log = "stage-os-endpoint-midi-e2e-$os.txt"
          $collect = "os-endpoint-midi-e2e-run-metadata-$os"
          New-Item -ItemType File -Force $log | Out-Null
          New-Item -ItemType Directory -Force $collect | Out-Null

          $probeStatus = Get-StageStatus $json 'midi-endpoint-probe'
          $midiStatus = Get-StageStatus $json 'midi-loopback'
          $devnodeStatus = Get-StageStatus $json 'devnode-create'
          "  prerequisite midi-endpoint-probe: $probeStatus / midi-loopback: $midiStatus / devnode-create: $devnodeStatus" | Out-Probe $log
          "  run metadata identity: repo=${env:RUVIFORM_RUN_REPO} sha=${env:RUVIFORM_RUN_SHA}" | Out-Probe $log

          $probeText = ''
          $probeFile = "midi-endpoint-probe-$os.txt"
          if (Test-Path -LiteralPath $probeFile) { $probeText = Get-Content -LiteralPath $probeFile -Raw -Encoding UTF8 -ErrorAction SilentlyContinue }
          $provisioningObserved = ($probeText -match 'provisioning:\s*CANDIDATES_OBSERVED') -and ($probeText -match 'Ruviform MIDI Loopback')
          $midiLoopbackText = ''
          $midiLoopbackLog = "stage-midi-loopback-$os.txt"
          if (Test-Path -LiteralPath $midiLoopbackLog) { $midiLoopbackText = Get-Content -LiteralPath $midiLoopbackLog -Raw -Encoding UTF8 -ErrorAction SilentlyContinue }
          $midiLoopbackPass = $midiLoopbackText -match 'verdict:\s*Pass.*round-trip observed through real OS ports'
          "  RvfMidi provenance: candidates_observed=$provisioningObserved midi_loopback_pass=$midiLoopbackPass" | Out-Probe $log
          "  --- provenance candidate evidence ---" | Out-Probe $log
          $probeEvidenceLines = @($probeText -split "\r?\n" | Where-Object { $_ -match 'loopback-candidate|loopback-style candidates|provisioning:\s*' })
          if ($probeEvidenceLines.Count) {
            $probeEvidenceLines | ForEach-Object { "  midi-endpoint-probe: $($_.Trim())" | Out-Probe $log }
          } else {
            "  midi-endpoint-probe: no candidate/provisioning evidence lines" | Out-Probe $log
          }
          $midiEvidenceLines = @($midiLoopbackText -split "\r?\n" | Where-Object { $_ -match '^\s*candidate\[|verdict:\s*Pass.*round-trip observed through real OS ports' })
          if ($midiEvidenceLines.Count) {
            $midiEvidenceLines | ForEach-Object { "  midi-loopback: $($_.Trim())" | Out-Probe $log }
          } else {
            "  midi-loopback: no candidate/round-trip Pass evidence lines" | Out-Probe $log
          }
          $endpointProvenance = if ($provisioningObserved -and $midiLoopbackPass) { 'rvfmidi-testsigned-driver-probe' } else { 'workflow-unverified-loopback-candidate' }
          $env:RUVIFORM_VIRTUAL_ENDPOINT_PROVENANCE = $endpointProvenance
          "  run metadata provenance override: $endpointProvenance" | Out-Probe $log

          "  --- fixture build (canonical lane first step: mise run test-os-endpoint-midi-e2e) ---" | Out-Probe $log
          $buildOut = @(& mise exec -- cargo build -p ruviform-plugin-test-vst3 --features l1-runner 2>&1)
          $buildExit = $LASTEXITCODE
          $buildOut | ForEach-Object { "  $_" | Out-Probe $log }
          "  build exit=$buildExit" | Out-Probe $log

          $out = @()
          $testExit = $buildExit
          if ($buildExit -eq 0) {
            "  --- os_endpoint_midi_e2e (--nocapture auxiliary evidence; canonical lane: mise run test-os-endpoint-midi-e2e) ---" | Out-Probe $log
            $out = @(& mise exec -- cargo test -p ruviform-plugin-test-vst3 --features l1-runner --test os_endpoint_midi_e2e -- --ignored --test-threads=1 --nocapture 2>&1)
            $testExit = $LASTEXITCODE
            $out | ForEach-Object { "  $_" | Out-Probe $log }
            "  test exit=$testExit" | Out-Probe $log
          }

          $verdictLines = @($out | Where-Object { "$_" -match '^verdict:\s*' })
          $badVerdicts = @($verdictLines | Where-Object { "$_" -notmatch '^verdict:\s*(Pass|NotRun)' })
          $verdict = if ($verdictLines) { (($verdictLines | Select-Object -Last 1) -replace '.*verdict:\s*', '').Trim() } else { 'no-verdict-line' }
          "  verdict=$verdict lines=$($verdictLines.Count)" | Out-Probe $log

          $caseId = 'rf253.midi.virtual-endpoint.host-plugin-e2e'
          $metadata = @()
          $metadataParseErrors = @()
          foreach ($line in $out) {
            $text = "$line"
            if ($text -match '^run_metadata:\s*(\{.*\})\s*$') {
              try {
                $metadata += ($Matches[1] | ConvertFrom-Json -ErrorAction Stop)
              } catch {
                $metadataParseErrors += $_.Exception.Message
                "  run_metadata parse error: $($_.Exception.Message)" | Out-Probe $log
              }
            }
          }
          $caseMeta = @($metadata | Where-Object { $_.case_id -eq $caseId }) | Select-Object -Last 1
          $caseResult = if ($caseMeta) { $caseMeta.result } else { 'metadata-missing' }
          "  metadata: case=$caseResult records=$($metadata.Count)" | Out-Probe $log

          $copyFailures = @()
          $copied = 0
          foreach ($line in $out) {
            $text = "$line"
            if ($text -match '^run_metadata_path:\s*(.+?)\s*$') {
              $source = $Matches[1]
              try {
                if (-not (Test-Path -LiteralPath $source)) { throw "run metadata source missing: $source" }
                Copy-Item -LiteralPath $source -Destination $collect -Force -ErrorAction Stop
                $copied += 1
                "  copied run metadata: $source -> $collect" | Out-Probe $log
              } catch {
                $copyFailures += $_.Exception.Message
                "  run metadata copy error: $($_.Exception.Message)" | Out-Probe $log
              }
            }
          }
          $expectedFile = 'run-metadata-rf253-midi-virtual-endpoint-host-plugin-e2e.json'
          $missingCopy = -not (Test-Path -LiteralPath (Join-Path $collect $expectedFile))
          if ($missingCopy) { "  missing copied metadata: $expectedFile" | Out-Probe $log }
          "  collected metadata files: $((Get-ChildItem $collect -Filter '*.json' -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')" | Out-Probe $log

          $metadataProblems = @()
          $passWithoutProvenance = $false
          if (-not $caseMeta) {
            $metadataProblems += 'case:missing'
          } else {
            if ($caseMeta.level -ne 'ext-l3') { $metadataProblems += "level=$($caseMeta.level)" }
            if ($caseMeta.environment_kind -ne 'virtual-os-endpoint') { $metadataProblems += "environment=$($caseMeta.environment_kind)" }
            if ($caseMeta.repo -ne ${env:RUVIFORM_RUN_REPO}) { $metadataProblems += "repo=$($caseMeta.repo)" }
            if ($caseMeta.sha -ne ${env:RUVIFORM_RUN_SHA}) { $metadataProblems += "sha=$($caseMeta.sha)" }
            if ($caseMeta.result -notin @('pass', 'not-run')) { $metadataProblems += "result=$($caseMeta.result)" }
            if ($caseMeta.result -eq 'pass') {
              $metadataEvidenceText = @($caseMeta.evidence | ForEach-Object { "$_" }) -join "`n"
              $metadataHasRvfMidiProvenance = $metadataEvidenceText -match 'virtual endpoint provenance:\s*rvfmidi-testsigned-driver-probe'
              if (-not ($provisioningObserved -and $midiLoopbackPass) -or -not $metadataHasRvfMidiProvenance) {
                $passWithoutProvenance = $true
                $metadataProblems += 'pass_without_rvfmidi_provenance'
                "  fail-closed: case result is pass but RvfMidi provenance is not established (workflow=$endpointProvenance metadata_provenance=$metadataHasRvfMidiProvenance)" | Out-Probe $log
              }
            }
          }
          if ($metadataProblems.Count) {
            "  metadata problems: $($metadataProblems -join '; ')" | Out-Probe $log
          }

          # fail-closed: provenance 付き Pass/NotRun は観測終端として ok。
          # Fail・crash（test exit 非ゼロ）・verdict 未到達・RunMetadata
          # 未到達/不正・artifact copy 不能は error。provenance 不在そのものは
          # absence-is-data であり、case が honest NotRun なら stage ok だが、
          # RvfMidi provenance なしの pass は証拠価値がないため error にする。
          $status = 'ok'
          if ($buildExit -ne 0 -or $testExit -ne 0) { $status = 'error' }
          if ($verdictLines.Count -lt 1 -or $badVerdicts.Count) { $status = 'error' }
          if (-not $caseMeta -or $metadataParseErrors.Count -or $metadataProblems.Count) { $status = 'error' }
          if ($copyFailures.Count -or $missingCopy -or $copied -lt 1) { $status = 'error' }
          if ($passWithoutProvenance) { $status = 'error' }
          $detail = "build_exit=$buildExit; test_exit=$testExit; verdict=$verdict; case=$caseResult; metadata=$($metadata.Count); copied=$copied; provisioning_observed=$provisioningObserved; midi_loopback_pass=$midiLoopbackPass; endpoint_provenance=$endpointProvenance; pass_without_provenance=$passWithoutProvenance"
          if ($metadataProblems.Count) { $detail += "; metadata_problems=$($metadataProblems -join '|')" }
          if ($copyFailures.Count) { $detail += "; copy_errors=$($copyFailures.Count)" }
          Add-StageRecord -JsonPath $json -Stage os-endpoint-midi-e2e -Status $status -Detail $detail -ExitCode $testExit
          exit 0

      # fault-cases: Issue #1002 Slice G — AC5 fault harness の provisioned
      # 実走。os-endpoint-wiring が必要とする mic consent provisioning を
      # 汚染しないよう wiring 後・cleanup 前に置く。OS 状態制御（devnode
      # disable/enable・mic consent Deny/Allow・service restart）はこの
      # stage に閉じ、Rust test は Expected/Observed oracle と reopen
      # recovery だけを担当する。controller 未 armed の canonical lane では
      # fault test は inactive 記録に留まり、既存 verdict 契約に混入しない。
      # case-level Pass/Fail/NotRun/Unsupported を正規判定とし、stage ok は
      # 測定 harness が完走し case-level Fail がなかった意味に限定する。
      - name: Stage fault-cases
        if: always()
        shell: pwsh
        env:
          RUVIFORM_RUN_REPO: ${{ github.repository }}
          RUVIFORM_RUN_SHA: ${{ github.sha }}
        run: |
          . ./tools/testsigned-driver/probe-stage.ps1
          $os = '${{ matrix.os }}'
          $json = "vaudio-probe-$os.json"
          $log = "stage-fault-cases-$os.txt"
          New-Item -ItemType File -Force $log | Out-Null
          try {
            & ./tools/virtual-audio-driver/Invoke-FaultCases.ps1 -Os $os 2>&1
          } catch {
            "  fault controller invocation error: $($_.Exception.Message)" | Out-Probe $log | Out-Null
            Add-StageRecord -JsonPath $json -Stage fault-cases -Status error -Detail "controller-invocation-error: $($_.Exception.Message)"
          }
          exit 0

      # cleanup: test/probe/artifact upload の成否に関係なく、primitive の
      # unprovision を partial state に対して実行する。exit 1（residue/error を
      # 含む観測結果）は stage evidence として記録して workflow は継続し、
      # exit 2（contract violation）だけを probe 機構破損として返す。
      - name: Stage cleanup
        if: always()
        shell: pwsh
        run: |
          . ./tools/testsigned-driver/probe-stage.ps1
          $os = '${{ matrix.os }}'
          $json = "vaudio-probe-$os.json"
          $log = "stage-cleanup-$os.txt"
          New-Item -ItemType File -Force $log | Out-Null

          $runnerTemp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $primitiveRoot = Join-Path $runnerTemp 'rvf-virtual-audio-primitive'
          $unprovisionEvidence = Join-Path $primitiveRoot 'unprovision-evidence'
          $statePath = Join-Path $PWD 'vaudio-primitive-state.json'
          New-Item -ItemType Directory -Force $unprovisionEvidence | Out-Null
          if (-not (Test-Path -LiteralPath $statePath)) {
            "  primitive state missing: $statePath" | Out-Probe $log
            Add-StageRecord -JsonPath $json -Stage cleanup -Status error -Detail 'PROVISION_STATE_MISSING unprovision input state is absent'
            exit 2
          }

          $unprovisionArgs = @(
            '-NoProfile', '-NonInteractive', '-File', './tools/virtual-audio-driver/Unprovision-RvfVirtualAudioEndpoint.ps1',
            '-StatePath', $statePath,
            '-WorkspaceRoot', (Join-Path $primitiveRoot 'workspace'),
            '-EvidenceDir', $unprovisionEvidence,
            '-CleanupMode', 'Full',
            '-TimeoutSeconds', '900'
          )
          $cleanupOut = @(& pwsh @unprovisionArgs 2>&1)
          $cleanupExit = $LASTEXITCODE
          $cleanupOut | Tee-Object -FilePath (Join-Path $unprovisionEvidence 'workflow-adapter-unprovision.txt')
          "unprovision exit=$cleanupExit" | Tee-Object -FilePath (Join-Path $unprovisionEvidence 'workflow-adapter-unprovision.txt') -Append

          $localEvidence = "$PWD\vaudio-primitive-unprovision"
          New-Item -ItemType Directory -Force $localEvidence | Out-Null
          Copy-Item -Path (Join-Path $unprovisionEvidence '*') -Destination $localEvidence -Recurse -Force -ErrorAction SilentlyContinue

          "unprovision primitive output (exit=$cleanupExit)" | Out-Probe $log
          foreach ($line in $cleanupOut) { "  $line" | Out-Probe $log }
          $cleanupStatePath = Join-Path $localEvidence 'unprovision-state.json'
          if (Test-Path -LiteralPath $cleanupStatePath) {
            Copy-Item -LiteralPath $cleanupStatePath -Destination "$PWD\vaudio-unprovision-state.json" -Force
            $cleanupState = Get-Content -LiteralPath $cleanupStatePath -Raw -Encoding UTF8 | ConvertFrom-Json
            $leftovers = @($cleanupState.cleanup.leftovers | Where-Object { $null -ne $_ })
            $errors = @($cleanupState.cleanup.errors | Where-Object { $null -ne $_ })
            foreach ($leftover in $leftovers) { "  leftover: $leftover" | Out-Probe $log }
            foreach ($err in $errors) { "  cleanup-error: $err" | Out-Probe $log }
            $status = if ($cleanupState.status -eq 'ok') { 'ok' } else { 'error' }
            $detail = "primitive_status=$($cleanupState.status); detail=$($cleanupState.detail); leftovers=$($leftovers.Count); errors=$($errors.Count)"
            Add-StageRecord -JsonPath $json -Stage cleanup -Status $status -Detail $detail -ExitCode $cleanupExit
          } else {
            "  unprovision state missing: $cleanupStatePath" | Out-Probe $log
            Add-StageRecord -JsonPath $json -Stage cleanup -Status error -Detail "UNPROVISION_CONTRACT_NO_STATE exit=$cleanupExit" -ExitCode $cleanupExit
            exit 2
          }
          "  cleanup done" | Out-Probe $log
          if ($cleanupExit -eq 2) { exit 2 }
          exit 0

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Unique-per-run names (upload-artifact v4): keep every
          # attempt's evidence instead of overwriting.
          name: virtual-audio-driver-probe-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: |
            vaudio-probe-${{ matrix.os }}.json
            vaudio-state-${{ matrix.os }}.json
            vaudio-primitive-state.json
            vaudio-unprovision-state.json
            vaudio-primitive-provision/
            vaudio-primitive-unprovision/
            stage-*-${{ matrix.os }}.txt
            endpoint-probe-${{ matrix.os }}.txt
            midi-endpoint-probe-${{ matrix.os }}.txt
            os-endpoint-run-metadata-${{ matrix.os }}/
            os-endpoint-midi-e2e-run-metadata-${{ matrix.os }}/
            fault-*-${{ matrix.os }}*
            crashdumps/
            vaudio-pkg/
            vaudio-cert.cer
          if-no-files-found: warn
          retention-days: 30

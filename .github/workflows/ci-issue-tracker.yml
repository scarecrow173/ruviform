name: ci-issue-tracker

# Issue #368 (CI-DAILY-03): watch every completed `ci` (Full CI) run and
# keep at most ONE open failure issue for repo × workflow × main. On the
# failure side (`failure`/`timed_out`/`startup_failure`) it creates or
# updates the tracked issue; it auto-closes only when a NEWER `ci` run
# succeeds at a revision covering the failed one ((run id, attempt) ordering +
# compare API guard — an old or divergent success never closes a newer
# failure). `cancelled`/`skipped`/unknown conclusions are neither success
# nor failure — they update the operational note only.
#
# Trust model: workflow_run jobs always execute THIS file and
# ci/tracker/tracker.mjs from the default branch — never the completed
# run's head, PR code, or artifacts. The job touches GitHub REST metadata
# only (issues, jobs, compare); untrusted values are sanitized before they
# land in issue bodies or logs.
#
# Deliberately NO pull_request/push/schedule/workflow_dispatch triggers:
# the tracker reacts to ci completions and nothing else (manual ops are
# documented in ci/tracker/README.md).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize tracker runs repo-wide: completed ci runs queue up instead of
# racing each other, so the list→create/update cycle can never double-file
# an issue. Never cancel an in-flight tracker mid-write.
concurrency:
  group: ci-issue-tracker-${{ github.repository }}
  cancel-in-progress: false

env:
  MISE_ENABLE_TOOLS: node

jobs:
  track:
    runs-on: ubuntu-latest
    # Least privilege for the only job that exists: issues:write to manage
    # the failure issue, actions:read for run/job metadata, contents:read
    # for the compare API and default-branch checkout.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout repository (default branch tracker code)
        uses: actions/checkout@v7.0.1
        with:
          # workflow_run resolves github.sha to the default branch head —
          # pin it explicitly so the checkout can only ever be trusted
          # mainline code, never the completed run's revision.
          ref: ${{ github.sha }}

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore CI-required tools from mise.lock
        run: |
          mise trust
          mise install --locked node

      # Same self-test pattern as the ci-summary job: a broken evaluator
      # must fail this job rather than create/update/close the wrong
      # issue. All tests run against a mock client — no API calls.
      - name: Self-test tracker evaluator (mise run test-ci-tracker)
        run: mise run test-ci-tracker

      - name: Evaluate completed run and update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKER_EVENT_PATH: ${{ github.event_path }}
        run: mise exec -- node ci/tracker/tracker.mjs --report ci-issue-tracker-report.json

      - name: Upload tracker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-issue-tracker-report-attempt-${{ github.run_attempt }}
          path: ci-issue-tracker-report.json
          if-no-files-found: warn

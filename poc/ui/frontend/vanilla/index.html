<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ui-poc render bench (vanilla)</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #cfd8e3;
               font: 13px/1.4 system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; padding: 8px; box-sizing: border-box; gap: 8px; }
  #wave { width: 100%; height: 420px; background: #0d1117; border: 1px solid #30363d; }
  #meters { display: flex; gap: 8px; height: 96px; }
  .meter { flex: 1; position: relative; background: #161b22; border: 1px solid #30363d;
           overflow: hidden; }
  .meter-fill { position: absolute; inset: 0; transform-origin: bottom;
                transform: scaleY(0); background: linear-gradient(#3fb950, #d29922); }
  #hud { color: #8b949e; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div id="app">
  <canvas id="wave" width="944" height="420"></canvas>
  <div id="meters"></div>
  <div id="hud">idle — waiting for __poc.start</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

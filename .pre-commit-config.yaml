# Lightweight, staged-file formatting, syntax and safety checks via prek.
# Rust package verification uses mise tasks; workspace/OS verification stays in Full CI.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # vendored upstream files must stay byte-identical to manifest.json
        exclude: '^crates/ruviform-plugin-ofx/vendor/'
      - id: end-of-file-fixer
        exclude: '^crates/ruviform-plugin-ofx/vendor/'
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        exclude: '(\.(ps1|bat|cmd)$|^crates/ruviform-plugin-ofx/vendor/)'
      - id: fix-byte-order-marker
        exclude: '(\.ps1$|^crates/ruviform-plugin-ofx/vendor/)'
      - id: detect-private-key
      - id: check-illegal-windows-names

  - repo: local
    hooks:
      # Only staged GitHub Actions workflow files: no workspace-wide scan on commit.
      # The Full CI's prek --all-files run covers all workflows.
      - id: actionlint
        name: actionlint (changed workflows)
        entry: mise exec -- actionlint
        language: system
        files: '^\.github/workflows/.*\.ya?ml'
        types: [yaml]
        pass_filenames: true

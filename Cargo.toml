[workspace]
resolver = "2"
members = ["crates/ruviform-core"]

[workspace.package]
edition = "2021"          # 仮置き。edition / MSRV の再評価は専用の確認タスク（design が挙げる edition/MSRV/publish 反映 Issue）へ送付し、現段階では変更しない
rust-version = "1.85"     # 仮置き MSRV。mise pin バージョン以上にはしない。再評価は専用の確認タスク（edition/MSRV/publish 反映 Issue）へ送付し、現段階では変更しない
license = "MIT"           # 仮置き。配布方針確定前の暫定値
publish = false           # 未決定クレートは公開しない（licensing ADR 原則）。メンバーは publish.workspace = true で継承する

[workspace.lints.rust]
unsafe_code = "warn"      # lint ゲートの -D warnings で実質 deny。例外は局所許可＋SAFETY コメント（後述）
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"  # pedantic の過剰適用を初期段階で緩和（仮置き）

# Local development: retain full debug information.
[profile.dev]
debug = "full"

# CI: inherit development checks but generate smaller build artifacts.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

# CI: dependencies outside the workspace do not need debug symbols.
[profile.ci.package."*"]
debug = "none"

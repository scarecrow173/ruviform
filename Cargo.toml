[workspace]
resolver = "2"
# Phase 1 基盤クレート群（Issue #17 で仮置き ruviform-core を分割置換）+ video-proc（Issue #26 新設）+ media-io / io-symphonia（Issue #20 新設）+ audio-device adapter（Issue #23 新設）+ plugin-core / plugin-clap / plugin-vst3（Issue #29 新設）+ plugin-export（Issue #76 新設）+ edit（Issue #96 新設）+ numeric（Issue #150 新設 — f64 オフライン数値・DSP）。層内
# 順序: Primitives 最下位（math・numeric・rt）→ Primitives（media-core・exec）→
# Domain foundations（audio-core・video-core → video-proc）→ メディア I/O 抽象境界（media-io）
# → バックエンド PoC（io-symphonia）→ Adapters（audio-device）→ 拡張層（plugin-*）。実装状態: Issue #18 で
# media-core・audio-core・video-core のデータモデル API、Issue #21 で rt・
# exec の RT 基盤 API、Issue #26 で video-proc の色変換カーネル、Issue #20 で
# media-io の抽象境界、Issue #29 で plugin 系の規格中立基盤と CLAP/VST3 アダプタが確定・実装済み。math は引き続きスケルトン。クレート間の
# path 依存は API 確定に伴い段階追加（Issue #18 で audio-core・video-core →
# media-core、Issue #26 で video-proc → video-core・media-core、Issue #20 で
# media-io → domain 3 クレート、io-symphonia → media-io + domain クレート、Issue #29 で
# plugin-core → audio-core・media-core、plugin-clap / plugin-vst3 → plugin-core・audio-core・media-core＋各 binding クレートを設定済み）。
# 設計ベースライン A.2/A.6 参照。
members = [
    "crates/ruviform-plugin-ofx",
    "crates/ruviform-math",
    # f64 高精度オフライン数値・DSP プリミティブ（Issue #150 新設 — Primitives 最下位・std のみ）
    "crates/ruviform-numeric",
    "crates/ruviform-rt",
    "crates/ruviform-exec",
    # 共有観測プリミティブ（Issue #101 候補・Issue #121 新設 — counter pair・L1 diagnostics が初消費者）
    "crates/ruviform-observability",
    "crates/ruviform-media-core",
    "crates/ruviform-audio-core",
    "crates/ruviform-video-core",
    "crates/ruviform-video",
    "crates/ruviform-video-proc",
    # Foundations (audio DSP kernels + 解析。Issue #75 / #92 で新設)
    "crates/ruviform-dsp",
    "crates/ruviform-audio-analysis",
    "crates/ruviform-media-io",
    "crates/ruviform-io-symphonia",
    # メディア I/O バックエンド（Issue #154 — AudioLens が消費する AVI/DIB・WAVEFORMATEX 入力を所有する pure-Rust demux/decode adapter）
    "crates/ruviform-io-avi",
    # Adapters（ドメイン基盤の外側・engine と同じ利用側層。Issue #23 PoC で新設）
    "crates/ruviform-audio-device",
    # 拡張層（規格中立のプラグイン基盤。Issue #29 PoC で新設）
    "crates/ruviform-plugin-core",
    "crates/ruviform-plugin-clap",
    "crates/ruviform-plugin-vst3",
    # プラグイン側 L1 ランナー層（Issue #76 — 子プロセスエントリ run() + 参照 runner bin）
    "crates/ruviform-plugin-export",
    # Host 層（Issue #74 — L0 インプロセス・ハンドル/コマンド境界。Issue #76 で L1 アウトプロセス + `PluginHost` コンポジット追加）
    "crates/ruviform-plugin-host",
    # 構造層（Issue #184 — 型付き複数 Bus・Port 接続の Graph IR + 非 RT Validator。engine 消費者の直前の構造層）
    "crates/ruviform-graph",
    # Engines（Issue #25 で新設）
    "crates/ruviform-audio",
    # 利用側層（Issue #96 — NLE 非破壊編集データモデル + 評価射影。engine 同順位・全 API 非 RT）
    "crates/ruviform-edit",
    # 拡張層 GUI 基盤（Issue #156 — WebView 非依存の UI ホスト基盤 + wry/tao adapter。
    # adapter 実装は非既定 `webview` feature ゲートで headless 検証経路を壊さない）
    "crates/ruviform-ui",
    "crates/ruviform-ui-webview",
    # 利用側層サンプル（Issue #155 — GUI 非依存 CLI/headless 利用例。共有 headless サービスの外側アダプタ）
    "crates/ruviform-cli-sample",
    # 利用側層 可視化基盤（Issue #157 — 波形 LOD・スペクトログラム STFT・
    # タイムラインの汎用インタラクティブ表示プリミティブ。GUI/WebView 非依存で
    # headless 検証経路を維持。ruviform-ui との結合は adapter 側の責務）
    "crates/ruviform-viz",
]

[workspace.package]
version = "0.1.0"         # 仮置き。公開方針確定前の暫定値
edition = "2024"          # Issue #34 で確定（2021→2024）。rust-version >= 1.85 を要求する
rust-version = "1.89"     # MSRV。Issue #34 で 1.85 確定 → Issue #52 / ADR-034JNYt58J8NlUkn6RfJMs で 1.89 に引上げ（fearless_simd 1.1.0 の MSRV 要求に合わせ本番昇格前提を解禁。mise pin (1.99.0) を超えない）
license = "MIT"           # 仮置き。配布方針確定前の暫定値
publish = false           # 未決定クレートは公開しない（licensing ADR 原則）。メンバーは publish.workspace = true で継承する

[workspace.lints.rust]
unsafe_code = "warn"      # lint ゲートの -D warnings で実質 deny。例外は局所許可＋SAFETY コメント（後述）
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"  # pedantic の過剰適用を初期段階で緩和（仮置き）
# restriction グループの lint を個別に warn 昇格: 全公開 enum に `#[non_exhaustive]` を
# 強制する（docs/adr/public-enum-non-exhaustive-policy.md）。`lint`/`lint-ci` の
# `-D warnings` ゲートで実質 deny として機能する。
exhaustive_enums = "warn"

# Local development: retain full debug information.
[profile.dev]
debug = "full"

# CI: inherit development checks but generate smaller build artifacts.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

# CI: dependencies outside the workspace do not need debug symbols.
[profile.ci.package."*"]
debug = "none"
